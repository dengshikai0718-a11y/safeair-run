  if (!userMarker) {
    userMarker = L.marker(latlng, {
      icon: L.divIcon({ className: 'user-marker', html: '<span class="pulse"></span><span class="dot"></span>', iconSize: [16, 16] }),
      keyboard: false, interactive: false, zIndexOffset: -100,
    }).addTo(map);
  } else {
    userMarker.setLatLng(latlng);
  }
}

/** 右下角「回到我的位置」按鈕 */
function addLocateControl() {
  const Locate = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd() {
      const btn = L.DomUtil.create('button', 'leaflet-control map-btn');
      btn.type = 'button';
      btn.title = '回到我的位置';
      btn.setAttribute('aria-label', '回到我的位置');
      btn.innerHTML = iconSvg('i-locate');
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.on(btn, 'click', () => {
        if (state.userPos) {
          flyToPoint(state.userPos.lat, state.userPos.lng, CONFIG.LOCATED_ZOOM);
        } else {
          locateUser({ recenter: true });
        }
      });
      return btn;
    },
  });
  new Locate().addTo(map);
}

/* =====================================================================
   §8 UI：狀態管理與畫面渲染
   ===================================================================== */
const state = {
  selectedId: null,     // 目前選取的跑點 id
  userPos: null,        // { lat, lng, accuracy }；未取得定位時為 null
  evaluations: {},      // spotId → evaluate() 判定結果
  userEvaluation: null, // 使用者目前位置的判定結果
  dataMode: 'live',     // 'live' | 'normal' | 'pollution' | 'storm'
  data: null,           // { mode, pm, wx, updatedAt }：最近一次載入的原始資料
  readings: {},         // spotId → { pm25, pmEstimate, rain, uvi, feels }
  userReading: null,    // 使用者目前位置的四項指標
  searchPlace: null,    // 搜尋到的地點 { name, sub, lat, lng, inTaipei }
  searchReading: null,  // 搜尋位置的四項指標（僅台北市內）
  searchEvaluation: null,
  cardFocus: null,      // 資訊卡目前對象：'spot' | 'search' | 'fav' | null（null＝目前位置）
  favFocusId: null,     // cardFocus === 'fav' 時的最愛自選點位 id
  favEditing: null,     // 命名 / 改名表單：{ mode: 'add' | 'rename', id?, value, error }
  favReadings: {},      // 最愛自選點位 id → 四項指標
  favEvaluations: {},   // 最愛自選點位 id → 判定結果
  monitor: { on: false, perm: 'default', permReason: '', lastStatus: null, msg: '', testMsg: '' }, // 背景監測（預設關閉）
  geoFailed: false,     // 定位失敗（供資訊卡提示「未取得定位」）
  sheetExpanded: false, // 窄螢幕 Bottom Sheet 是否展開
};

/**
 * 跑點列表排序：先依燈號（綠 → 黃 → 紅 → 資料不足），
 * 同燈號再依與使用者的直線距離由近到遠；未取得定位時改依跑點名稱。
 */
const STATUS_ORDER = { green: 0, yellow: 1, red: 2, unknown: 3 };
function sortedSpots() {
  const pos = state.userPos;
  const tie = pos
    ? (a, b) => haversine(pos.lat, pos.lng, a.lat, a.lng) - haversine(pos.lat, pos.lng, b.lat, b.lng)
    : (a, b) => a.name.localeCompare(b.name, 'zh-Hant');
  return RUN_SPOTS.slice().sort((a, b) =>
    (STATUS_ORDER[getSpotStatus(a.id)] - STATUS_ORDER[getSpotStatus(b.id)]) || tie(a, b));
}

/** 渲染側邊欄跑點列表 */
/** 跑點列表項（列表與推薦共用）：第一行名稱；第二行「狀態文字・行政區・類型」，狀態文字不斷字換行 */
function spotItemHtml(spot, distM) {
  const status = getSpotStatus(spot.id);
  const meta = STATUS_META[status];
  const dist = distM === null || distM === undefined ? '' : `<span class="dist num">${formatKm(distM)}</span>`;
  return `<li><button type="button" class="spot-item ${meta.cls}" data-id="${spot.id}"
              aria-current="${state.cardFocus === 'spot' && state.selectedId === spot.id}">
    <span class="status-dot" title="${meta.label}">${iconSvg(meta.icon)}</span>
    <span class="meta">
      <span class="name">${escapeHtml(spot.name)}</span>
      <span class="sub"><span class="st-label">${meta.label}</span><span class="where">・${escapeHtml(spot.district)}・${SPOT_TYPE_LABEL[spot.type] || ''}</span></span>
    </span>${dist}</button></li>`;
}

function renderList() {
  const pos = state.userPos;
  const html = sortedSpots().map((spot) =>
    spotItemHtml(spot, pos ? haversine(pos.lat, pos.lng, spot.lat, spot.lng) : null)).join('');
  document.querySelectorAll('.js-spotlist').forEach((ul) => { ul.innerHTML = html; });
}

/** 資料來源標記（側邊欄底部與窄螢幕頂部各一個）與更新時間 */
function renderSourceStatus() {
  const st = getSourceStatus();
  const cls = st.kind === 'live' ? 'is-live' : st.kind === 'loading' ? 'is-loading' : 'is-offline';
  const icon = st.kind === 'live' ? 'i-check-circle' : 'i-info';
  document.querySelectorAll('[data-src]').forEach((wrap) => {
    const popId = `srcPop-${wrap.dataset.src}`;
    const open = wrap.classList.contains('open');
    wrap.innerHTML = `<button type="button" class="src-badge ${cls}" aria-expanded="${open}" aria-describedby="${popId}"
        aria-label="資料來源：${st.label}（點擊查看原因）">${iconSvg(icon)}${st.label}</button>
      <div class="src-pop${wrap.dataset.src === 'mobile' ? ' below' : ''}" id="${popId}" role="tooltip">
        <ul>${st.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join('')}</ul></div>`;
  });
  if (state.data) {
    document.querySelectorAll('.js-updated').forEach((t) => {
      t.textContent = formatTaipei(state.data.updatedAt); t.dateTime = state.data.updatedAt.toISOString();
    });
  }
}

/** 資料模式切換按鈕 */
function renderModeSwitch() {
  const html = DATA_MODES.map((m) =>
    `<button type="button" data-mode="${m.id}" aria-pressed="${state.dataMode === m.id}">${m.label}</button>`).join('');
  document.querySelectorAll('.js-modeseg').forEach((seg) => { seg.innerHTML = html; });
}

/** 切換資料模式並重新載入 */
function setDataMode(mode) {
  if (!DATA_MODES.some((m) => m.id === mode) || mode === state.dataMode) return;
  state.dataMode = mode;
  renderModeSwitch();
  refreshData();
}

/** 全部重新渲染 */
function render() {
  renderMarkers();
  renderList();
  renderUserMarker();
  renderSourceStatus();
  renderFavMarkers();
  renderCards();
  renderFavorites();
}

/** 目前是否為窄螢幕版面（< 768px） */
const isNarrow = () => !window.matchMedia('(min-width: 768px)').matches;
const SHEET_COLLAPSED_PX = 140;

/**
 * 飛到指定座標。窄螢幕時 Bottom Sheet 蓋住下方，把目標偏移到「可見地圖區」的中央。
 */
function flyToPoint(lat, lng, zoom, duration = 0.6) {
  const z = Math.max(map.getZoom(), zoom);
  let target = L.latLng(lat, lng);
  if (isNarrow()) {
    const pt = map.project(target, z);
    pt.y += SHEET_COLLAPSED_PX / 2;
    target = map.unproject(pt, z);
  }
  map.flyTo(target, z, { duration });
}

/** 選取跑點：地圖平移、收合 Sheet 並更新畫面 */
function selectSpot(id, { pan = true } = {}) {
  const spot = RUN_SPOTS.find((s) => s.id === id);
  if (!spot) return;
  state.selectedId = id;
  state.cardFocus = 'spot';
  state.favEditing = null;
  setSheet(false);
  if (pan) flyToPoint(spot.lat, spot.lng, CONFIG.SPOT_ZOOM);
  render();
}

/** 取消選取：移除搜尋標記，資訊卡回到「目前位置」（Leaflet 拖曳地圖不會觸發 click，不會誤關） */
function clearSelection() {
  if (state.selectedId === null && !state.searchPlace && state.cardFocus === null) return;
  state.favEditing = null;
  state.favFocusId = null;
  const outside = state.searchPlace && !state.searchPlace.inTaipei && state.searchPlace.kind !== 'pick'; // 地圖選點沒有移動地圖，不必飛回
  state.selectedId = null;
  state.searchPlace = null;
  state.cardFocus = null;
  renderSearchMarker();
  if (outside) map.flyTo(CONFIG.DEFAULT_CENTER, CONFIG.DEFAULT_ZOOM); // 從市外地點回到台北
  render();
}

/** 選取搜尋到的地點：平移、放置搜尋標記；台北市內才計算環境狀態 */
function selectSearchPlace(place) {
  state.searchPlace = place;
  state.searchReading = null;       // 清掉前一個地點的數值（含已查到的氣象），避免新地點短暫顯示舊資料
  state.searchEvaluation = null;
  if (state.data) delete state.data.wx.byKey.search;
  state.selectedId = null;
  state.cardFocus = 'search';
  state.favEditing = null;
  setSheet(false);
  renderSearchMarker();
  if (place.kind === 'pick') {
    // 地圖選點：不移動地圖，除非該點被窄螢幕的 Bottom Sheet 蓋住
    if (isNarrow() && map.latLngToContainerPoint([place.lat, place.lng]).y > map.getSize().y - SHEET_COLLAPSED_PX - 50) {
      flyToPoint(place.lat, place.lng, 0, 0.4);
    }
  } else {
    flyToPoint(place.lat, place.lng, place.inTaipei ? CONFIG.SPOT_ZOOM : CONFIG.DEFAULT_ZOOM);
  }
  render();
  if (place.inTaipei) ensureSearchWeather(); // 只替這一點補查氣象，不重抓全部資料
}

/**
 * 補查「搜尋 / 選取位置」的氣象，不重新載入全部資料。
 * - 即時氣象：單點請求 Open-Meteo（失敗則該點氣象顯示「—」並標示部分資料暫缺）。
 * - Mock：沿用最近跑點的情境值。用序號避免快速連續選點時舊結果蓋掉新結果。
 */
let placeWxSeq = 0;
/** 取得單一座標的氣象（即時：單點請求；失敗回傳全 null。Mock：沿用最近跑點的情境值） */
function fetchPointWeather(key, lat, lng) {
  const pt = { key, lat, lng };
  if (state.data.wx.mode === 'live') { // 即時：回傳 Promise
    return loadWeatherLive([pt]).then((r) => r.byKey[key]).catch(() => ({ rain: null, uvi: null, feels: null }));
  }
  // Mock：同步回傳（不發請求，結果立即可用）
  return buildMockWeather(state.data.mode === 'live' ? 'normal' : state.data.mode, [pt])[key];
}

async function ensureSearchWeather() {
  const place = state.searchPlace;
  if (!place || !place.inTaipei || !state.data) return;
  const seq = ++placeWxSeq;
  const got = fetchPointWeather('search', place.lat, place.lng);
  const wx = got && typeof got.then === 'function' ? await got : got; // Mock 時不經過 await，結果同步套用
  if (seq !== placeWxSeq || state.searchPlace !== place || !state.data) return;
  state.data.wx.byKey.search = wx;
  computeReadings();
  render();
}

/* =====================================================================
   §6 換點推薦
   ===================================================================== */
/**
 * 依對象推薦跑點（5 km 內，Haversine；最多 3 筆；先依燈號、再依距離）：
 * - kind 'spot'（選取的跑點）：只在該跑點為 🟡 / 🔴 時提供，列出燈號「嚴格較佳」的跑點（排除自己）→ 標題「替代跑點」；
 *   🟢 / 資料不足回傳 null（不顯示區塊）。
 * - kind 'place'（目前位置、搜尋地點、地圖選點）：一律列出 5 km 內的跑點，不論燈號 → 標題「附近跑點」。
 * 回傳 [{ spot, status, distM }]（可為空陣列）或 null。
 */
function recommendSpots(lat, lng, status, excludeId = null, kind = 'spot') {
  if (kind === 'spot' && status !== 'yellow' && status !== 'red') return null;
  const rank = STATUS_ORDER[status];
  return RUN_SPOTS
    .filter((sp) => sp.id !== excludeId)
    .map((sp) => ({ spot: sp, status: getSpotStatus(sp.id), distM: haversine(lat, lng, sp.lat, sp.lng) }))
    .filter((x) => x.distM <= CONFIG.REC.radiusM &&
                   (kind === 'place' || (x.status !== 'unknown' && STATUS_ORDER[x.status] < rank)))
    .sort((a, b) => STATUS_ORDER[a.status] - STATUS_ORDER[b.status] || a.distM - b.distM)
    .slice(0, CONFIG.REC.max);
}

const REC_TEXT = {
  spot:  { title: '替代跑點', empty: '附近暫無更佳跑點，建議改至室內運動' },
  place: { title: '附近跑點', empty: '5 公里內沒有收錄的跑點' },
};
function recommendHtml(rec, kind = 'spot') {
  if (rec === null) return '';
  const tx = REC_TEXT[kind];
  return `<section class="rec" aria-label="${tx.title}"><h3 class="rec-title">${tx.title}</h3>${
    rec.length
      ? `<ul class="spot-list rec-list">${rec.map((x) => spotItemHtml(x.spot, x.distM)).join('')}</ul>`
      : `<p class="rec-empty">${tx.empty}</p>`}</section>`;
}

/* =====================================================================
   §8-2 資訊卡
   ===================================================================== */
const LEVEL_TEXT = { green: '良好', yellow: '留意', red: '不建議', none: '無資料' };

/** 單項指標格：標籤＋燈號圓點、數值（缺值顯示「—」） */
function metricHtml(ind, reading, ev) {
  const v = reading ? reading[ind.key] : null;
  const lv = ev && ev.levels ? ev.levels[ind.key] : null;
  const cls = lv ? STATUS_META[lv].cls : 'st-unknown';
  return `<div class="metric ${cls}">
    <div class="m-label"><span class="lv-dot" role="img" aria-label="${LEVEL_TEXT[lv || 'none']}"></span>${ind.label}</div>
    <div class="m-val num">${fmtVal(v, ind.digits)}${v === null || v === undefined ? '' : `<small>${ind.unit}</small>`}</div>
  </div>`;
}

/**
 * 資訊卡內容。
 * @param {{title:string, sub:string, ev:object, reading:object, closable:boolean, ref:{lat:number,lng:number,excludeId:?number,kind:'spot'|'place'}}} o
 */
function cardHtml({ title, sub, ev, reading, closable, ref, actions = '', below = '', favNote = '' }) {
  const status = ev.status;
  const meta = STATUS_META[status];
  const notes = [];
  if (ev.partial && status !== 'unknown') notes.push('部分資料暫缺');
  const est = reading && reading.pmEstimate;
  if (est && !est.nearby) notes.push(`${CONFIG.IDW.nearLabelM / 1000} 公里內無測站，數值以較遠測站推估`);
  if (est && est.nearest && est.nearest.pmFrom === 'avg') notes.push('PM2.5 使用移動平均值（最近測站暫缺即時值）');
  const src = getSourceStatus();
  return `<article class="card ${meta.cls}" aria-label="${escapeHtml(title)}環境狀態">
    <div class="card-head">
      <span class="status-dot">${iconSvg(meta.icon)}</span>
      <div class="titles"><h2 class="card-title">${escapeHtml(title)}</h2><p class="card-sub">${escapeHtml(sub)}</p></div>
      <div class="card-actions">${actions}${closable ? `<button type="button" class="card-close" data-action="clear-selection" aria-label="取消選取，改看目前位置">${iconSvg('i-x')}</button>` : ''}</div>
    </div>
    ${below}
    <span class="chip">${iconSvg(meta.icon)}${meta.label}</span>
    <p class="card-advice">${escapeHtml(adviceFor(ev))}</p>
    <div class="metrics">${INDICATORS.map((ind) => metricHtml(ind, reading, ev)).join('')}</div>
    ${notes.concat(favNote ? [favNote] : []).map((n) => `<p class="card-note">${escapeHtml(n)}</p>`).join('')}
    ${ref ? recommendHtml(recommendSpots(ref.lat, ref.lng, status, ref.excludeId, ref.kind), ref.kind) : ''}
    <p class="card-foot">更新 ${state.data ? formatTaipei(state.data.updatedAt) : '—'}・${escapeHtml(src.label)}</p>
    ${closable ? '' : `<p class="card-tip">${pickTip()}</p>`}
  </article>`;
}

/** 地圖選點的操作提示：以主要輸入裝置判斷（觸控 → 長按；滑鼠 → 右鍵），不看螢幕寬度 */
const isTouchPrimary = () => window.matchMedia('(pointer: coarse)').matches;
const pickTip = () => (isTouchPrimary() ? '長按地圖任一點，查看當地環境' : '在地圖上按右鍵，查看當地環境');

/** 搜尋到市界外的地點：只顯示訊息，不計算燈號 */
function outOfScopeCardHtml(place) {
  return `<article class="card st-unknown" aria-label="${escapeHtml(place.name)}">
    <div class="card-head">
      <span class="status-dot">${iconSvg('i-info')}</span>
      <div class="titles"><h2 class="card-title">${escapeHtml(place.name)}</h2><p class="card-sub">${escapeHtml(place.sub || '搜尋位置')}</p></div>
      <div class="card-actions">${favBtnHtml('outside', false, FAV_MSG.outside)}<button type="button" class="card-close" data-action="clear-selection" aria-label="取消選取，回到台北">${iconSvg('i-x')}</button></div>
    </div>
    <p class="card-advice">目前僅支援台北市</p>
  </article>`;
}

/** 星形按鈕：加入 / 移除我的最愛；reason 有值且尚未加入時為「停用」外觀（仍可點擊以顯示原因） */
function favBtnHtml(target, on, reason = '') {
  const off = !on && !!reason;
  const label = on ? '從我的最愛移除' : (reason || '加入我的最愛');
  return `<button type="button" class="fav-btn${off ? ' is-disabled' : ''}" data-action="toggle-fav" data-fav-target="${target}"
    aria-pressed="${on}"${off ? ' aria-disabled="true"' : ''} aria-label="${escapeHtml(label)}" title="${escapeHtml(label)}">${iconSvg('i-star')}</button>`;
}

/** 命名 / 改名表單（加入搜尋地點或地圖選點時必填；輸入框預設空白，只用 placeholder 提示） */
function favFormHtml() {
  const ed = state.favEditing;
  if (!ed) return '';
  const len = [...String(ed.value)].length;
  return `<form class="fav-form" data-fav-form novalidate>
    <input class="fav-name-input" type="text" maxlength="${FAV.nameMax}" autocomplete="off" enterkeyhint="done"
      placeholder="${ed.mode === 'add' ? '為這個地點命名（例如：家附近）' : '輸入新名稱'}" value="${escapeHtml(ed.value)}"
      aria-label="${ed.mode === 'add' ? '最愛名稱' : '新名稱'}（1 到 ${FAV.nameMax} 字）">
    <div class="fav-form-row"><span class="fav-count">${len}/${FAV.nameMax}</span>
      <button type="submit" class="btn">${ed.mode === 'add' ? '加入最愛' : '儲存名稱'}</button>
      <button type="button" class="link-btn" data-action="fav-cancel">取消</button></div>
    <p class="fav-error" role="alert">${escapeHtml(ed.error || '')}</p>
  </form>`;
}

/** 依狀態決定資訊卡：搜尋位置 → 最愛自選點位 → 選取的跑點 → 目前位置 → 提示 */
function infoCardHtml() {
  const hint = (msg) => `<div class="card card-hint"><svg class="icon"><use href="#i-info"/></svg>${msg}</div>`;
  if (!state.data) return hint('資料載入中…');
  const place = state.searchPlace;
  if (state.cardFocus === 'search' && place) {
    if (!place.inTaipei) return outOfScopeCardHtml(place);
    if (!state.searchEvaluation) return hint('資料載入中…');
    const full = favStore.isFull();
    return cardHtml({ title: place.name, sub: place.sub || '搜尋位置', ev: state.searchEvaluation, reading: state.searchReading,
                      closable: true, ref: { lat: place.lat, lng: place.lng, excludeId: null, kind: 'place' },
                      actions: favBtnHtml('temp', false, full ? FAV_MSG.full : ''), favNote: full ? FAV_MSG.full : '',
                      below: state.favEditing && state.favEditing.mode === 'add' ? favFormHtml() : '' });
  }
  const fav = state.cardFocus === 'fav' ? favStore.get(state.favFocusId) : null;
  if (fav && fav.kind === 'place') {
    const ev = state.favEvaluations[fav.id];
    if (!ev) return hint('資料載入中…');
    return cardHtml({ title: fav.name, sub: fav.sub || '我的最愛', ev, reading: state.favReadings[fav.id], closable: true,
                      ref: { lat: fav.lat, lng: fav.lng, excludeId: null, kind: 'place' },
                      actions: `${favBtnHtml(`fav:${fav.id}`, true)}<button type="button" class="card-rename" data-action="fav-rename" aria-label="改名" title="改名">${iconSvg('i-edit')}</button>`,
                      below: state.favEditing && state.favEditing.mode === 'rename' ? favFormHtml() : '' });
  }
  const spot = RUN_SPOTS.find((x) => x.id === state.selectedId);
  if (state.cardFocus === 'spot' && spot && state.evaluations[spot.id]) {
    const on = favStore.hasSpot(spot.id), full = !on && favStore.isFull();
    return cardHtml({ title: spot.name, sub: `${spot.district}・${SPOT_TYPE_LABEL[spot.type] || ''}`,
                      ev: state.evaluations[spot.id], reading: state.readings[spot.id], closable: true,
                      ref: { lat: spot.lat, lng: spot.lng, excludeId: spot.id, kind: 'spot' },
                      actions: favBtnHtml(`spot:${spot.id}`, on, full ? FAV_MSG.full : ''), favNote: full ? FAV_MSG.full : '' });
  }
  if (state.userPos && state.userEvaluation) {
    return cardHtml({ title: '目前位置', sub: inBBox(state.userPos.lat, state.userPos.lng) ? '依附近測站與氣象估算' : '不在台北市範圍內',
                      ev: state.userEvaluation, reading: state.userReading, closable: false,
                      ref: { lat: state.userPos.lat, lng: state.userPos.lng, excludeId: null, kind: 'place' } });
  }
  return hint(`點選地圖上的跑點，查看是否適合出發${state.geoFailed ? '<br>（未取得定位，無法顯示目前位置）' : ''}<br>${pickTip()}`);
}

function renderCards() {
  const html = infoCardHtml();
  // 命名表單開著時資料更新會重繪資訊卡：保留輸入框的焦點與游標位置，避免打字中途被打斷
  const a = document.activeElement;
  const inputs = [...document.querySelectorAll('.js-card .fav-name-input')];
  const idx = a && a.classList && a.classList.contains('fav-name-input') ? inputs.indexOf(a) : -1;
  const sel = idx >= 0 ? [a.selectionStart, a.selectionEnd] : null;
  document.querySelectorAll('.js-card').forEach((el) => { el.innerHTML = html; });
  if (idx >= 0) {
    const el = document.querySelectorAll('.js-card .fav-name-input')[idx];
    if (el) { el.focus(); try { el.setSelectionRange(sel[0], sel[1]); } catch (e) { /* 略過 */ } }
  }
}

/* =====================================================================
   §8-3 搜尋（只搜尋內建跑點與行政區；最多 5 筆；鍵盤可操作）
   ===================================================================== */
const SEARCH_MAX = 5;
const normQ = (str) => str.trim().toLowerCase().replace(/臺/g, '台');

/** 建立搜尋索引：行政區（來自跑點資料）＋跑點 */
function buildSearchIndex() {
  const items = [];
  const districts = [...new Set(RUN_SPOTS.map((x) => x.district))];
  for (const d of districts) {
    const n = RUN_SPOTS.filter((x) => x.district === d).length;
    items.push({ kind: 'district', label: d, sub: `${n} 個跑點`, key: normQ(d), alt: normQ(d.replace(/區$/, '')) });
  }
  for (const sp of RUN_SPOTS) {
    items.push({ kind: 'spot', id: sp.id, label: sp.name, sub: sp.district, key: normQ(sp.name), alt: '' });
  }
  return items;
}

/** 比對：行政區開頭相符最優先，其次跑點名稱開頭，再其次部分相符 */
function searchItems(q) {
  const n = normQ(q);
  if (!n) return [];
  const idx = buildSearchIndex();
  const scored = [];
  idx.forEach((it, i) => {
    let score = null;
    if (it.kind === 'district') {
      if (it.key.startsWith(n) || it.alt.startsWith(n)) score = 0;
      else if (it.key.includes(n)) score = 2;
    } else if (it.key.startsWith(n)) score = 1;
    else if (it.key.includes(n)) score = 3;
    if (score !== null) scored.push({ it, score, i });
  });
  return scored.sort((a, b) => a.score - b.score || a.i - b.i).slice(0, SEARCH_MAX).map((x) => x.it);
}

/** 行政區：縮放到該區全部跑點 */
function focusDistrict(name) {
  const spots = RUN_SPOTS.filter((x) => x.district === name);
  if (!spots.length) return;
  setSheet(false);
  const bottom = isNarrow() ? SHEET_COLLAPSED_PX + 40 : 60;
  map.fitBounds(L.latLngBounds(spots.map((x) => [x.lat, x.lng])), {
    paddingTopLeft: [60, isNarrow() ? 120 : 60], paddingBottomRight: [60, bottom], maxZoom: CONFIG.SPOT_ZOOM, animate: true,
  });
}

/* ---------------------------------------------------------------------
   地理編碼：OpenStreetMap Nominatim（只在使用者按下「搜尋地點」或 Enter 時查詢）
   使用條款（https://operations.osmfoundation.org/policies/nominatim/）：
   - 由使用者操作直接觸發的搜尋可以使用；嚴禁在客戶端實作自動完成（所以不會邊打字邊查）。
   - 每秒最多 1 次請求（這裡強制間隔 ≥ 1.1 秒）、同樣的查詢只查一次（快取於記憶體）。
   - 須以 Referer 或 User-Agent 辨識應用程式：瀏覽器無法自訂 User-Agent，靠 Referer 辨識，
     因此請用 localhost 或 GitHub Pages 開啟；以 file:// 雙擊開啟時沒有 Referer，服務端可能拒絕。
   - 資料為 ODbL，須標示「© OpenStreetMap 貢獻者」（地圖右下角已標示）。
   - 回傳非 JSON（被限流時為 HTML 錯誤頁）或逾時一律視為失敗，介面顯示「找不到這個地點，試試地標或路名」。
   --------------------------------------------------------------------- */
const geoCache = new Map();
let geoLastAt = 0;

/** 查詢地點，回傳最多 5 筆 { name, sub, lat, lng, inTaipei }；台北市內的結果排在前面 */
async function geocode(query) {
  const key = normQ(query);
  if (geoCache.has(key)) return geoCache.get(key);
  const wait = geoLastAt + CONFIG.GEOCODER.minIntervalMs - Date.now();
  if (wait > 0) await new Promise((r) => setTimeout(r, wait));
  geoLastAt = Date.now();
  const b = CONFIG.BBOX;
  const params = new URLSearchParams({
    q: query.trim(), format: 'jsonv2', countrycodes: 'tw', 'accept-language': 'zh-TW', addressdetails: '1',
    limit: String(CONFIG.GEOCODER.limit + 3), dedupe: '1',
    viewbox: `${b.minLng},${b.maxLat},${b.maxLng},${b.minLat}`, bounded: '0', // 台北範圍框只作為優先參考，不限制結果
  });
  // 不加 cache: 'no-store'：該選項會讓瀏覽器附上 Cache-Control / Pragma 請求標頭，使跨網域請求多一次 preflight 而被擋
  const json = await fetchJson(`${CONFIG.GEOCODER.url}?${params}`, CONFIG.FETCH_TIMEOUT_MS, {});
  if (!Array.isArray(json)) throw new DataError('parse');
  const out = [];
  for (const x of json) {
    const lat = Number(x.lat), lng = Number(x.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lng)) continue;
    const name = (x.name || String(x.display_name || '').split(',')[0] || '').trim();
    if (!name) continue;
    // 同名且 400 m 內視為重複（例如同一站名的多個公車站牌）
    if (out.some((q) => q.name === name && haversine(q.lat, q.lng, lat, lng) < 400)) continue;
    const a = x.address || {};
    const sub = [...new Set([a.city_district || a.suburb || a.town, a.city || a.county || a.state].filter(Boolean))].join('・');
    out.push({ name, sub, lat, lng, inTaipei: pointInPolygon(lat, lng) });
  }
  out.sort((p, q) => Number(q.inTaipei) - Number(p.inTaipei)); // 穩定排序：台北市優先
  const res = out.slice(0, CONFIG.GEOCODER.limit);
  geoCache.set(key, res);
  return res;
}

/** 搜尋標記：深色水滴形圖釘，與跑點（狀態色圓形）、使用者位置（藍點）明顯區分 */
let searchMarker = null;
function renderSearchMarker() {
  const place = state.searchPlace;
  if (!place) {
    if (searchMarker) { map.removeLayer(searchMarker); searchMarker = null; }
    return;
  }
  const icon = L.divIcon({
    className: 'search-marker',
    html: '<svg viewBox="0 0 32 42" width="32" height="42" aria-hidden="true"><path d="M16 1.5C8.5 1.5 2.5 7.5 2.5 15c0 10 13.5 25.5 13.5 25.5S29.5 25 29.5 15C29.5 7.5 23.5 1.5 16 1.5z" fill="#0F172A" stroke="#fff" stroke-width="2.5"/><circle cx="16" cy="15" r="5.5" fill="#fff"/></svg>',
    iconSize: [32, 42], iconAnchor: [16, 41],
  });
  if (!searchMarker) {
    searchMarker = L.marker([place.lat, place.lng], { icon, title: place.name, alt: `搜尋位置：${place.name}`, keyboard: true, zIndexOffset: 900 }).addTo(map);
    searchMarker.on('click', () => { state.cardFocus = 'search'; setSheet(false); render(); });
  } else {
    searchMarker.setLatLng([place.lat, place.lng]);
    searchMarker.setIcon(icon);
  }
  searchMarker.bindTooltip(place.name, { direction: 'top', offset: [0, -38] });
}

/**
 * 初始化一個搜尋元件（側邊欄與窄螢幕各一個，邏輯共用）。
 * 兩段式：打字時只做本機比對（跑點、行政區），最後一列固定為「搜尋地點：『輸入文字』」；
 * 點擊該列或（沒有可選的本機項目、且未用方向鍵選取時）按 Enter 才送出外部查詢，結果最多 5 筆供挑選。
 */
function initSearch(root) {
  const input = root.querySelector('input');
  const list = root.querySelector('.search-list');
  let rows = [];        // 目前下拉列：{ type: 'spot'|'district'|'geo'|'result'|'msg', ... }
  let active = -1;
  let seq = 0;          // 查詢序號：輸入改變或重新查詢時，舊結果作廢

  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); active = -1; };
  const selectable = (i) => rows[i] && rows[i].type !== 'msg';
  const paint = () => {
    list.querySelectorAll('li[data-i]').forEach((li) => li.setAttribute('aria-selected', String(Number(li.dataset.i) === active)));
    if (active >= 0) input.setAttribute('aria-activedescendant', `${list.id}-${active}`); else input.removeAttribute('aria-activedescendant');
  };
  const draw = () => {
    list.innerHTML = rows.map((r, i) => {
      if (r.type === 'msg') return `<li class="search-empty" role="option" aria-disabled="true">${escapeHtml(r.text)}${r.sub ? `<br><small>${escapeHtml(r.sub)}</small>` : ''}</li>`;
      if (r.type === 'geo') return `<li class="s-geo" role="option" id="${list.id}-${i}" data-i="${i}" aria-selected="false">${iconSvg('i-search')}搜尋地點：『${escapeHtml(r.query)}』</li>`;
      const kind = r.type === 'district' ? '行政區' : r.type === 'spot' ? '跑點' : (r.place.inTaipei ? '地點' : '台北市外');
      const label = r.type === 'result' ? r.place.name : r.label;
      const sub = r.type === 'result' ? r.place.sub : r.sub;
      return `<li role="option" id="${list.id}-${i}" data-i="${i}" aria-selected="false"><span class="s-kind">${kind}</span>${escapeHtml(label)}<span class="s-sub">${escapeHtml(sub || '')}</span></li>`;
    }).join('');
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    active = -1;
  };
  /** 本機比對（純本機，不送出任何請求）＋「搜尋地點」列 */
  const update = () => {
    seq++; // 輸入改變：作廢進行中的外部查詢
    const q = input.value;
    if (!normQ(q)) { close(); return; }
    rows = searchItems(q).map((it) => ({ ...it, type: it.kind }));
    rows.push({ type: 'geo', query: q.trim() });
    draw();
  };
  /** 送出外部地理編碼查詢（只在使用者明確操作時呼叫） */
  const runGeocode = async () => {
    const q = input.value.trim();
    if (!q) return;
    const mine = ++seq;
    rows = [{ type: 'msg', text: '搜尋中…' }];
    draw();
    let places = [], failed = null;
    try { places = await geocode(q); } catch (e) { failed = e; }
    if (mine !== seq) return; // 使用者已改字或重新查詢
    if (failed || !places.length) {
      rows = [{ type: 'msg', text: '找不到這個地點，試試地標或路名', sub: failed ? '（地點搜尋服務暫時無法使用，請稍後再試）' : '' }];
    } else {
      rows = places.map((p) => ({ type: 'result', place: p }));
    }
    draw();
  };
  const choose = (r) => {
    if (!r || r.type === 'msg') return;
    if (r.type === 'geo') { runGeocode(); return; }
    close();
    input.value = r.type === 'result' ? r.place.name : r.label;
    input.blur(); // 收起手機鍵盤
    if (r.type === 'spot') selectSpot(r.id);
    else if (r.type === 'district') focusDistrict(r.label);
    else selectSearchPlace(r.place);
  };

  input.addEventListener('input', update);
  input.addEventListener('focus', () => { if (list.hidden) update(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (list.hidden) update();
      const idx = rows.map((_, i) => i).filter(selectable);
      if (!idx.length) return;
      e.preventDefault();
      const pos = idx.indexOf(active);
      active = e.key === 'ArrowDown' ? idx[(pos + 1) % idx.length] : idx[(pos - 1 + idx.length) % idx.length];
      paint();
    } else if (e.key === 'Enter') {
      if (list.hidden) { if (input.value.trim()) { e.preventDefault(); update(); } return; }
      e.preventDefault();
      // 有選取列就選它；否則選第一個可選列（有本機符合者為第一筆，沒有則為「搜尋地點」）
      choose(selectable(active) ? rows[active] : rows.find((r) => r.type !== 'msg'));
    } else if (e.key === 'Escape') {
      if (!list.hidden) { e.stopPropagation(); close(); } else if (input.value) { input.value = ''; }
    }
  });
  // mousedown 先 preventDefault，避免輸入框先失焦導致選單消失而吃掉點擊
  list.addEventListener('mousedown', (e) => e.preventDefault());
  list.addEventListener('click', (e) => {
    const li = e.target.closest('li[data-i]');
    if (li) choose(rows[Number(li.dataset.i)]);
  });
  document.addEventListener('click', (e) => { if (!root.contains(e.target)) close(); });
}

/* =====================================================================
   §8-4 Bottom Sheet（窄螢幕）與設定選單
   ===================================================================== */
/** 讓右下控制鈕與 toast 隨 Sheet 高度上移；寬螢幕還原預設 */
function updateSheetOffset(h) {
  const root = document.documentElement.style;
  if (isNarrow()) root.setProperty('--sheet-offset', `${Math.round(h) + 12}px`); else root.removeProperty('--sheet-offset');
}

/** 展開 / 收合 Sheet */
function setSheet(expanded) {
  const sheet = document.getElementById('sheet');
  state.sheetExpanded = !!expanded;
  sheet.style.height = '';
  sheet.classList.toggle('expanded', state.sheetExpanded);
  document.body.classList.toggle('sheet-open', state.sheetExpanded);
  const handle = document.getElementById('sheetHandle');
  handle.setAttribute('aria-expanded', String(state.sheetExpanded));
  handle.setAttribute('aria-label', state.sheetExpanded ? '收合詳細資訊' : '展開詳細資訊');
  updateSheetOffset(state.sheetExpanded ? window.innerHeight * 0.8 : SHEET_COLLAPSED_PX);
}

/** 握把：點一下切換；上下拖曳改變高度，放開時吸附到收合或展開 */
function initSheet() {
  const sheet = document.getElementById('sheet');
  const handle = document.getElementById('sheetHandle');
  let startY = 0, startH = 0, h = 0, drag = false, moved = false;
  const max = () => window.innerHeight * 0.8;
  handle.addEventListener('pointerdown', (e) => {
    drag = true; moved = false; startY = e.clientY; startH = sheet.offsetHeight; h = startH;
    handle.setPointerCapture(e.pointerId);
    sheet.classList.add('dragging');
  });
  handle.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dy = startY - e.clientY;
    if (Math.abs(dy) > 6) moved = true;
    if (!moved) return;
    h = Math.min(Math.max(startH + dy, SHEET_COLLAPSED_PX), max());
    sheet.style.height = `${h}px`;
    updateSheetOffset(h);
  });
  const end = () => {
    if (!drag) return;
    drag = false;
    sheet.classList.remove('dragging');
    if (!moved) setSheet(!state.sheetExpanded);
    else setSheet(h > (SHEET_COLLAPSED_PX + max()) / 2);
  };
  handle.addEventListener('pointerup', end);
  handle.addEventListener('pointercancel', end);
  // 鍵盤（Enter / Space）會觸發 click 且 detail 為 0
  handle.addEventListener('click', (e) => { if (e.detail === 0) setSheet(!state.sheetExpanded); });
}

/** 設定選單開關（窄螢幕） */
function toggleSettings(open) {
  const menu = document.getElementById('settingsMenu');
  const btn = document.getElementById('settingsBtn');
  const willOpen = open === undefined ? menu.hidden : open;
  menu.hidden = !willOpen;
  btn.setAttribute('aria-expanded', String(willOpen));
}

/** 綁定 UI 事件 */
function bindUI() {
  // 列表點擊、資訊卡關閉鈕、資料模式切換（事件委派；側邊欄與 Sheet 各有一份）
  document.addEventListener('click', (e) => {
    if (e.target.closest('.fav-item')) return; // 最愛列由 initFavorites 處理
    const item = e.target.closest('.spot-item');
    if (item) { selectSpot(Number(item.dataset.id)); return; }
    if (e.target.closest('[data-action="clear-selection"]')) { clearSelection(); return; }
    if (e.target.closest('[data-action="toggle-monitor"]')) { setMonitoring(!state.monitor.on); return; }
    if (e.target.closest('[data-action="test-notify"]')) { testNotification(); return; }
    if (e.target.closest('[data-action="clear-cooldown"]')) { clearCooldowns(); state.monitor.testMsg = '已清除冷卻紀錄'; state.monitor.msg = ''; renderMonitor(); return; }
    const modeBtn = e.target.closest('.js-modeseg button[data-mode]');
    if (modeBtn) setDataMode(modeBtn.dataset.mode);
  });
  // 地圖空白處點一下：取消選取
  map.on('click', () => {
    if (pickHeld || Date.now() < suppressClickUntil) return; // 長按選點放開手指時的 click 不算「點空白處」
    clearSelection(); toggleSettings(false);
  });
  initMapPicking();
  // 窄螢幕：設定選單
  document.getElementById('settingsBtn').addEventListener('click', () => toggleSettings());
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#settingsMenu') && !e.target.closest('#settingsBtn')) toggleSettings(false);
  });
  document.querySelectorAll('.search[data-search]').forEach(initSearch);
  initSheet();
  // 資料來源標記：點擊切換原因說明（觸控裝置無 hover）；點其他地方或按 Esc 關閉
  document.addEventListener('click', (e) => {
    const badge = e.target.closest('.src-badge');
    document.querySelectorAll('.src-wrap').forEach((w) => {
      const toggle = badge && w.contains(badge);
      w.classList.toggle('open', toggle ? !w.classList.contains('open') : false);
      const b = w.querySelector('.src-badge');
      if (b) b.setAttribute('aria-expanded', w.classList.contains('open'));
    });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { document.querySelectorAll('.src-wrap.open').forEach((w) => w.classList.remove('open')); toggleSettings(false); }
  });
  // 版面在 768px 斷點切換時，地圖容器尺寸改變，需通知 Leaflet 重算
  const mq = window.matchMedia('(min-width: 768px)');
  const onChange = () => { map.invalidateSize(); setSheet(false); };
  if (mq.addEventListener) mq.addEventListener('change', onChange); else mq.addListener(onChange);
}

/* =====================================================================
   §7-2 定位（Geolocation API）
   ===================================================================== */

/**
 * 取得使用者位置。
 * - 成功：標記藍點；若在台北市範圍內則移至該處，否則保留全市視野並提示。
 * - 失敗 / 拒絕 / 不支援：維持台北車站為中心、縮放 12，並提示「未取得定位」。
 */
function locateUser({ recenter = true } = {}) {
  if (!('geolocation' in navigator)) {
    state.geoFailed = true; renderCards();
    showToast('未取得定位：此瀏覽器不支援定位，以台北車站為中心顯示');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const first = !state.userPos;
      state.geoFailed = false;
      state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      // 首次取得定位：重新載入，讓氣象請求納入使用者座標；之後只重算 IDW
      if (first) refreshData(); else if (state.data) computeReadings();
      render();
      if (!recenter) return;
      if (inBBox(state.userPos.lat, state.userPos.lng)) {
        flyToPoint(state.userPos.lat, state.userPos.lng, CONFIG.LOCATED_ZOOM, 0.8);
      } else {
        showToast('目前位置不在台北市範圍內，仍以全市跑點顯示');
      }
    },
    (err) => {
      const reason = err && err.code === 1 ? '定位權限被拒絕'
                   : err && err.code === 3 ? '定位逾時'
                   : '無法取得位置';
      state.geoFailed = true; renderCards();
      showToast(`未取得定位（${reason}），以台北車站為中心顯示`);
    },
    { enableHighAccuracy: true, timeout: CONFIG.GEO_TIMEOUT_MS, maximumAge: 60000 }
  );
}

/* =====================================================================
   §11 IDW 網格熱力圖（只在資料更新時計算；開關只切換圖層顯示）
   ===================================================================== */
const HEAT_COLORS = { green: [16, 185, 129], yellow: [245, 158, 11], red: [239, 68, 68] }; // 與跑點燈號同色系
// 圖例只描述 PM2.5 濃度高低，不使用跑點燈號用語（適合出發／建議留意／不建議前往），
// 避免「紅色不建議前往標記」壓在「適合出發」綠區上的矛盾。門檻與 classifyIndicator('pm25') 一致。
const HEAT_LEGEND = [
  { level: 'green',  text: 'PM2.5 低（≤ 15.4）' },
  { level: 'yellow', text: 'PM2.5 中（15.5–35.4）' },
  { level: 'red',    text: 'PM2.5 高（≥ 35.5）' },
];
let heatGroup = null;   // L.layerGroup：色塊圖層 + 無資料斜線圖層（一起開關）
let heatImg = null;     // 色塊 imageOverlay
let hatchImg = null;    // 無資料斜線 imageOverlay
let heatOn = false;
let heatField = null;   // 最近一次計算的數值場（供測試與 heatValueAt 使用）

/**
 * 計算熱力圖數值場，並畫成兩張 canvas（色塊、無資料斜線）。
 *
 * 作法：在台北市外框的外接矩形內，以 HEAT.cellM（75 m）的細格逐格呼叫 idwEstimate（與跑點共用，規則只有一套）。
 * 不先算 300 m 網格再內插：300 m 網格的節點不會剛好落在測站上，測站附近的峰值會被相鄰節點平均壓低一級。
 * - 數值：全部有效測站的 IDW（測站 50 m 內採用該測站數值）。
 * - 留白：最近測站 > 8 km（CONFIG.IDW.heatBlankM）的格點不上色，改在市界內畫淡灰斜線。
 * - 色塊依 PM2.5 門檻離散上色，再以市界多邊形裁切；畫布垂直方向以 Web Mercator 對應，才能與 imageOverlay 對齊。
 */
function buildHeatField(stations) {
  const { HEAT } = CONFIG;
  const lats = TAIPEI_OUTLINE.map((q) => q[0]), lngs = TAIPEI_OUTLINE.map((q) => q[1]);
  const pad = 0.002;
  const minLat = Math.min(...lats) - pad, maxLat = Math.max(...lats) + pad;
  const minLng = Math.min(...lngs) - pad, maxLng = Math.max(...lngs) + pad;
  const midLat = (minLat + maxLat) / 2;
  const W = Math.ceil((maxLng - minLng) * 111320 * Math.cos(midLat * Math.PI / 180) / HEAT.cellM);
  const H = Math.ceil((maxLat - minLat) * 110950 / HEAT.cellM);
  const merc = (lat) => Math.log(Math.tan(Math.PI / 4 + lat * Math.PI / 360));
  const unmerc = (y) => (2 * Math.atan(Math.exp(y)) - Math.PI / 2) * 180 / Math.PI;
  const yTop = merc(maxLat), yBot = merc(minLat);

  const values = new Float64Array(W * H).fill(NaN);
  const img = new ImageData(W, H);
  const blank = new ImageData(W, H); // 無資料遮罩（alpha 255 = 無資料）
  let filled = 0;
  for (let py = 0; py < H; py++) {
    const lat = unmerc(yTop - (py + 0.5) / H * (yTop - yBot));
    for (let px = 0; px < W; px++) {
      const lng = minLng + (px + 0.5) / W * (maxLng - minLng);
      const est = idwEstimate(lat, lng, stations); // 與跑點共用同一個函式
      const o = (py * W + px) * 4;
      if (!est || est.heatBlank) { blank.data[o + 3] = 255; continue; } // 最近測站 > 8 km：留白
      values[py * W + px] = est.value;
      filled++;
      const c = HEAT_COLORS[classifyIndicator('pm25', est.value)];
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2]; img.data[o + 3] = 255;
    }
  }

  // 市界裁切路徑（以 canvas 座標；scale 為畫布相對資料細格的倍率）
  const clipPath = (ctx, scale) => {
    ctx.beginPath();
    TAIPEI_OUTLINE.forEach(([la, ln], i) => {
      const x = (ln - minLng) / (maxLng - minLng) * W * scale;
      const y = (yTop - merc(la)) / (yTop - yBot) * H * scale;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
  };
  const toCanvas = (data, w, h) => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').putImageData(data, 0, 0); return c;
  };

  // 色塊：先畫到暫存畫布，再裁切（putImageData 不受 clip 影響）
  const color = document.createElement('canvas'); color.width = W; color.height = H;
  let ctx = color.getContext('2d');
  clipPath(ctx, 1); ctx.clip(); ctx.drawImage(toCanvas(img, W, H), 0, 0);

  // 無資料斜線：高解析畫布（3 倍）畫 45° 淡灰線，只保留「市界內 ∩ 無資料」，邊緣因縮放自然羽化
  const HS = 3, hw = W * HS, hh = H * HS;
  const hatch = document.createElement('canvas'); hatch.width = hw; hatch.height = hh;
  ctx = hatch.getContext('2d');
  clipPath(ctx, HS); ctx.clip();
  ctx.strokeStyle = '#CBD5E1'; ctx.lineWidth = 1.2; // 淡灰細線（約 1px），避免像警告區
  ctx.beginPath();
  for (let x = -hh; x < hw; x += 16) { ctx.moveTo(x, hh); ctx.lineTo(x + hh, 0); }
  ctx.stroke();
  ctx.globalCompositeOperation = 'destination-in';
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(toCanvas(blank, W, H), 0, 0, hw, hh);

  return { W, H, minLat, maxLat, minLng, maxLng, yTop, yBot, merc, unmerc, values, filled,
           bounds: [[minLat, minLng], [maxLat, maxLng]], color, hatch };
}

/**
 * 讀取熱力圖在指定座標所在細格的資料：回傳 { value, lat, lng }（lat / lng 為該細格中心）。
 * 留白為 value = null；超出熱力圖範圍回傳 null。測試用（熱力圖等級 = idwEstimate 等級）。
 */
function heatPixelAt(lat, lng) {
  const f = heatField;
  if (!f) return null;
  const px = Math.floor((lng - f.minLng) / (f.maxLng - f.minLng) * f.W);
  const py = Math.floor((f.yTop - f.merc(lat)) / (f.yTop - f.yBot) * f.H);
  if (px < 0 || py < 0 || px >= f.W || py >= f.H) return null;
  const v = f.values[py * f.W + px];
  const cLat = f.unmerc(f.yTop - (py + 0.5) / f.H * (f.yTop - f.yBot));
  const cLng = f.minLng + (px + 0.5) / f.W * (f.maxLng - f.minLng);
  return { value: Number.isNaN(v) ? null : v, lat: cLat, lng: cLng };
}
function heatValueAt(lat, lng) {
  const px = heatPixelAt(lat, lng);
  return px ? px.value : null;
}

/** 資料更新後重新計算熱力圖（只在 refreshData 呼叫；開關不會重算） */
function updateHeatmap() {
  if (!state.data) return;
  const t0 = performance.now();
  heatField = buildHeatField(state.data.pm.stations);
  const f = heatField;
  const colorUrl = f.color.toDataURL('image/png'), hatchUrl = f.hatch.toDataURL('image/png');
  if (!heatGroup) {
    heatImg = L.imageOverlay(colorUrl, f.bounds, { opacity: CONFIG.HEAT.opacity, interactive: false, alt: 'PM2.5 熱力圖' });
    hatchImg = L.imageOverlay(hatchUrl, f.bounds, { opacity: CONFIG.HEAT.hatchOpacity, interactive: false, alt: '' });
    heatGroup = L.layerGroup([heatImg, hatchImg]);
  } else {
    heatImg.setUrl(colorUrl); heatImg.setBounds(f.bounds);
    hatchImg.setUrl(hatchUrl); hatchImg.setBounds(f.bounds);
  }
  f.stats = { W: f.W, H: f.H, filled: f.filled, stations: state.data.pm.stations.length, ms: Math.round(performance.now() - t0) };
  if (heatOn && !map.hasLayer(heatGroup)) heatGroup.addTo(map);
}

/** 開 / 關熱力圖並更新按鈕與圖例 */
function setHeatmap(on) {
  heatOn = !!on;
  document.getElementById('heatBtn').setAttribute('aria-pressed', String(heatOn));
  document.getElementById('heatLegend').hidden = !heatOn;
  if (!heatOn) document.getElementById('heatLegend').classList.remove('expanded');
  if (heatGroup) {
    if (heatOn && !map.hasLayer(heatGroup)) heatGroup.addTo(map);
    if (!heatOn && map.hasLayer(heatGroup)) map.removeLayer(heatGroup);
  }
}

/** 建立圖例並綁定開關 */
function initHeatControl() {
  const sw = (level) => `rgba(${HEAT_COLORS[level].join(',')},${CONFIG.HEAT.opacity})`; // 與疊在地圖上的實際顯示色一致
  const full = '<h3>PM2.5 推估（μg/m³）</h3><ul>' +
    HEAT_LEGEND.map((l) => `<li><span class="sw" style="background:${sw(l.level)}"></span>${l.text}</li>`).join('') +
    `<li><span class="sw blank"></span>無資料（${CONFIG.IDW.heatBlankM / 1000} km 內無測站）</li></ul>` +
    '<p class="note">依測站以反距離加權（IDW）估算，僅反映 PM2.5；各跑點是否適合出發，請看跑點燈號。</p>';
  // 窄螢幕的單行小圖例：低 / 中 / 高 / 無資料；點一下展開完整說明
  const short = ['低', '中', '高'];
  const compact = 'PM2.5 ' + HEAT_LEGEND.map((l, i) => `<span class="i"><span class="sw" style="background:${sw(l.level)}"></span>${short[i]}</span>`).join('') +
    '<span class="i"><span class="sw blank"></span>無資料</span>';
  const legend = document.getElementById('heatLegend');
  legend.innerHTML = `<button type="button" class="lg-compact" aria-expanded="false" aria-label="PM2.5 圖例，點一下展開說明">${compact}</button><div class="lg-full">${full}</div>`;
  legend.querySelector('.lg-compact').addEventListener('click', (e) => {
    const open = legend.classList.toggle('expanded');
    e.currentTarget.setAttribute('aria-expanded', String(open));
  });
  const ctl = document.getElementById('heatCtl');
  L.DomEvent.disableClickPropagation(ctl); // 點按鈕不要觸發地圖點擊
  L.DomEvent.disableScrollPropagation(ctl);
  document.getElementById('heatBtn').addEventListener('click', () => setHeatmap(!heatOn));
}

/* =====================================================================
   §7-3 地圖選點（不使用任何外部服務）
   - 觸控：長按 500 ms 選點；手指移動超過 10 px、放開、第二指（縮放）都會取消，因此不會與拖曳地圖衝突。
   - 滑鼠：按右鍵選點；雙擊放大維持 Leaflet 預設。
   - 「點一下空白處 = 取消選取」維持不變：長按放開後的那一次 click 會被忽略。
   - iOS Safari：以 CSS（-webkit-touch-callout / user-select）避免長按時跳出系統選單或選取文字。
   ===================================================================== */
let pickHeld = false;          // 長按已觸發、手指尚未放開
let suppressClickUntil = 0;    // 放開手指後短時間內忽略 click
let lastPickAt = 0;

/**
 * 長按偵測器（純狀態機；計時器可注入，方便在 runTests 用假時鐘測試）。
 * down → 計時 holdMs 後觸發 onTrigger(x, y)；move 超過 moveTolPx、up、cancel 或第二指按下則取消。
 */
function createLongPressDetector({ holdMs, moveTolPx, onTrigger, setTimer = setTimeout, clearTimer = clearTimeout }) {
  let timer = null, id = null, x0 = 0, y0 = 0;
  const cancel = () => { if (timer !== null) clearTimer(timer); timer = null; id = null; };
  return {
    down(pid, x, y) {
      if (timer !== null) { cancel(); return; } // 第二指按下（縮放手勢）：取消
      id = pid; x0 = x; y0 = y;
      timer = setTimer(() => { const px = x0, py = y0; timer = null; id = null; onTrigger(px, py); }, holdMs);
    },
    move(pid, x, y) { if (timer !== null && pid === id && Math.hypot(x - x0, y - y0) > moveTolPx) cancel(); },
    up(pid) { if (pid === id) cancel(); },
    cancel,
    isPending: () => timer !== null,
  };
}

/** 建立「地圖選取位置」：台北市界內以最近行政區中心點標示行政區；市界外只給座標 */
function buildPickPlace(lat, lng) {
  const inTaipei = pointInPolygon(lat, lng);
  return {
    kind: 'pick', name: '地圖選取位置', lat, lng, inTaipei,
    sub: inTaipei ? districtOf(lat, lng) : `座標 ${lat.toFixed(4)}, ${lng.toFixed(4)}`,
  };
}

/** 在指定座標選點：取代目前的搜尋 / 選點圖釘（畫面上只保留一個暫時圖釘） */
function pickAt(latlng) {
  lastPickAt = Date.now();
  // 只在有使用者操作紀錄時震動（否則 Chrome 會在 Console 印出 Intervention 警告）
  try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.isActive) navigator.vibrate(15); } catch (e) { /* 不支援震動就略過 */ }
  selectSearchPlace(buildPickPlace(latlng.lat, latlng.lng));
}

function initMapPicking() {
  const el = map.getContainer();
  const skip = (t) => t.closest && t.closest('.leaflet-control, .leaflet-marker-icon, .leaflet-popup, .leaflet-tooltip');
  const detector = createLongPressDetector({
    ...CONFIG.PICK,
    onTrigger: (x, y) => {
      const r = el.getBoundingClientRect();
      pickHeld = true;
      pickAt(map.containerPointToLatLng([x - r.left, y - r.top]));
    },
  });
  el.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' || skip(e.target)) return; // 滑鼠走右鍵
    detector.down(e.pointerId, e.clientX, e.clientY);
  });
  el.addEventListener('pointermove', (e) => detector.move(e.pointerId, e.clientX, e.clientY));
  const release = (e) => {
    detector.up(e.pointerId);
    if (pickHeld) { pickHeld = false; suppressClickUntil = Date.now() + 600; }
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);
  map.on('movestart zoomstart', () => detector.cancel()); // 地圖開始移動 / 縮放：取消
  // 觸控長按在部分瀏覽器（Android）會跳出系統內容選單，擋掉
  el.addEventListener('contextmenu', (e) => { if (e.pointerType !== 'mouse') e.preventDefault(); });
  // 右鍵（滑鼠）選點；觸控長按已由偵測器處理，這裡略過避免重複
  map.on('contextmenu', (e) => {
    const oe = e.originalEvent;
    if (oe && oe.pointerType && oe.pointerType !== 'mouse') return;
    if (oe && oe.preventDefault) oe.preventDefault();
    if (!(oe && oe.pointerType) && Date.now() - lastPickAt < 800) return; // 沒有 pointerType 的舊式事件才需要防重複
    pickAt(e.latlng);
  });
}

/* =====================================================================
   §8-5 我的最愛
   - 可加入：內建跑點、搜尋地點、地圖選點（台北市內）；不可加入：目前位置（會移動）、台北市界外。
   - 上限 5 個；自選點位需命名（1–20 字，加入時輸入框預設空白），之後可改名；內建跑點沿用跑點名稱。
   - 儲存於 localStorage（鍵 safeair.favorites.v1，內容含版本號 v，日後搬到帳號系統時用來轉換格式）；
     儲存空間不可用（無痕 / 停用）時退回記憶體並提示「最愛無法保存」。
   - 最愛只存在這台裝置與這個瀏覽器；iPhone 主畫面 App 與 Safari 的 localStorage 是分開的。
   - 資料層 createFavStore 是純函式風格（儲存空間可注入），runTests 用假的儲存空間測試，不會動到真正的最愛。
   ===================================================================== */
const FAV = { key: 'safeair.favorites.v1', version: 1, max: 5, nameMax: 20 };
const FAV_MSG = {
  full: `最愛已滿（${FAV.max} 個），請先移除一個`,
  outside: '目前僅支援台北市',
  nameEmpty: '請輸入名稱',
  nameLong: `名稱最多 ${FAV.nameMax} 字`,
  exists: '已經在我的最愛中',
  noStorage: '最愛無法保存：此瀏覽器停用了儲存空間，關閉頁面後最愛會消失',
};

/** 名稱驗證：去頭尾空白後 1–20 字（以字元計，emoji 算一個字） */
function validateFavName(raw) {
  const name = String(raw === null || raw === undefined ? '' : raw).trim();
  const len = [...name].length;
  if (len === 0) return { ok: false, error: FAV_MSG.nameEmpty };
  if (len > FAV.nameMax) return { ok: false, error: FAV_MSG.nameLong };
  return { ok: true, name };
}

/** 取得可用的 localStorage；不可用（無痕、停用、拋例外）回傳 null */
function getLocalStorage() {
  try {
    const st = window.localStorage;
    st.setItem('__safeair_probe__', '1'); st.removeItem('__safeair_probe__');
    return st;
  } catch (e) { return null; }
}

/**
 * 最愛資料層。storage 為 { getItem, setItem }（或 null＝不可用，只存記憶體）。
 * 每個操作回傳 { ok, code, message, item, saved }：saved 為 false 表示寫入儲存空間失敗（資料仍在記憶體）。
 */
function createFavStore(storage) {
  const store = { items: [], storageOk: !!storage };
  const persist = () => {
    if (!storage) { store.storageOk = false; return false; }
    try {
      storage.setItem(FAV.key, JSON.stringify({ v: FAV.version, savedAt: new Date().toISOString(), items: store.items }));
      store.storageOk = true;
      return true;
    } catch (e) { store.storageOk = false; return false; }
  };
  const fail = (code, message) => ({ ok: false, code, message, saved: true });
  const done = (item) => ({ ok: true, item, saved: persist() });
  /** 載入時檢查每一筆：格式不對、跑點已不存在、座標在市界外者丟棄 */
  const sanitize = (it) => {
    if (!it || typeof it !== 'object') return null;
    if (it.kind === 'spot') {
      return Number.isInteger(it.spotId) && RUN_SPOTS.some((x) => x.id === it.spotId)
        ? { id: `spot-${it.spotId}`, kind: 'spot', spotId: it.spotId } : null;
    }
    if (it.kind === 'place') {
      const nm = validateFavName(it.name);
      const lat = toNum(it.lat), lng = toNum(it.lng);
      if (!nm.ok || lat === null || lng === null || !pointInPolygon(lat, lng) || typeof it.id !== 'string' || !it.id || it.id.startsWith('spot-')) return null;
      return { id: it.id, kind: 'place', name: nm.name, lat, lng, sub: String(it.sub || '').slice(0, 30) };
    }
    return null;
  };
  store.load = () => {
    store.items = [];
    if (!storage) return store;
    let raw = null;
    try { raw = storage.getItem(FAV.key); } catch (e) { store.storageOk = false; return store; }
    if (!raw) return store;
    try {
      const obj = JSON.parse(raw);
      if (!obj || obj.v !== FAV.version || !Array.isArray(obj.items)) return store; // 版本不符：忽略（日後在此加入版本轉換）
      const seen = new Set();
      for (const it of obj.items) {
        const c = sanitize(it);
        if (c && !seen.has(c.id)) { seen.add(c.id); store.items.push(c); if (store.items.length >= FAV.max) break; }
      }
    } catch (e) { store.items = []; } // 內容毀損：當作沒有最愛
    return store;
  };
  store.isFull = () => store.items.length >= FAV.max;
  store.get = (id) => store.items.find((x) => x.id === id) || null;
  store.hasSpot = (spotId) => store.items.some((x) => x.kind === 'spot' && x.spotId === spotId);
  store.addSpot = (spotId) => {
    if (!RUN_SPOTS.some((x) => x.id === spotId)) return fail('invalid', '找不到這個跑點');
    if (store.hasSpot(spotId)) return fail('exists', FAV_MSG.exists);
    if (store.isFull()) return fail('full', FAV_MSG.full);
    const item = { id: `spot-${spotId}`, kind: 'spot', spotId };
    store.items.push(item);
    return done(item);
  };
  store.addPlace = ({ name, lat, lng, sub }) => {
    if (!pointInPolygon(lat, lng)) return fail('outside', FAV_MSG.outside);
    if (store.isFull()) return fail('full', FAV_MSG.full);
    const nm = validateFavName(name);
    if (!nm.ok) return fail('name', nm.error);
    const item = { id: `p-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, kind: 'place', name: nm.name, lat, lng, sub: String(sub || '').slice(0, 30) };
    store.items.push(item);
    return done(item);
  };
  store.rename = (id, name) => {
    const it = store.get(id);
    if (!it || it.kind !== 'place') return fail('invalid', '只有自選點位可以改名');
    const nm = validateFavName(name);
    if (!nm.ok) return fail('name', nm.error);
    it.name = nm.name;
    return done(it);
  };
  store.remove = (id) => {
    const i = store.items.findIndex((x) => x.id === id);
    if (i < 0) return { ok: false, code: 'missing', message: '不在我的最愛中', saved: true };
    const [item] = store.items.splice(i, 1);
    return done(item);
  };
  return store;
}

let favStore = createFavStore(getLocalStorage()).load();
let favWarned = false; // 「最愛無法保存」只提示一次

/** 最愛的名稱 / 副標 / 燈號 / 座標（跑點取自 RUN_SPOTS；自選點位取自儲存的資料） */
function favInfo(f) {
  if (f.kind === 'spot') {
    const sp = RUN_SPOTS.find((x) => x.id === f.spotId);
    return { name: sp.name, sub: `${sp.district}・${SPOT_TYPE_LABEL[sp.type] || ''}`, lat: sp.lat, lng: sp.lng, status: getSpotStatus(sp.id) };
  }
  const ev = state.favEvaluations[f.id];
  return { name: f.name, sub: f.sub || '自選點位', lat: f.lat, lng: f.lng, status: ev ? ev.status : 'unknown' };
}

/** 儲存失敗時提示一次，並在最愛區塊 / 設定選單顯示常駐說明 */
function noteFavSave(result) {
  if (result && result.saved === false && !favWarned) { favWarned = true; showToast(FAV_MSG.noStorage, 6000, true); }
}
function renderFavWarn() {
  document.querySelectorAll('.js-fav-warn').forEach((el) => { el.hidden = favStore.storageOk; el.textContent = favStore.storageOk ? '' : FAV_MSG.noStorage; });
}

/** 「我的最愛」區塊（側邊欄與 Bottom Sheet 各一份）：燈號（色彩＋圖示＋文字）、名稱、與使用者的距離；依加入順序 */
function renderFavorites() {
  const items = favStore.items;
  const pos = state.userPos;
  const head = `<h2 class="sb-section-title">我的最愛 <span class="fav-count-badge num">${items.length}/${FAV.max}</span></h2>`;
  let body;
  if (!items.length) {
    body = '<p class="fav-empty">點資訊卡上的 ☆，把常去的地點加入最愛</p>';
  } else {
    body = `<ul class="spot-list fav-list">${items.map((f) => {
      const info = favInfo(f), meta = STATUS_META[info.status];
      const dist = pos ? `<span class="dist num">${formatKm(haversine(pos.lat, pos.lng, info.lat, info.lng))}</span>` : '';
      const cur = (state.cardFocus === 'spot' && f.kind === 'spot' && state.selectedId === f.spotId) || (state.cardFocus === 'fav' && state.favFocusId === f.id);
      return `<li><button type="button" class="fav-item spot-item-like ${meta.cls}" data-fav="${f.id}" aria-current="${cur}">
        <span class="status-dot" title="${meta.label}">${iconSvg(meta.icon)}</span>
        <span class="meta"><span class="name">${iconSvg('i-star')}${escapeHtml(info.name)}</span>
          <span class="sub"><span class="st-label">${meta.label}</span><span class="where">・${escapeHtml(info.sub)}</span></span></span>${dist}</button></li>`;
    }).join('')}</ul>`;
  }
  const note = '<p class="fav-note fav-block-note">最愛只存在這台裝置與這個瀏覽器；iPhone 主畫面 App 與 Safari 的最愛是分開的。</p>'
    + (favStore.storageOk ? '' : `<p class="fav-warn">${FAV_MSG.noStorage}</p>`);
  const html = head + body + note;
  document.querySelectorAll('.js-favs').forEach((el) => { el.innerHTML = html; });
  renderFavWarn();
}

/** 自選點位的星形標記（常駐顯示；右下角小圓點為目前燈號） */
const favMarkers = new Map();
function renderFavMarkers() {
  const want = new Set();
  for (const f of favStore.items) {
    if (f.kind !== 'place') continue;
    want.add(f.id);
    const info = favInfo(f), meta = STATUS_META[info.status];
    const selected = state.cardFocus === 'fav' && state.favFocusId === f.id;
    const icon = L.divIcon({
      className: `fav-marker ${meta.cls}${selected ? ' is-selected' : ''}`,
      html: `<div class="star"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-star"/></svg><span class="star-dot">${iconSvg(meta.icon)}</span></div>`,
      iconSize: [38, 38], iconAnchor: [19, 19],
    });
    let m = favMarkers.get(f.id);
    if (!m) {
      m = L.marker([f.lat, f.lng], { icon, title: f.name, alt: f.name, keyboard: true, riseOnHover: true, zIndexOffset: 500 }).addTo(map);
      m.on('click', () => selectFavPlace(f.id));
      favMarkers.set(f.id, m);
    }
    m.setLatLng([f.lat, f.lng]);
    m.setIcon(icon);
    m.setZIndexOffset(selected ? 1100 : 500);
    m.unbindTooltip();
    m.bindTooltip(`${escapeHtml(f.name)}｜${meta.label}`, { direction: 'top', offset: [0, -20] });
    const el = m.getElement();
    if (el) el.setAttribute('aria-label', `我的最愛：${f.name}，${meta.label}`);
  }
  for (const [id, m] of favMarkers) {
    if (!want.has(id)) { map.removeLayer(m); favMarkers.delete(id); }
  }
}

/** 選取最愛的自選點位：平移並開啟資訊卡 */
function selectFavPlace(id) {
  const f = favStore.get(id);
  if (!f || f.kind !== 'place') return;
  state.cardFocus = 'fav';
  state.favFocusId = id;
  state.selectedId = null;
  state.favEditing = null;
  setSheet(false);
  flyToPoint(f.lat, f.lng, CONFIG.SPOT_ZOOM);
  render();
}

/** 點「最愛」清單的一列 */
function selectFavorite(id) {
  const f = favStore.get(id);
  if (!f) return;
  if (f.kind === 'spot') selectSpot(f.spotId); else selectFavPlace(id);
}

function focusFavInput() {
  const el = [...document.querySelectorAll('.js-card .fav-name-input')].find((x) => x.offsetParent !== null);
  if (el) { el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch (e) { /* 略過 */ } }
}

/** 資訊卡上的 ☆／★：target 為 'spot:ID'、'fav:ID'、'temp'（搜尋地點 / 地圖選點）、'outside'（台北市界外） */
function toggleFavoriteFromCard(target) {
  if (target === 'outside') { showToast(FAV_MSG.outside); return; }
  if (target.startsWith('spot:')) {
    const spotId = Number(target.slice(5)), key = `spot-${spotId}`;
    if (favStore.get(key)) { removeFavorite(key); return; }
    const r = favStore.addSpot(spotId);
    if (!r.ok) { showToast(r.message); return; }
    const sp = RUN_SPOTS.find((x) => x.id === spotId);
    showToast(`已加入最愛「${sp.name}」`);
    noteFavSave(r);
    render();
    return;
  }
  if (target.startsWith('fav:')) { removeFavorite(target.slice(4)); return; }
  // temp：搜尋地點 / 地圖選點 → 需要先命名
  const place = state.searchPlace;
  if (!place || !place.inTaipei) { showToast(FAV_MSG.outside); return; }
  if (favStore.isFull()) { showToast(FAV_MSG.full); return; }
  state.favEditing = { mode: 'add', value: '', error: '' };
  setSheet(true); // 窄螢幕：展開 Sheet，才看得到表單與鍵盤
  renderCards();
  focusFavInput();
}

function removeFavorite(id) {
  const f = favStore.get(id);
  if (!f) return;
  const name = favInfo(f).name;
  const r = favStore.remove(id);
  noteFavSave(r);
  showToast(`已從最愛移除「${name}」`);
  if (state.cardFocus === 'fav' && state.favFocusId === id) { state.cardFocus = null; state.favFocusId = null; state.favEditing = null; }
  render();
}

/** 命名 / 改名表單送出 */
function submitFavForm() {
  const ed = state.favEditing;
  if (!ed) return;
  if (ed.mode === 'rename') {
    const r = favStore.rename(ed.id, ed.value);
    if (!r.ok) { ed.error = r.message; renderCards(); focusFavInput(); return; }
    noteFavSave(r);
    state.favEditing = null;
    showToast(`已改名為「${r.item.name}」`);
    render();
    return;
  }
  const place = state.searchPlace;
  if (!place) { state.favEditing = null; render(); return; }
  const r = favStore.addPlace({ name: ed.value, lat: place.lat, lng: place.lng, sub: districtOf(place.lat, place.lng) });
  if (!r.ok) { ed.error = r.message; renderCards(); focusFavInput(); return; }
  noteFavSave(r);
  // 轉成最愛：沿用剛查到的氣象（不再多打一次請求），移除暫時圖釘，改以常駐的星形標記顯示
  const key = `fav-${r.item.id}`;
  const haveWx = state.data && state.data.wx.byKey.search;
  if (haveWx) state.data.wx.byKey[key] = state.data.wx.byKey.search;
  state.searchPlace = null; state.searchReading = null; state.searchEvaluation = null;
  renderSearchMarker();
  state.favEditing = null;
  state.cardFocus = 'fav'; state.favFocusId = r.item.id; state.selectedId = null;
  if (state.data) computeReadings();
  showToast(`已加入最愛「${r.item.name}」`);
  render();
  if (state.data && !haveWx) { // 氣象還沒回來（極少見）：補查
    Promise.resolve(fetchPointWeather(key, r.item.lat, r.item.lng)).then((wx) => {
      if (!state.data || !favStore.get(r.item.id)) return;
      state.data.wx.byKey[key] = wx; computeReadings(); render();
    });
  }
}

/** 綁定最愛相關事件（事件委派） */
function initFavorites() {
  document.addEventListener('click', (e) => {
    const row = e.target.closest('.fav-item');
    if (row) { selectFavorite(row.dataset.fav); return; }
    const star = e.target.closest('[data-action="toggle-fav"]');
    if (star) { toggleFavoriteFromCard(star.dataset.favTarget); return; }
    if (e.target.closest('[data-action="fav-cancel"]')) { state.favEditing = null; renderCards(); return; }
    if (e.target.closest('[data-action="fav-rename"]')) {
      const f = favStore.get(state.favFocusId);
      if (!f) return;
      state.favEditing = { mode: 'rename', id: f.id, value: f.name, error: '' }; // 改名時預填目前名稱
      setSheet(true);
      renderCards();
      focusFavInput();
    }
  });
  document.addEventListener('input', (e) => {
    if (!e.target.classList || !e.target.classList.contains('fav-name-input') || !state.favEditing) return;
    state.favEditing.value = e.target.value;
    state.favEditing.error = '';
    const len = [...e.target.value].length;
    // 側邊欄與 Sheet 各有一份表單：同步另一份的內容與字數，並清掉錯誤訊息
    document.querySelectorAll('.js-card .fav-name-input').forEach((el) => { if (el !== e.target) el.value = e.target.value; });
    document.querySelectorAll('.js-card .fav-count').forEach((el) => { el.textContent = `${len}/${FAV.nameMax}`; });
    document.querySelectorAll('.js-card .fav-error').forEach((el) => { el.textContent = ''; });
  });
  document.addEventListener('submit', (e) => {
    if (e.target.matches && e.target.matches('[data-fav-form]')) { e.preventDefault(); submitFavForm(); }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state.favEditing && e.target.classList && e.target.classList.contains('fav-name-input')) {
      e.stopPropagation(); state.favEditing = null; renderCards();
    }
  });
}

/* =====================================================================
   §9 背景監測與通知
   - 預設關閉；開啟時請求通知權限（被拒絕或不支援 → 只顯示頁面內橫幅，並說明原因）。
   - 每 10 分鐘隨資料更新檢查一次「目前位置」的燈號：綠→黃/紅、黃→紅 時提醒（系統通知＋可關閉的橫幅，
     內容含狀態、主因與建議）。第一次檢查只記錄基準，不提醒。
   - 同一行政區 60 分鐘內不重複提醒；冷卻紀錄存在 localStorage（try/catch，不可用時退回記憶體）。
   - 限制：純網頁在分頁 / App 被關閉後無法執行，所以只能在頁面開著（可在背景分頁）時監測。
   ===================================================================== */
const COOLDOWN_KEY = 'safeair.cooldown.v1';
let memCooldowns = {};

function loadCooldowns() {
  try {
    const raw = localStorage.getItem(COOLDOWN_KEY);
    if (raw) { const o = JSON.parse(raw); if (o && typeof o === 'object') memCooldowns = o; }
  } catch (e) { /* 無痕模式 / 停用儲存：只用記憶體 */ }
  return memCooldowns;
}
function saveCooldowns() { try { localStorage.setItem(COOLDOWN_KEY, JSON.stringify(memCooldowns)); } catch (e) { /* 略過 */ } }

/** 冷卻剩餘分鐘數（向上取整；0 = 可提醒）。可傳入 map / now 方便測試 */
function cooldownRemainingMin(district, now = Date.now(), map = loadCooldowns()) {
  const last = Number(map[district]);
  if (!Number.isFinite(last)) return 0;
  const rem = last + CONFIG.MONITOR.cooldownMin * 60000 - now;
  return rem > 0 ? Math.ceil(rem / 60000) : 0;
}
function markCooldown(district, now = Date.now()) { loadCooldowns(); memCooldowns[district] = now; saveCooldowns(); }
function clearCooldowns() { memCooldowns = {}; try { localStorage.removeItem(COOLDOWN_KEY); } catch (e) { /* 略過 */ } }

/** 是否為「轉差」：綠→黃/紅、黃→紅。資料不足或沒有基準一律不提醒 */
function shouldNotifyTransition(prev, next) {
  return (prev === 'green' && (next === 'yellow' || next === 'red')) || (prev === 'yellow' && next === 'red');
}

/** 主因文字，例如「PM2.5 23.7 μg/m³」「體感溫度（偏熱） 33.5 °C」 */
function describeCause(ev, reading) {
  if (!ev || !ev.primary) return '各項指標良好';
  const ind = INDICATORS.find((i) => i.key === ev.primary.key);
  const label = ind.key === 'feels' ? `${ind.label}（${ev.primary.direction === 'cold' ? '偏冷' : '偏熱'}）` : ind.label;
  const v = reading ? reading[ind.key] : null;
  return `${label} ${fmtVal(v, ind.digits)}${v === null || v === undefined ? '' : ` ${ind.unit}`}`;
}

/** 監測對象：目前位置（需已定位且有判定結果） */
function monitorSubject() {
  if (!state.userPos || !state.userEvaluation) return null;
  return { district: districtOf(state.userPos.lat, state.userPos.lng), ev: state.userEvaluation, reading: state.userReading };
}

const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;

/** 系統通知是否可用（不含權限） */
function notifySupport() {
  if (typeof Notification === 'undefined') {
    return { ok: false, reason: isIOS() && !isStandalone() ? 'iPhone 需先「加入主畫面」並從圖示開啟才能使用系統通知' : '此瀏覽器不支援系統通知' };
  }
  if (!window.isSecureContext) return { ok: false, reason: '此網址不是 HTTPS 或 localhost，瀏覽器不提供系統通知' };
  return { ok: true, reason: '' };
}

/** 請求通知權限（必須在使用者點擊的處理函式內呼叫） */
async function ensurePermission() {
  const sup = notifySupport();
  if (!sup.ok) return { perm: 'unsupported', reason: sup.reason };
  let perm = Notification.permission;
  if (perm === 'default') { try { perm = await Notification.requestPermission(); } catch (e) { perm = 'default'; } }
  const reason = perm === 'denied' ? '通知權限被拒絕（可在瀏覽器的網站設定中重新開啟）' : perm === 'default' ? '尚未允許通知' : '';
  return { perm, reason };
}

let swPromise = null;
/** 取得 Service Worker（sw.js）。手機瀏覽器（Android Chrome）只允許經由它顯示通知；file:// 無法註冊 */
function getSwRegistration() {
  if (!swPromise) {
    swPromise = navigator.serviceWorker.register('sw.js')
      .then(() => Promise.race([navigator.serviceWorker.ready, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 4000))]));
  }
  return swPromise;
}

/** 發送系統通知：優先 Service Worker（手機），退而用 new Notification（電腦）。回傳 { ok, reason } */
async function sendSystemNotification(title, body, tag) {
  const sup = notifySupport();
  if (!sup.ok) return { ok: false, reason: sup.reason };
  if (Notification.permission !== 'granted') {
    return { ok: false, reason: Notification.permission === 'denied' ? '通知權限被拒絕' : '尚未允許通知' };
  }
  const opts = { body, tag, lang: 'zh-TW' };
  if ('serviceWorker' in navigator) {
    try { const reg = await getSwRegistration(); await reg.showNotification(title, opts); return { ok: true }; }
    catch (e) { swPromise = null; /* 註冊失敗（例如 file://）：改用頁面直接通知 */ }
  }
  try { new Notification(title, opts); return { ok: true }; } // eslint-disable-line no-new
  catch (e) { return { ok: false, reason: '此瀏覽器無法由網頁直接發送通知' }; }
}

/** 頁面內橫幅（可關閉，最多同時 3 則） */
function showAlertBanner({ status, title, body, note }) {
  const box = document.getElementById('alerts');
  const meta = STATUS_META[status] || STATUS_META.unknown;
  const el = document.createElement('div');
  el.className = `alert ${meta.cls}`;
  el.setAttribute('role', status === 'red' ? 'alert' : 'status');
  el.innerHTML = `<span class="status-dot">${iconSvg(meta.icon)}</span>
    <div class="alert-body"><strong>${escapeHtml(title)}</strong><p>${escapeHtml(body)}</p>${note ? `<p class="alert-note">${escapeHtml(note)}</p>` : ''}</div>
    <button type="button" class="alert-close" aria-label="關閉提醒">${iconSvg('i-x')}</button>`;
  el.querySelector('.alert-close').addEventListener('click', () => el.remove());
  box.prepend(el);
  while (box.children.length > 3) box.lastChild.remove();
}

/** 發出提醒：系統通知＋橫幅，並記錄該行政區的冷卻起點 */
async function dispatchAlert({ district, ev, reading, test }) {
  const meta = STATUS_META[ev.status];
  const title = `${test ? '【測試】' : ''}${district}：${meta.label}`;
  const body = ev.primary ? `${describeCause(ev, reading)}。${adviceFor(ev)}` : adviceFor(ev); // 全綠時沒有主因，只顯示建議
  markCooldown(district);
  const res = await sendSystemNotification(title, body, `safeair-${district}`);
  showAlertBanner({ status: ev.status, title, body, note: res.ok ? '' : `未發送系統通知（${res.reason}），改以頁面橫幅提醒` });
  return res;
}

/** 每次資料更新後檢查（監測開啟時）：比較目前位置燈號與上一次 */
function monitorCheck() {
  const m = state.monitor;
  if (!m.on) return;
  const subj = monitorSubject();
  if (!subj || subj.ev.status === 'unknown') { renderMonitor(); return; }
  const prev = m.lastStatus, next = subj.ev.status;
  m.lastStatus = next;
  if (shouldNotifyTransition(prev, next)) {
    const rem = cooldownRemainingMin(subj.district);
    if (rem > 0) m.msg = `${subj.district} 燈號轉差（${STATUS_META[prev].label}→${STATUS_META[next].label}），冷卻中（剩 ${rem} 分鐘），未重複提醒`;
    else { m.msg = ''; dispatchAlert({ district: subj.district, ev: subj.ev, reading: subj.reading, test: false }); }
  }
  renderMonitor();
}

/** 開啟 / 關閉背景監測（開啟需在點擊事件內，才能彈出權限詢問） */
async function setMonitoring(on) {
  const m = state.monitor;
  m.msg = ''; m.testMsg = '';
  if (!on) { m.on = false; m.lastStatus = null; renderMonitor(); return; }
  m.on = true;
  const p = ensurePermission(); // 同步呼叫，保持在使用者手勢內
  renderMonitor();
  const { perm, reason } = await p;
  m.perm = perm; m.permReason = reason;
  const subj = monitorSubject();
  m.lastStatus = subj && subj.ev.status !== 'unknown' ? subj.ev.status : null; // 以目前燈號為基準，不立刻提醒
  renderMonitor();
}

/** 「立即測試通知」：遵守冷卻；沒有定位時以選取的跑點（或第一個跑點）示範 */
async function testNotification() {
  const m = state.monitor;
  let subj = monitorSubject();
  if (!subj) {
    const spot = RUN_SPOTS.find((x) => x.id === state.selectedId) || RUN_SPOTS[0];
    const ev = state.evaluations[spot.id];
    if (!ev) { m.testMsg = '資料載入中，請稍後再試'; renderMonitor(); return; }
    subj = { district: spot.district, ev, reading: state.readings[spot.id] };
  }
  const rem = cooldownRemainingMin(subj.district);
  if (rem > 0) { m.testMsg = `冷卻中，剩 ${rem} 分鐘`; renderMonitor(); return; }
  if (notifySupport().ok && Notification.permission === 'default') {
    const p = await ensurePermission();
    m.perm = p.perm; m.permReason = p.reason;
  }
  const res = await dispatchAlert({ district: subj.district, ev: subj.ev, reading: subj.reading, test: true });
  m.testMsg = res.ok ? `已送出測試通知（${subj.district} 冷卻 ${CONFIG.MONITOR.cooldownMin} 分鐘）` : `已顯示橫幅（${res.reason}）`;
  renderMonitor();
}

/** 監測區塊（側邊欄與窄螢幕設定選單各一份） */
function renderMonitor() {
  const m = state.monitor;
  const subj = monitorSubject();
  let status;
  if (!m.on) status = '已關閉';
  else if (!state.userPos) status = '需定位才能監測';
  else {
    const next = state.data ? formatTaipei(new Date(state.data.updatedAt.getTime() + CONFIG.REFRESH_MS)) : '—';
    status = `監測中・每 10 分鐘檢查・${subj ? `${subj.district}目前${STATUS_META[subj.ev.status].label}` : '等待資料'}・下次約 ${next}`;
  }
  let permNote = '';
  if (m.on && m.perm === 'granted') permNote = '系統通知已啟用';
  else if (m.on && m.perm !== 'default') permNote = `${m.permReason || '無法使用系統通知'}，將只顯示頁面橫幅`;
  const html = `
    <div class="mon-row"><span class="field-label" id="monLabel">背景監測</span>
      <button type="button" class="switch" role="switch" aria-checked="${m.on}" aria-labelledby="monLabel" data-action="toggle-monitor"></button></div>
    <p class="mon-status">${escapeHtml(status)}</p>
    ${permNote ? `<p class="mon-note">${escapeHtml(permNote)}</p>` : ''}
    ${m.msg ? `<p class="mon-note">${escapeHtml(m.msg)}</p>` : ''}
    <p class="mon-note">頁面關閉後無法監測，請保持頁面開啟（可切到背景）。</p>
    <p class="mon-note mon-ios">iPhone 需 iOS 16.4 以上，並先「分享 → 加入主畫面」，再從主畫面圖示開啟，才能收到系統通知。${isIOS() && !isStandalone() ? '<strong>目前是在 Safari 分頁中，尚未收得到通知。</strong>' : ''}</p>
    <div class="mon-actions"><button type="button" class="btn" data-action="test-notify">立即測試通知</button>
      <button type="button" class="link-btn" data-action="clear-cooldown">清除冷卻紀錄</button></div>
    <p class="mon-msg" role="status">${escapeHtml(m.testMsg)}</p>`;
  const active = document.activeElement;
  const act = active && active.dataset ? active.dataset.action : null;
  const idx = act ? [...document.querySelectorAll('.js-monitor')].findIndex((c) => c.contains(active)) : -1;
  document.querySelectorAll('.js-monitor').forEach((c) => { c.innerHTML = html; });
  if (act && idx >= 0) { // 重繪後把焦點還給同一個按鈕
    const target = document.querySelectorAll('.js-monitor')[idx].querySelector(`[data-action="${act}"]`);
    if (target) target.focus();
  }
}


/* =====================================================================
   §10 啟動
   ===================================================================== */
function bootstrap() {
  if (typeof L === 'undefined') {
    // Leaflet CDN 載入失敗（例如完全離線）：顯示提示而非空白錯誤
    document.getElementById('map').innerHTML =
      '<p style="padding:96px 24px;color:var(--text-2);text-align:center">地圖元件載入失敗，請確認網路連線後重新整理。</p>';
    return;
  }
  // 網址參數 ?mode=normal | pollution | storm 可直接以指定情境開啟（Demo / 驗收用，不發出任何網路請求）
  try {
    const m = new URLSearchParams(location.search).get('mode');
    if (m && DATA_MODES.some((d) => d.id === m)) state.dataMode = m;
  } catch (e) { /* 忽略無效參數 */ }
  initMap();
  bindUI();
  initHeatControl();
  initFavorites();
  if (!favStore.storageOk) { favWarned = true; showToast(FAV_MSG.noStorage, 6000, true); }
  renderModeSwitch();
  render();
  locateUser({ recenter: true });
  renderMonitor();
  refreshData(); // 完成後自動排定每 10 分鐘更新
}

// 對外提供除錯 / 測試介面（之後階段會加入 evaluate、runTests 等）
window.SafeAir = {
  RUN_SPOTS, CONFIG, PM25_SOURCES, state, getFavStore: () => favStore, createFavStore, validateFavName, haversine, selectSpot,
  idwEstimate, moenvAdapter, lassAdapter, cleanStations, refreshData, setDataMode, currentTaipeiHourKey,
  classifyIndicator, evaluate, adviceFor, runTests, contrastRatio,
  pointInPolygon, TAIPEI_OUTLINE, districtOf, buildPickPlace, pickAt, createLongPressDetector, setMonitoring, testNotification, monitorCheck, cooldownRemainingMin, clearCooldowns, shouldNotifyTransition, describeCause, recommendSpots, selectSearchPlace, geocode, clearSelection, setHeatmap, getHeatStats: () => heatField && heatField.stats, getHeatField: () => heatField, heatValueAt, heatPixelAt, buildHeatField,
};

bootstrap();
