<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10B981">
<!-- PWA：加入主畫面後以 App（standalone）方式開啟；iPhone 需要這樣才能收到網頁通知（iOS 16.4+） -->
<script>
  // manifest 只在 http(s)（localhost / GitHub Pages）加入：file:// 下 Chrome 會嘗試讀取並在 Console 印出 CORS 錯誤，
  // 會違反「三種 Mock 情境 Console 零錯誤」的驗收標準；file:// 本來就無法安裝成 App，不需要它。
  if (/^https?:$/.test(location.protocol)) {
    const l = document.createElement('link');
    l.rel = 'manifest'; l.href = 'manifest.json';
    document.head.appendChild(l);
  }
</script>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SafeAir Run">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SafeAir Run</title>
<meta name="description" content="慢跑場域環境查詢：依 PM2.5、降雨機率、紫外線與體感溫度判斷台北跑點是否適合出發。">
<!-- 唯一的外部依賴：Leaflet 1.9.4（鎖定版本，附 SRI 完整性校驗） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* =====================================================================
   §S1 設計 Token
   ===================================================================== */
:root {
  --bg: #F8FAFC;            /* 背景主色 Slate-50 */
  --surface: #FFFFFF;       /* 容器底色 */
  --text: #0F172A;          /* 文字主色 Slate-900 */
  --text-2: #475569;        /* 次要文字 Slate-600 */
  --line: #E2E8F0;          /* 分隔線 Slate-200 */
  --hover: #F1F5F9;         /* 滑過底色 Slate-100 */
  --focus: #2563EB;         /* 鍵盤焦點框 */
  --user: #2563EB;          /* 使用者位置藍點 */

  /* 三級狀態＋資料不足：500 色系（圖示/標記/色塊）、深色（文字）、淡底（標籤底色） */
  --green: #10B981;  --green-text: #047857;  --green-bg: #ECFDF5;
  --yellow: #F59E0B; --yellow-text: #B45309; --yellow-bg: #FFFBEB;
  --red: #EF4444;    --red-text: #B91C1C;    --red-bg: #FEF2F2;
  --gray: #94A3B8;   --gray-text: #475569;   --gray-bg: #F1F5F9;

  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --radius: 12px;
  --shadow: 0 4px 16px rgba(15, 23, 42, .12);
  --sidebar-w: 380px;
  --sheet-offset: 16px;     /* 地圖右下控制項距底部（窄螢幕會隨 Bottom Sheet 高度調整） */
  --touch: 44px;            /* 最小觸控區域 */
}

/* =====================================================================
   §S2 版面骨架（Mobile-first，斷點 768px）
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
           overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#app { position: relative; height: 100%; display: flex; }
#mapWrap { position: relative; flex: 1; min-width: 0; height: 100%; }
#map { position: absolute; inset: 0; background: var(--bg); }

/* 窄螢幕：側邊欄隱藏，地圖全螢幕 */
#sidebar { display: none; }

/* 寬螢幕：左側固定側邊欄 380px，其餘鋪滿地圖 */
@media (min-width: 768px) {
  #sidebar {
    display: flex; flex-direction: column;
    width: var(--sidebar-w); flex: none; height: 100%;
    background: var(--surface); border-right: 1px solid var(--line);
    z-index: 1000; /* 高於 Leaflet 控制項 */
  }
}

/* =====================================================================
   §S3 元件：側邊欄、跑點列表、狀態標籤
   ===================================================================== */
.sb-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--green);
              display: grid; place-items: center; color: #fff; }
.brand-mark .icon { width: 18px; height: 18px; }
.sb-section-title { margin: 0; padding: 14px 20px 6px; font-size: 13px; font-weight: 600;
                    color: var(--text-2); letter-spacing: .02em; }
.sb-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

.spot-list { list-style: none; margin: 0; padding: 0 8px 16px; }
.spot-item, .fav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 56px; padding: 8px 12px; border: 0; border-radius: 10px;
  background: transparent; text-align: left; cursor: pointer;
}
.spot-item:hover, .fav-item:hover { background: var(--hover); }
.spot-item[aria-current="true"], .fav-item[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--text); }
.spot-item .meta, .fav-item .meta { flex: 1; min-width: 0; }
.spot-item .name, .fav-item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spot-item .sub, .fav-item .sub { display: flex; align-items: baseline; gap: 0; min-width: 0; font-size: 13px; color: var(--text-2); }
/* 狀態文字放在名稱下方第二行，nowrap 不斷字；地點資訊太長時以省略號截斷 */
.spot-item .st-label, .fav-item .st-label { flex: none; white-space: nowrap; font-weight: 600; color: var(--st-text); }
.spot-item .where, .fav-item .where { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.spot-item .dist, .fav-item .dist { font-size: 13px; color: var(--text-2); white-space: nowrap; }

/* 狀態圓形徽章（色塊＋白色圖示），用於列表與標記 */
.status-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
              color: #fff; flex: none; }
.status-dot .icon { width: 16px; height: 16px; stroke-width: 2.5; }
.st-green  { --st: var(--green);  --st-text: var(--green-text);  --st-bg: var(--green-bg); }
.st-yellow { --st: var(--yellow); --st-text: var(--yellow-text); --st-bg: var(--yellow-bg); }
.st-red    { --st: var(--red);    --st-text: var(--red-text);    --st-bg: var(--red-bg); }
.st-unknown{ --st: var(--gray);   --st-text: var(--gray-text);   --st-bg: var(--gray-bg); }
.status-dot { background: var(--st); }

/* =====================================================================
   §S4 窄螢幕頂部懸浮列（第 5 階段改為搜尋欄）
   ===================================================================== */
#mobileTop {
  position: absolute; z-index: 1000; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px;
  display: flex; align-items: center; gap: 8px;
}
#mobileTop .search { flex: 1; min-width: 0; }
.top-btn { width: 48px; height: 48px; flex: none; border: 0; border-radius: 50%; background: var(--surface);
           color: var(--text); box-shadow: var(--shadow); display: grid; place-items: center; cursor: pointer; }
.top-btn[aria-expanded="true"] { background: var(--text); color: #fff; }
/* 窄螢幕設定選單：資料模式、資料來源狀態（第 7 階段加入背景監測） */
#settingsMenu { position: absolute; z-index: 1300; top: calc(12px + 48px + 8px + env(safe-area-inset-top)); right: 12px;
                width: min(340px, calc(100% - 24px)); padding: 14px; border-radius: var(--radius);
                background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 10px; }
#settingsMenu[hidden] { display: none; }
#settingsMenu .sb-status { padding: 0; }
@media (min-width: 768px) { #mobileTop { display: none; } }

/* =====================================================================
   §S5 地圖：跑點標記、使用者位置、控制按鈕
   ===================================================================== */
.leaflet-container { font-family: var(--font); }
.leaflet-bottom { bottom: var(--sheet-offset); transition: bottom .25s ease; }
.leaflet-control-attribution { font-size: 11px; }

.spot-marker { background: none; border: 0; }
.spot-marker .pin {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--st); color: #fff; border: 3px solid #fff;
  box-shadow: 0 0 0 1.5px rgba(15, 23, 42, .55), 0 3px 8px rgba(15, 23, 42, .45); transition: transform .15s ease;
}
.spot-marker .pin .icon { width: 18px; height: 18px; stroke-width: 2.5; }
.spot-marker.is-selected .pin { transform: scale(1.25); box-shadow: 0 0 0 1.5px rgba(15, 23, 42, .55), 0 0 0 5px rgba(15, 23, 42, .22), 0 3px 8px rgba(15, 23, 42, .45); }

/* 使用者位置：藍色圓點＋外圈脈動 */
.user-marker { background: none; border: 0; }
.user-marker .dot { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
                    border-radius: 50%; background: var(--user); border: 3px solid #fff;
                    box-shadow: 0 1px 4px rgba(15, 23, 42, .4); }
.user-marker .pulse { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
                      border-radius: 50%; background: rgba(37, 99, 235, .35); animation: pulse 2s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(3.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .user-marker .pulse { animation: none; transform: scale(2); opacity: .4; } }

/* 地圖圓形按鈕（觸控區域 ≥ 44×44） */
.map-btn {
  width: var(--touch); height: var(--touch); border: 0; border-radius: 50%;
  background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  display: grid; place-items: center; cursor: pointer;
}
.map-btn:hover { background: var(--hover); }
.leaflet-control.map-btn { margin-right: 12px; }
.leaflet-touch .leaflet-bar a { width: 36px; height: 36px; line-height: 36px; }

/* =====================================================================
   §S5-2 側邊欄底部：資料狀態與資料模式切換
   ===================================================================== */
.sb-footer { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: grid; gap: 10px; }
.sb-status { display: flex; align-items: center; justify-content: space-between; gap: 8px;
             font-size: 13px; color: var(--text-2); }
.field-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
       background: var(--hover); border-radius: 10px; }
.seg button { min-height: 36px; padding: 0 4px; border: 0; border-radius: 7px; background: transparent;
              font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600;
                                   box-shadow: 0 1px 3px rgba(15, 23, 42, .15); }

/* 資料來源狀態標記：滑鼠移上或點擊時顯示原因 */
.src-wrap { position: relative; }
.src-badge { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 2px 10px;
             border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
             font-size: 12px; cursor: pointer; white-space: nowrap; }
.src-badge .icon { width: 14px; height: 14px; }
.src-badge.is-live { color: var(--green-text); border-color: #A7F3D0; background: var(--green-bg); }
.src-badge.is-offline { color: var(--gray-text); background: var(--gray-bg); }
.src-badge.is-loading { color: var(--text-2); }
.src-pop { display: none; position: absolute; z-index: 1200; right: 0; bottom: calc(100% + 8px); width: 280px;
           padding: 10px 12px; border-radius: 10px; background: var(--text); color: #fff; font-size: 13px;
           line-height: 1.6; box-shadow: var(--shadow); }
.src-pop ul { margin: 0; padding-left: 18px; }
.src-pop.below { bottom: auto; top: calc(100% + 8px); }
.src-wrap.open .src-pop { display: block; }
@media (hover: hover) { .src-wrap:hover .src-pop { display: block; } }
#mobileTop .src-wrap { margin-left: auto; }

/* =====================================================================
   §S7 熱力圖開關與圖例（寬螢幕：地圖右上角；窄螢幕：搜尋列下方右側圓形鈕）
   ===================================================================== */
#heatCtl {
  position: absolute; z-index: 1000; top: 12px; right: 12px;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
}
.heat-btn {
  height: var(--touch); min-width: var(--touch); padding: 0 16px 0 12px; border: 0; border-radius: 22px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  font: 600 14px/1 var(--font); cursor: pointer;
}
.heat-btn:hover { background: var(--hover); }
.heat-btn[aria-pressed="true"] { background: var(--text); color: #fff; }
.heat-legend {
  width: 232px; padding: 12px 14px; background: var(--surface); border-radius: var(--radius);
  box-shadow: var(--shadow); font-size: 13px; color: var(--text);
}
.heat-legend[hidden] { display: none; }
.heat-legend h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
.heat-legend ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.heat-legend li { display: flex; align-items: center; gap: 8px; }
.heat-legend .sw { width: 20px; height: 14px; border-radius: 3px; border: 1px solid var(--line); flex: none; }
.heat-legend .sw.blank { background: repeating-linear-gradient(45deg, #fff 0 5px, #CBD5E1 5px 6px); }
.heat-legend .note { margin: 8px 0 0; font-size: 12px; color: var(--text-2); line-height: 1.5; }
/* 窄螢幕：搜尋列（高 48px）下方右側，單一圓形按鈕（圖例收在其面板內） */
/* 圖例：寬螢幕為完整面板；窄螢幕預設為單行小圖例（不遮住跑點），點一下才展開完整說明 */
.lg-compact { display: none; }
@media (max-width: 767.98px) {
  #heatCtl { top: calc(12px + 48px + 10px + env(safe-area-inset-top)); flex-direction: row-reverse; align-items: center; }
  .heat-btn { width: var(--touch); padding: 0; border-radius: 50%; }
  .heat-btn .label { display: none; }
  .heat-legend { width: auto; padding: 0; background: none; box-shadow: none; border-radius: 0; }
  .lg-compact { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border: 0; border-radius: 16px;
                background: var(--surface); box-shadow: var(--shadow); font: 12px var(--font); color: var(--text); cursor: pointer; white-space: nowrap; }
  .lg-compact .sw { width: 12px; height: 12px; border-radius: 3px; }
  .lg-compact span.i { display: inline-flex; align-items: center; gap: 3px; }
  .heat-legend .lg-full { display: none; position: absolute; top: calc(100% + 8px); right: 0; width: 232px; padding: 12px 14px;
                          background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); }
  .heat-legend.expanded .lg-full { display: block; }
}

/* =====================================================================
   §S8 搜尋、資訊卡、Bottom Sheet（第 5 階段）
   ===================================================================== */
/* 搜尋欄（側邊欄與窄螢幕頂部共用） */
.search { position: relative; }
.search-box { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--line);
              border-radius: 12px; background: var(--surface); }
.search-box:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
.search-box input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent;
                    font: 16px var(--font); color: var(--text); } /* 16px 避免 iOS 聚焦時自動放大 */
.search-box .icon { color: var(--text-2); }
#mobileTop .search-box { height: 48px; border: 0; border-radius: 24px; box-shadow: var(--shadow); }
.search-list { position: absolute; z-index: 1300; left: 0; right: 0; top: calc(100% + 6px); margin: 0; padding: 6px;
               list-style: none; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
               border: 1px solid var(--line); }
.search-list[hidden] { display: none; }
.search-list li { display: flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 8px 10px; border-radius: 8px;
                  cursor: pointer; align-items: center; }
.search-list li[aria-selected="true"], .search-list li:hover { background: var(--hover); }
.search-list .s-kind { flex: none; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--gray-bg); color: var(--gray-text); }
.search-list .s-sub { margin-left: auto; font-size: 13px; color: var(--text-2); white-space: nowrap; }
.search-list li.search-empty { cursor: default; color: var(--text-2); }
.search-list li.search-empty:hover { background: transparent; }
.sb-search { position: relative; z-index: 5; padding: 12px 16px 8px; }

/* 資訊卡 */
.card { margin: 4px 12px 8px; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.card-head { display: flex; align-items: center; gap: 10px; }
.card-head .status-dot { width: 36px; height: 36px; }
.card-head .status-dot .icon { width: 20px; height: 20px; }
.card-title { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.3; }
.card-sub { margin: 0; font-size: 13px; color: var(--text-2); }
.card-head .titles { flex: 1; min-width: 0; }
.card-close { width: var(--touch); height: var(--touch); margin: -8px -8px -8px 0; flex: none; border: 0; border-radius: 50%;
              background: transparent; color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
.card-close:hover { background: var(--hover); }
.chip { display: inline-flex; align-items: center; gap: 4px; margin-top: 10px; padding: 3px 10px; border-radius: 999px;
        background: var(--st-bg); color: var(--st-text); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip .icon { width: 14px; height: 14px; }
.card-advice { margin: 8px 0 0; font-size: 15px; line-height: 1.5; }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.metric { padding: 10px 12px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.metric .m-label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); }
.lv-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--st); flex: none; }
.metric .m-val { margin-top: 2px; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.metric .m-val small { margin-left: 3px; font-size: 12px; font-weight: 400; color: var(--text-2); }
.card-note { margin: 10px 0 0; font-size: 13px; color: var(--yellow-text); }
.card-foot { margin: 10px 0 0; font-size: 12px; color: var(--text-2); }
.card-hint { color: var(--text-2); font-size: 14px; line-height: 1.6; }
.card-hint .icon { vertical-align: -4px; margin-right: 4px; }

/* 搜尋位置標記與「搜尋地點」列 */
.search-marker { background: none; border: 0; filter: drop-shadow(0 3px 4px rgba(15, 23, 42, .4)); }
.search-list li.s-geo { color: var(--focus); font-weight: 600; margin-top: 2px; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
.search-list li.s-geo .icon { width: 18px; height: 18px; }
.search-list li.search-empty small { color: var(--text-2); }
.search-list li.search-empty { display: block; padding: 10px; }

/* 換點推薦 */
.rec { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.rec-title { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--text-2); }
.rec .spot-list { padding: 0; margin: 0 -8px; }
.rec-empty { margin: 4px 0 0; font-size: 14px; color: var(--text-2); }

/* Bottom Sheet（窄螢幕）：收合 140px / 展開 80vh，可拖曳、點握把切換 */
#sheet { display: none; }
@media (max-width: 767.98px) {
  :root { --sheet-offset: 152px; } /* 收合高度 140 + 12：定位鈕、縮放鈕、版權文字隨 Sheet 上移 */
  #sheet {
    display: flex; flex-direction: column; position: absolute; z-index: 1000; left: 0; right: 0; bottom: 0;
    height: 140px; background: var(--surface); border-radius: 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(15, 23, 42, .16); transition: height .25s ease; touch-action: none;
    padding-bottom: env(safe-area-inset-bottom);
  }
  #sheet.expanded { height: 80vh; height: 80dvh; }
  #sheet.dragging { transition: none; }
  .sheet-handle { flex: none; width: 100%; height: 28px; border: 0; background: transparent; cursor: grab; display: grid; place-items: center; touch-action: none; }
  .sheet-handle::before { content: ""; width: 40px; height: 5px; border-radius: 3px; background: var(--line); }
  .sheet-handle:focus-visible { outline-offset: -4px; }
  .sheet-body { flex: 1; min-height: 0; overflow: hidden; touch-action: pan-y; }
  #sheet.expanded .sheet-body { overflow-y: auto; overscroll-behavior: contain; }
  #sheet .card { margin: 0 12px 8px; border: 0; padding: 4px 4px 8px; }
  #sheet:not(.expanded) .metrics, #sheet:not(.expanded) .card-foot, #sheet:not(.expanded) .card-note, #sheet:not(.expanded) .rec { display: none; }
  #sheet:not(.expanded) .card-advice { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #sheet:not(.expanded) .chip { margin-top: 6px; }
  .sheet-more { visibility: hidden; }
  #sheet.expanded .sheet-more { visibility: visible; }
  /* 展開時隱藏右下控制鈕（避免與 Sheet 重疊） */
  body.sheet-open .leaflet-bottom.leaflet-right { opacity: 0; pointer-events: none; }
}

/* =====================================================================
   §S9 背景監測、提醒橫幅、地圖選點的觸控設定
   ===================================================================== */
/* 長按選點：避免 iOS Safari 跳出系統選單 / 選取文字、Android 長按選單 */
#map, .leaflet-container { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
.card-tip { margin: 10px 0 0; font-size: 12px; color: var(--text-2); }

.mon { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.mon-row { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
#settingsMenu .mon { border-bottom: 0; padding-bottom: 0; }
.switch { position: relative; width: 52px; height: 32px; border: 0; border-radius: 16px; background: var(--line); cursor: pointer; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff;
                 box-shadow: 0 1px 3px rgba(15, 23, 42, .3); transition: transform .15s ease; }
.switch[aria-checked="true"] { background: var(--green-text); }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
.mon-status { margin: 0; font-size: 13px; font-weight: 600; }
.mon-note { margin: 0; font-size: 12px; color: var(--text-2); line-height: 1.5; }
.mon-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
.btn { min-height: var(--touch); padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
       font: 600 14px var(--font); color: var(--text); cursor: pointer; }
.btn:hover { background: var(--hover); }
.link-btn { min-height: var(--touch); padding: 0 4px; border: 0; background: none; font: 13px var(--font); color: var(--focus);
            text-decoration: underline; cursor: pointer; }
.mon-ios strong { display: block; margin-top: 2px; color: var(--yellow-text); }
@media (min-width: 768px) { .mon-ios { display: none; } } /* 寬螢幕（電腦）不需要 iPhone 說明 */
.mon-msg { margin: 0; min-height: 1em; font-size: 12px; color: var(--text-2); }
#settingsMenu { max-height: calc(100% - 96px); overflow-y: auto; }

#alerts { position: absolute; z-index: 1400; top: 12px; left: 50%; transform: translateX(-50%); width: min(480px, calc(100% - 24px));
          display: grid; gap: 8px; pointer-events: none; }
.alert { pointer-events: auto; display: flex; align-items: flex-start; gap: 10px; padding: 12px 8px 12px 12px; border-radius: var(--radius);
         background: var(--surface); border-left: 6px solid var(--st); box-shadow: var(--shadow); }
.alert .status-dot { margin-top: 2px; }
.alert-body { flex: 1; min-width: 0; font-size: 14px; line-height: 1.5; }
.alert-body strong { font-size: 15px; }
.alert-body p { margin: 2px 0 0; }
.alert-note { font-size: 12px; color: var(--text-2); }
.alert-close { width: var(--touch); height: var(--touch); margin: -8px 0 -8px auto; flex: none; border: 0; border-radius: 50%; background: transparent;
               color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
.alert-close:hover { background: var(--hover); }
@media (max-width: 767.98px) {
  /* 窄螢幕：放在搜尋列與熱力圖鈕下方，不蓋住它們 */
  #alerts { top: calc(12px + 48px + 10px + 44px + 8px + env(safe-area-inset-top)); }
}

/* =====================================================================
   §S10 我的最愛
   ===================================================================== */
:root { --fav: #4F46E5; } /* 靛藍：與三級燈號色明顯區分（對白底 6.3:1） */
.fav-btn { width: var(--touch); height: var(--touch); margin: -8px 0 -8px 0; flex: none; border: 0; border-radius: 50%; background: transparent;
           color: var(--fav); display: grid; place-items: center; cursor: pointer; }
.fav-btn:hover { background: var(--hover); }
.fav-btn .icon { width: 24px; height: 24px; }
.fav-btn[aria-pressed="true"] .icon { fill: currentColor; }
.fav-btn.is-disabled { color: var(--text-2); opacity: .55; }
.card-actions { display: flex; align-items: center; margin-right: -8px; }
.card-actions .card-close { margin: -8px 0; }

.fav-form { display: grid; gap: 6px; margin-top: 10px; padding: 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.fav-form input { width: 100%; min-height: var(--touch); padding: 0 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface);
                  font: 16px var(--font); color: var(--text); } /* 16px 避免 iOS 聚焦時自動放大 */
.fav-form-row { display: flex; align-items: center; gap: 10px; }
.fav-count { margin-right: auto; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.fav-error { margin: 0; min-height: 0; font-size: 13px; color: var(--red-text); }
.fav-error:empty { display: none; }
.card-rename { width: var(--touch); height: var(--touch); margin: -8px 0; flex: none; border: 0; border-radius: 50%; background: transparent;
               color: var(--text-2); display: grid; place-items: center; cursor: pointer; }
.card-rename:hover { background: var(--hover); }
.card-rename .icon { width: 18px; height: 18px; }

.favs { padding-bottom: 4px; }
.fav-count-badge { font-weight: 400; color: var(--text-2); }
.fav-empty { margin: 0 20px 8px; font-size: 14px; color: var(--text-2); line-height: 1.5; }
.fav-warn { margin: 0 20px 8px; font-size: 12px; color: var(--yellow-text); }
.fav-item .name .icon { width: 14px; height: 14px; margin-right: 4px; vertical-align: -2px; fill: var(--fav); stroke: var(--fav); }
.fav-note { margin: 0; font-size: 12px; color: var(--text-2); line-height: 1.5; }
.fav-block-note { margin: 4px 20px 10px; }
#sheet .fav-block-note { display: none; } /* 窄螢幕的說明放在設定選單，避免重複 */

/* 地圖：跑點標記的小星號、自選點位的星形標記 */
.spot-marker .fav-badge { position: absolute; top: -5px; right: -5px; width: 18px; height: 18px; border-radius: 50%; background: var(--fav);
                          border: 2px solid #fff; display: grid; place-items: center; color: #fff; box-shadow: 0 1px 3px rgba(15, 23, 42, .4); }
.spot-marker .fav-badge .icon { width: 10px; height: 10px; fill: #fff; stroke: #fff; stroke-width: 1; }
.spot-marker .pin { position: relative; }
.fav-marker { background: none; border: 0; filter: drop-shadow(0 2px 3px rgba(15, 23, 42, .4)); }
.fav-marker .star { position: relative; width: 38px; height: 38px; transition: transform .15s ease; }
.fav-marker .star svg { width: 38px; height: 38px; fill: var(--fav); stroke: #fff; stroke-width: 1.6; stroke-linejoin: round; }
.fav-marker.is-selected .star { transform: scale(1.25); }
.fav-marker .star-dot { position: absolute; right: -2px; bottom: -2px; width: 18px; height: 18px; border-radius: 50%; background: var(--st); border: 2px solid #fff;
                        display: grid; place-items: center; color: #fff; }
.fav-marker .star-dot .icon { width: 11px; height: 11px; stroke-width: 3; }

/* =====================================================================
   §S6 小提示（Toast）
   ===================================================================== */
#toast {
  position: absolute; z-index: 1100; left: 50%; bottom: calc(var(--sheet-offset) + 72px);
  transform: translate(-50%, 8px); max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 10px; background: var(--text); color: #fff; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>

   §2 工具函式

/** Haversine 公式：計算兩點球面直線距離（公尺） */
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371008.8; // 地球平均半徑（公尺）
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

/** 距離顯示：一律以公里、一位小數（例：1.2 公里） */
function formatKm(meters) {
  return (meters / 1000).toFixed(1) + ' 公里';
}

/** 判斷座標是否在台北市範圍框內 */
function inBBox(lat, lng, bbox = CONFIG.BBOX) {
  return lat >= bbox.minLat && lat <= bbox.maxLat && lng >= bbox.minLng && lng <= bbox.maxLng;
}

/** 產生圖示 SVG 字串（引用上方內嵌 symbol） */
function iconSvg(id, extraClass = '') {
  return `<svg class="icon ${extraClass}" aria-hidden="true"><use href="#${id}"/></svg>`;
}

/** HTML 跳脫，避免資料內容被當成標記解析 */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** 轉為有限數值，否則回傳 null（防呆：字串 'N/A'、null、NaN 皆視為缺值） */
function toNum(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : Number(v);
  return Number.isFinite(n) ? n : null;
}

/** 四捨五入至指定小數位 */
function round(v, digits = 1) {
  const k = 10 ** digits;
  return Math.round(v * k) / k;
}

/** 以台北時間格式化日期（不受裝置時區影響） */
function formatTaipei(date, { withDate = false } = {}) {
  const opts = { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false };
  if (withDate) Object.assign(opts, { year: 'numeric', month: '2-digit', day: '2-digit' });
  return new Intl.DateTimeFormat('zh-TW', opts).format(date);
}

/**
 * 取得台北時間「當下整點」的鍵值，格式與 Open-Meteo（timezone=Asia/Taipei）的 hourly.time 相同：
 * 例如 "2026-11-22T18:00"。以 UTC+8 換算，不依賴裝置時區。
 */
function currentTaipeiHourKey(now = new Date()) {
  const t = new Date(now.getTime() + CONFIG.TAIPEI_UTC_OFFSET_H * 3600e3);
  return t.toISOString().slice(0, 13) + ':00';
}

/** 小提示：顯示數秒後自動消失 */
let toastTimer = null;
let toastLockUntil = 0, toastLockTimer = null, toastPending = null;
/**
 * 顯示小提示。important 的提示（例如「最愛無法保存」）在顯示期間不會被其他提示蓋掉；
 * 期間內的其他提示只保留最新一則，等重要提示結束後再顯示。
 */
function showToast(msg, ms = 3500, important = false) {
  if (!important && Date.now() < toastLockUntil) { toastPending = { msg, ms }; return; }
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
  if (important) {
    toastLockUntil = Date.now() + ms;
    clearTimeout(toastLockTimer);
    toastLockTimer = setTimeout(() => {
      toastLockUntil = 0;
      if (toastPending) { const q = toastPending; toastPending = null; showToast(q.msg, q.ms); }
    }, ms);
  }
}

/** 資料取得失敗的錯誤（code 用於產生白話原因） */
class DataError extends Error {
  constructor(code, detail = '') { super(detail || code); this.code = code; this.detail = detail; }
}

/** 將失敗原因轉成介面上的白話說明 */
function describeFailure(sourceName, err) {
  switch (err && err.code) {
    case 'timeout': return `${sourceName}回應逾時（超過 ${CONFIG.FETCH_TIMEOUT_MS / 1000} 秒）`;
    case 'network': return `無法連線至${sourceName}（跨網域限制或網路離線）`;
    case 'http':    return `${sourceName}回應錯誤（${err.detail}）`;
    case 'parse':   return `${sourceName}資料格式無法解析`;
    case 'stale':   return `${sourceName}資料超過 ${CONFIG.STATION_MAX_AGE_MIN / 60} 小時未更新（最後資料時間 ${err.detail}）`;
    case 'few':     return `${sourceName}在台北周邊的有效測站不足 ${CONFIG.MIN_VALID_STATIONS} 站`;
    case 'none':    return '沒有啟用中的 PM2.5 資料來源';
    default:        return `${sourceName}發生未預期錯誤`;
  }
}

/**
 * fetch 加上逾時（AbortController），並把各種失敗統一轉成 DataError。
 *
 * 【已知 Console 錯誤（僅「即時資料」模式）】
 * 以下紅字由瀏覽器網路層直接輸出，JavaScript 無法攔截或隱藏；程式已正確降級，不影響操作：
 * 1. Open-Meteo：「429 (Too Many Requests)」— 同一對外 IP 請求過多時的限流（雲端 / 共用網路較常見）。
 * 2. 以 file:// 開啟時讀取 data/pm25.json 會被瀏覽器以 CORS 擋下（file:// 不允許 fetch 本機檔案）；
 *    本機請用 npx serve，或直接使用 GitHub Pages。
 * （LASS 已停用，不再出現其 CORS 錯誤。）
 * 三種 Mock 情境（正常 / 高空汙 / 大雨曝曬）不發出任何網路請求，Console 應為零錯誤、零警告。
 */
async function fetchJson(url, ms = CONFIG.FETCH_TIMEOUT_MS, init = { cache: 'no-store' }) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal, ...init });
    if (!res.ok) throw new DataError('http', `HTTP ${res.status}`);
    try { return await res.json(); } catch (e) { throw new DataError('parse'); }
  } catch (e) {
    if (e instanceof DataError) throw e;
    if (e && e.name === 'AbortError') throw new DataError('timeout');
    throw new DataError('network', e && e.message); // CORS 被擋、離線、DNS 失敗皆為 TypeError
  } finally {
    clearTimeout(timer);
  }
}

/* ---------------------------------------------------------------------
   PM2.5 adapter：環境部 AQI（經 tools/fetch_moenv.py 整理後的 data/pm25.json）
   ---------------------------------------------------------------------
   【2026-11-23 實測摘要】（API：https://data.moenv.gov.tw/api/v2/aqx_p_432?format=json&limit=1000&api_key=***）
   - 原始回應為陣列（84 站），欄位全小寫、數值皆為字串：pm2.5 為最近 1 小時整數（例 "10"），
     pm2.5_avg 為移動平均（例 "7.5"）；publishtime 例 "2026/11/23 22:00:00"（台北時間）。
   - 抓取腳本轉成 { source, license, fetchedAt, publishTime, stations: [{ id, name, county, lat, lng, pm25, pm25Avg, time }] }，
     非數值存 null、time 轉為 ISO（+08:00）。
   - 取值規則：pm25 有效（> 0 且 ≤ 500）就用它；否則改用 pm25Avg，並標記 pmFrom = 'avg'
     （資訊卡在「最近測站」使用移動平均值時註明）；兩者都無效 → 留給 cleanStations 計為無效值。
   --------------------------------------------------------------------- */
function moenvAdapter(json) {
  if (!json || !Array.isArray(json.stations)) throw new DataError('parse');
  const valid = (v) => v !== null && v > CONFIG.PM25_MIN && v <= CONFIG.PM25_MAX;
  const out = [];
  for (const s of json.stations) {
    if (!s || typeof s !== 'object') continue;
    const lat = toNum(s.lat), lng = toNum(s.lng), time = new Date(s.time);
    if (lat === null || lng === null || isNaN(time)) continue;
    const hourly = toNum(s.pm25), avg = toNum(s.pm25Avg);
    const useAvg = !valid(hourly) && valid(avg);
    out.push({ id: String(s.id || `${lat},${lng}`), name: String(s.name || ''), lat, lng, time,
               pm25: useAvg ? avg : hourly, pmFrom: useAvg ? 'avg' : 'hourly' });
  }
  return out;
}

           另有 date（"2026-09-01"）＋ time（"16:07:38"）亦為 UTC，作為備援。
   - 識別：device_id；名稱：SiteName（備援 name）。
   - 實測時資料停在 2026-09-01（Last-Modified 同日），且回應無 Access-Control-Allow-Origin，
     瀏覽器無法讀取 → 會自動降級為 Mock。台北範圍框內 92 站中有 64 站 s_d0 = 0（疑似感測異常，
     會把 IDW 結果嚴重拉低），因此清洗規則為「PM2.5 ≤ 0 或 > 500 皆排除」。
   - 防呆：欄位缺漏 / 非數值 → 該站略過；timestamp 無法解析時改用 date＋time；同 device_id 只取最新一筆。
   --------------------------------------------------------------------- */
function lassAdapter(json) {
  if (!json || !Array.isArray(json.feeds)) throw new DataError('parse');
  const byId = new Map();
  for (const f of json.feeds) {
    if (!f || typeof f !== 'object') continue;
    const lat = toNum(f.gps_lat), lng = toNum(f.gps_lon), pm25 = toNum(f.s_d0);
    if (lat === null || lng === null || pm25 === null) continue;
    let time = typeof f.timestamp === 'string' ? new Date(f.timestamp) : null;
    if (!time || isNaN(time)) {
      time = (f.date && f.time) ? new Date(`${f.date}T${f.time}Z`) : null; // date＋time 為 UTC
    }
    if (!time || isNaN(time)) continue;
    const id = String(f.device_id || `${lat},${lng}`);
    const prev = byId.get(id);
    if (prev && prev.time >= time) continue;
    byId.set(id, { id, name: String(f.SiteName || f.name || id), lat, lng, pm25, time });
  }
  return [...byId.values()];
}

/**
 * 共用清洗：測站範圍框（台北向外約 10 km）→ PM2.5 有效範圍（> 0 且 ≤ 500；≤ 0 或 > 500 排除）→ 時效（≤ 3 小時）。
 * 回傳 { valid, stats }，stats 供判斷失敗原因（例如全部過期 → 來源暫停更新）。
 */
function cleanStations(stations, now = new Date()) {
  const stats = { total: stations.length, inBBox: 0, badValue: 0, stale: 0, latest: null };
  const maxAgeMs = CONFIG.STATION_MAX_AGE_MIN * 60e3;
  const valid = [];
  for (const st of stations) {
    if (!inBBox(st.lat, st.lng, CONFIG.STATION_BBOX)) continue;
    stats.inBBox++;
    if (!stats.latest || st.time > stats.latest) stats.latest = st.time;
    if (st.pm25 <= CONFIG.PM25_MIN || st.pm25 > CONFIG.PM25_MAX) { stats.badValue++; continue; }
    if (now - st.time > maxAgeMs) { stats.stale++; continue; }
    valid.push(st);
  }
  return { valid, stats };
}

/** 依序嘗試啟用中的 PM2.5 來源；全部失敗時拋出含白話原因的 DataError */
async function loadPm25Live() {
  const reasons = [];
  for (const src of PM25_SOURCES.filter((s) => s.enabled)) {
    try {
      const json = await fetchJson(src.cacheBust ? `${src.url}?t=${Date.now()}` : src.url);
      const { valid, stats } = cleanStations(src.adapter(json));
      if (valid.length >= CONFIG.MIN_VALID_STATIONS) {
        const dataTime = valid.reduce((m, st) => (st.time > m ? st.time : m), valid[0].time);
        return { mode: 'live', sourceName: src.name, credit: src.credit || '', stations: valid, stats, dataTime };
      }
      // 範圍內有測站但全部過期 → 視為來源暫停更新
      const err = (stats.inBBox > 0 && stats.stale + stats.badValue === stats.inBBox && stats.stale > 0)
        ? new DataError('stale', formatTaipei(stats.latest, { withDate: true }))
        : new DataError('few');
      reasons.push(describeFailure(src.name, err));
    } catch (e) {
      reasons.push(describeFailure(src.name, e));
    }
  }
  const err = new DataError('none');
  err.reasons = reasons.length ? reasons : [describeFailure('', err)];
  throw err;
}

/**
 * Open-Meteo：所有跑點（＋使用者位置）座標以逗號串接，一次請求取回。
 * points: [{ key, lat, lng }] → 回傳 { key: { rain, uvi, feels } }，缺值為 null。
 * 取「台北時間當下整點」那一筆作為現況值。
 */
async function loadWeatherLive(points) {
  const params = new URLSearchParams({
    latitude: points.map((p) => p.lat.toFixed(4)).join(','),
    longitude: points.map((p) => p.lng.toFixed(4)).join(','),
    hourly: 'apparent_temperature,precipitation_probability,uv_index',
    timezone: 'Asia/Taipei',
    forecast_days: '1',
  });
  const json = await fetchJson(`${CONFIG.OPEN_METEO_URL}?${params}`);
  const list = Array.isArray(json) ? json : [json]; // 單一座標時回傳物件，多座標時回傳陣列
  if (list.length !== points.length) throw new DataError('parse');
  const hourKey = currentTaipeiHourKey();
  const byKey = {};
  points.forEach((p, i) => {
    const h = list[i] && list[i].hourly;
    const idx = h && Array.isArray(h.time) ? h.time.indexOf(hourKey) : -1;
    const pick = (arr) => (idx >= 0 && Array.isArray(arr) ? toNum(arr[idx]) : null);
    byKey[p.key] = {
      rain: pick(h && h.precipitation_probability),
      uvi: pick(h && h.uv_index),
      feels: pick(h && h.apparent_temperature),
    };
  });
  return { mode: 'live', sourceName: 'Open-Meteo', byKey, hourKey };
}

/** 產生 Mock 測站：背景測站＋跑點錨點測站（時間戳記為最近 15 分鐘內） */
function buildMockStations(scenarioId, now = new Date()) {
  const sc = MOCK_SCENARIOS[scenarioId];
  const stations = MOCK_STATIONS.map((st, i) => ({
    id: st.id, name: `${st.name}（模擬）`, lat: st.lat, lng: st.lng,
    pm25: sc.stationPm(st), time: new Date(now - ((i * 7) % 15) * 60e3),
  }));
  for (const spot of RUN_SPOTS) {
    const ov = sc.spots[spot.id];
    if (ov && ov.pm25 !== undefined) {
      stations.push({ id: `anchor-${spot.id}`, name: `${spot.name}旁（模擬）`,
                      lat: spot.lat + 0.0001, lng: spot.lng, pm25: ov.pm25, time: new Date(now) });
    }
  }
  return stations;
}

/** 產生 Mock 氣象：跑點＝情境基準值＋覆寫；其他座標（如使用者位置）採最近跑點的值 */
function buildMockWeather(scenarioId, points) {
  const sc = MOCK_SCENARIOS[scenarioId];
  const spotWx = (spot) => {
    const ov = sc.spots[spot.id] || {};
    return {
      rain: ov.rain !== undefined ? ov.rain : sc.weather.rain,
      uvi: ov.uvi !== undefined ? ov.uvi : sc.weather.uvi,
      feels: ov.feels !== undefined ? ov.feels : sc.weather.feels,
    };
  };
  const byKey = {};
  for (const p of points) {
    const spot = p.spotId !== undefined ? RUN_SPOTS.find((s) => s.id === p.spotId) : nearestSpot(p.lat, p.lng);
    byKey[p.key] = spotWx(spot);
  }
  return byKey;
}

/** 行政區判定（離線、近似）：市界外回傳「台北市外」，否則取最近的行政區中心點 */
function districtOf(lat, lng) {
  if (!pointInPolygon(lat, lng)) return OUTSIDE_DISTRICT;
  let best = null, bestD = Infinity;
  for (const [name, la, ln] of DISTRICT_CENTROIDS) {
    const d = haversine(lat, lng, la, ln);
    if (d < bestD) { best = name; bestD = d; }
  }
  return best;
}

/** 找出離指定座標最近的跑點 */
function nearestSpot(lat, lng) {
  let best = null, bestD = Infinity;
  for (const s of RUN_SPOTS) {
    const d = haversine(lat, lng, s.lat, s.lng);
    if (d < bestD) { best = s; bestD = d; }
  }
  return best;
}

/** 氣象查詢點：所有跑點＋（若已定位）使用者位置 */
function weatherPoints() {
  const pts = RUN_SPOTS.map((s) => ({ key: `spot-${s.id}`, spotId: s.id, lat: s.lat, lng: s.lng }));
  if (state.userPos) pts.push({ key: 'user', lat: state.userPos.lat, lng: state.userPos.lng });
  if (state.searchPlace && state.searchPlace.inTaipei) pts.push({ key: 'search', lat: state.searchPlace.lat, lng: state.searchPlace.lng });
  // 我的最愛的自選點位：與跑點同一次批次查詢（Open-Meteo 多座標請求）
  for (const f of favStore.items) if (f.kind === 'place') pts.push({ key: `fav-${f.id}`, lat: f.lat, lng: f.lng });
  return pts;
}

/**
 * 載入資料（依資料模式）並計算各跑點 / 使用者位置的四項指標。
 * - 即時資料：PM2.5 與氣象「各自」嘗試即時來源，失敗者個別降級為「正常」Mock。
 * - 情境模式：兩者皆使用對應 Mock。
 */
let refreshSeq = 0;
async function refreshData() {
  const seq = ++refreshSeq;
  const mode = state.dataMode;
  const points = weatherPoints();
  let pm, wx;

  if (mode === 'live') {
    const [pmRes, wxRes] = await Promise.allSettled([loadPm25Live(), loadWeatherLive(points)]);
    pm = pmRes.status === 'fulfilled' ? pmRes.value
       : { mode: 'mock', sourceName: 'Mock', stations: buildMockStations('normal'), reasons: pmRes.reason.reasons || [describeFailure('PM2.5 資料來源', pmRes.reason)] };
    wx = wxRes.status === 'fulfilled' ? wxRes.value
       : { mode: 'mock', sourceName: 'Mock', byKey: buildMockWeather('normal', points), reasons: [describeFailure('Open-Meteo 氣象資料', wxRes.reason)] };
  } else {
    const reason = `目前為情境測試「${MOCK_SCENARIOS[mode].label}」，顯示模擬數據`;
    pm = { mode: 'mock', sourceName: 'Mock', stations: buildMockStations(mode), reasons: [reason] };
    wx = { mode: 'mock', sourceName: 'Mock', byKey: buildMockWeather(mode, points), reasons: [] };
  }
  if (seq !== refreshSeq) return; // 已有較新的請求（例如快速切換模式），捨棄舊結果

  state.data = { mode, pm, wx, updatedAt: new Date() };
  computeReadings();
  updateHeatmap(); // 熱力圖只在資料更新時重算
  render();
  monitorCheck();   // 背景監測：隨每次資料更新檢查燈號是否轉差
  scheduleRefresh();
}

/** 下一次自動更新排在「這次更新完成後」10 分鐘（切換模式等手動更新也會重新計時，監測顯示的下次檢查時間才準） */
let refreshTimer = null;
function scheduleRefresh() {
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(refreshData, CONFIG.REFRESH_MS);
}

/** 由測站與氣象計算每個跑點（及使用者位置）的四項指標 */
function computeReadings() {
  const { pm, wx } = state.data;
  const readingAt = (lat, lng, key) => {
    const w = wx.byKey[key] || {};
    const est = idwEstimate(lat, lng, pm.stations);
    return { pm25: est ? est.value : null, pmEstimate: est,
             rain: toNum(w.rain), uvi: toNum(w.uvi), feels: toNum(w.feels) };
  };
  state.readings = {};
  for (const s of RUN_SPOTS) state.readings[s.id] = readingAt(s.lat, s.lng, `spot-${s.id}`);
  state.userReading = state.userPos ? readingAt(state.userPos.lat, state.userPos.lng, 'user') : null;
  const sp = state.searchPlace;
  state.searchReading = sp && sp.inTaipei && wx.byKey.search ? readingAt(sp.lat, sp.lng, 'search') : null;
  state.favReadings = {};
  for (const f of favStore.items) {
    if (f.kind === 'place' && wx.byKey[`fav-${f.id}`]) state.favReadings[f.id] = readingAt(f.lat, f.lng, `fav-${f.id}`);
  }
  computeEvaluations();
}

/** 資料來源狀態（供介面標記與原因說明） */
function getSourceStatus() {
  const d = state.data;
  if (!d) return { kind: 'loading', label: '載入中…', reasons: ['正在取得資料'] };
  if (d.mode !== 'live') return { kind: 'offline', label: '離線 / 展示模式', reasons: d.pm.reasons };
  const reasons = [];
  reasons.push(d.pm.mode === 'live'
    ? `PM2.5：即時資料（${d.pm.sourceName}，${d.pm.stations.length} 站，${formatTaipei(d.pm.dataTime)} 資料）`
    : `PM2.5：${d.pm.reasons.join('；')}，目前為展示數據`);
  if (d.pm.mode === 'live' && d.pm.credit) reasons.push(d.pm.credit);
  reasons.push(d.wx.mode === 'live'
    ? `氣象：即時資料（Open-Meteo，${d.wx.hourKey.slice(11)} 整點預報）`
    : `氣象：${d.wx.reasons.join('；')}，目前為展示數據`);
  const liveCount = (d.pm.mode === 'live') + (d.wx.mode === 'live');
  if (liveCount === 2) return { kind: 'live', label: '即時資料', reasons };
  return { kind: 'offline', label: liveCount === 0 ? '離線 / 展示模式' : '部分離線 / 展示模式', reasons };
}

/** 射線法：判斷座標是否在多邊形內（poly 為 [lat, lng] 陣列） */
function pointInPolygon(lat, lng, poly = TAIPEI_OUTLINE) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [yi, xi] = poly[i], [yj, xj] = poly[j];
    if ((yi > lat) !== (yj > lat) && lng < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/**
 * IDW 估算指定座標的 PM2.5（跑點、使用者位置、熱力圖共用此函式，規則只有一套）。
 * - 數值：一律使用「全部有效測站」的反距離加權，w = 1 / d^p（p = 2）；
 *   與最近測站距離 < snapM（50 m）時直接採用該測站數值。
 * - 距離遠近只影響顯示，不影響數值：
 *     heatBlank：最近測站 > heatBlankM（8 km）→ 熱力圖留白；
 *     nearby   ：最近測站 ≤ nearLabelM（5 km）；否則資訊卡標示「5 公里內無測站，數值以較遠測站推估」。
 * - nearest：最近的測站物件（資訊卡據此判斷是否「使用移動平均值」）。
 * - 距離用等距圓柱近似（誤差 < 0.1%，台北範圍內足夠），熱力圖每格都呼叫，需要快。
 * 回傳 { value, method: 'snap' | 'idw', nearestM, nearest, heatBlank, nearby, n } 或 null（沒有任何測站）。
 */
function idwEstimate(lat, lng, stations, {
  power = CONFIG.IDW.power, snapM = CONFIG.IDW.snapM,
  heatBlankM = CONFIG.IDW.heatBlankM, nearLabelM = CONFIG.IDW.nearLabelM,
} = {}) {
  const n = stations ? stations.length : 0;
  if (n === 0) return null;
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110950;
  const half = power / 2;
  let best = Infinity, bestSt = null, sw = 0, sv = 0;
  for (let i = 0; i < n; i++) {
    const st = stations[i];
    const dy = (st.lat - lat) * ky, dx = (st.lng - lng) * kx;
    const d2 = dx * dx + dy * dy;
    if (d2 < best) { best = d2; bestSt = st; }
    const w = d2 === 0 ? 1e12 : (half === 1 ? 1 / d2 : d2 ** -half);
    sw += w; sv += w * st.pm25;
  }
  const nearestM = Math.sqrt(best);
  const snapped = nearestM < snapM;
  return {
    value: round(snapped ? bestSt.pm25 : sv / sw),
    method: snapped ? 'snap' : 'idw',
    nearestM,
    nearest: bestSt,
    heatBlank: nearestM > heatBlankM,
    nearby: nearestM <= nearLabelM,
    n,
  };
}

/* =====================================================================
   §5 判定：三級門檻（連續區間，最高風險一票否決）
   ===================================================================== */

// 燈號嚴重度：數字越大越嚴重（'unknown' 不參與比較）
const LEVEL_RANK = { green: 0, yellow: 1, red: 2 };

// 指標定義；陣列順序即「同燈號時的主因優先順序」：PM2.5 > 降雨 > 紫外線 > 體感溫度
const INDICATORS = [
  { key: 'pm25',  label: 'PM2.5',    unit: 'μg/m³', digits: 1 },
  { key: 'rain',  label: '降雨機率', unit: '%',     digits: 0 },
  { key: 'uvi',   label: '紫外線',   unit: 'UVI',   digits: 1 },
  { key: 'feels', label: '體感溫度', unit: '°C',    digits: 1 },
];

/**
 * 單項指標分級（純函式）。門檻：
 *   PM2.5：≤ 15.4 綠｜> 15.4 且 < 35.5 黃｜≥ 35.5 紅
 *   降雨  ：≤ 30 綠  ｜> 30 且 ≤ 60 黃    ｜> 60 紅
 *   UVI   ：≤ 5.0 綠 ｜> 5.0 且 < 8.0 黃  ｜≥ 8.0 紅
 *   體感  ：10.0～30.0 綠｜5.0～< 10.0 或 > 30.0～33.0 黃｜< 5.0 或 > 33.0 紅
 * 回傳 'green' | 'yellow' | 'red'；數值缺失回傳 null。
 */
function classifyIndicator(key, v) {
  if (v === null || v === undefined || !Number.isFinite(v)) return null;
  switch (key) {
    case 'pm25':  return v <= 15.4 ? 'green' : v < 35.5 ? 'yellow' : 'red';
    case 'rain':  return v <= 30 ? 'green' : v <= 60 ? 'yellow' : 'red';
    case 'uvi':   return v <= 5.0 ? 'green' : v < 8.0 ? 'yellow' : 'red';
    case 'feels':
      if (v >= 10.0 && v <= 30.0) return 'green';
      if ((v >= 5.0 && v < 10.0) || (v > 30.0 && v <= 33.0)) return 'yellow';
      return 'red';
    default: return null;
  }
}

/**
 * 總體判定（純函式，方便測試）。
 * 輸入：{ pm25, rain, uvi, feels }（缺值為 null / undefined）
 * 輸出：{
 *   status:  'green' | 'yellow' | 'red' | 'unknown'（四項皆缺 → 資料不足）,
 *   levels:  { pm25, rain, uvi, feels }（各單項燈號，缺值為 null）,
 *   primary: { key, level, direction } | null（造成最高風險的指標；全綠或資料不足時為 null；
 *            direction 僅體感溫度使用：'hot' / 'cold'）,
 *   missing: 缺值指標 key 陣列, partial: 是否「部分資料暫缺」
 * }
 * 規則：任一紅 → 紅；無紅但任一黃 → 黃；有效項皆綠 → 綠；缺值不參與判定。
 */
function evaluate(values) {
  const levels = {}, missing = [];
  let primary = null;
  for (const ind of INDICATORS) {
    const v = values ? values[ind.key] : undefined;
    const lv = classifyIndicator(ind.key, v);
    levels[ind.key] = lv;
    if (lv === null) { missing.push(ind.key); continue; }
    // 嚴格大於：同燈號時保留陣列中較前面（優先順序較高）的指標
    if (lv !== 'green' && (!primary || LEVEL_RANK[lv] > LEVEL_RANK[primary.level])) {
      primary = { key: ind.key, level: lv, direction: ind.key === 'feels' ? (v > 30 ? 'hot' : 'cold') : null };
    }
  }
  const status = missing.length === INDICATORS.length ? 'unknown' : primary ? primary.level : 'green';
  return { status, levels, primary, missing, partial: missing.length > 0 && status !== 'unknown' };
}

/** 依主因產生一句白話行動建議 */
const ADVICE = {
  pm25:  { yellow: 'PM2.5 略高，敏感族群建議降低強度或縮短時間', red: 'PM2.5 偏高，建議改至室內運動或換個跑點' },
  rain:  { yellow: '降雨機率偏高，建議攜帶輕便雨具或縮短路線',   red: '降雨機率高，建議改期或改至室內運動' },
  uvi:   { yellow: '紫外線偏強，建議做好防曬或改在傍晚出發',     red: '紫外線過量，建議改在傍晚或清晨出發' },
  feels_hot:  { yellow: '體感偏熱，建議放慢配速並多補充水分',   red: '體感炎熱、有中暑風險，建議改在清晨或傍晚' },
  feels_cold: { yellow: '體感偏涼，建議充分暖身並加件薄外套',   red: '體感寒冷，建議做好保暖或改至室內運動' },
};
function adviceFor(ev) {
  if (!ev || ev.status === 'unknown') return '資料暫缺，暫時無法判斷是否適合出發';
  if (!ev.primary) return '各項指標良好，適合出發';
  const k = ev.primary.key === 'feels' ? `feels_${ev.primary.direction}` : ev.primary.key;
  return ADVICE[k][ev.primary.level];
}

/** 依目前讀值計算所有跑點與使用者位置的判定結果 */
function computeEvaluations() {
  state.evaluations = {};
  for (const s of RUN_SPOTS) {
    if (state.readings[s.id]) state.evaluations[s.id] = evaluate(state.readings[s.id]);
  }
  state.userEvaluation = state.userReading ? evaluate(state.userReading) : null;
  state.searchEvaluation = state.searchReading ? evaluate(state.searchReading) : null;
  state.favEvaluations = {};
  for (const id of Object.keys(state.favReadings)) state.favEvaluations[id] = evaluate(state.favReadings[id]);
}

  if (state.data && heatField) {
    let seed = 20240607;
    const rnd = () => { seed = (seed + 0x6D2B79F5) | 0; let x = Math.imul(seed ^ (seed >>> 15), 1 | seed);
                        x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x; return ((x ^ (x >>> 14)) >>> 0) / 4294967296; };
    const lats = TAIPEI_OUTLINE.map((q) => q[0]), lngs = TAIPEI_OUTLINE.map((q) => q[1]);
    const [la0, la1, ln0, ln1] = [Math.min(...lats), Math.max(...lats), Math.min(...lngs), Math.max(...lngs)];
    let bad = 0, checked = 0, blanks = 0;
    while (checked < 50) {
      const la = la0 + rnd() * (la1 - la0), ln = ln0 + rnd() * (ln1 - ln0);
      if (!pointInPolygon(la, ln)) continue;
      checked++;

      const okPt = wantBlank ? px.value === null : classifyIndicator('pm25', px.value) === classifyIndicator('pm25', est.value);
      if (!okPt) bad++;
    }
    cases.push({ name: `熱力圖等級 = idwEstimate 等級（隨機 50 點，其中留白 ${blanks} 點）`, expected: 0, actual: bad, ok: bad === 0 });
  }

}

/** WCAG 2 對比度（輸入 #RRGGBB） */
function contrastRatio(hex1, hex2) {
  const lum = (hex) => {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const [a, b] = [lum(hex1), lum(hex2)].sort((x, y) => y - x);
  return (a + 0.05) / (b + 0.05);
}

/** 初始化地圖、底圖與標籤圖層 */
function initMap() {
  map = L.map('map', {
    center: CONFIG.DEFAULT_CENTER,
    zoom: CONFIG.DEFAULT_ZOOM,
    zoomControl: false,
    attributionControl: true,
  });
  // 右下角：先加「回到我的位置」再加縮放鈕（Leaflet 底部角落由下往上堆疊，定位鈕會在最下方、拇指最易點）
  addLocateControl();
  L.control.zoom({ position: 'bottomright', zoomInTitle: '放大', zoomOutTitle: '縮小' }).addTo(map);

  // 主圖層：CARTO 淺色無標籤
  L.tileLayer(CONFIG.TILE_BASE, {
    subdomains: 'abcd', maxZoom: 19, attribution: CONFIG.ATTRIBUTION, key: CONFIG.CARTO_API_KEY,
  }).addTo(map);

  // 純標籤圖層放在獨立 pane：高於熱力圖、低於跑點標記，且不攔截點擊
  map.createPane('labels');
  map.getPane('labels').style.zIndex = 450;
  map.getPane('labels').style.pointerEvents = 'none';
  labelLayer = L.tileLayer(CONFIG.TILE_LABELS, { subdomains: 'abcd', maxZoom: 19, pane: 'labels', key: CONFIG.CARTO_API_KEY });

  map.on('zoomend', updateLabelLayer);
  updateLabelLayer();
}

/** 縮放 ≥ 14 時顯示標籤圖層，否則移除 */
function updateLabelLayer() {
  const show = map.getZoom() >= CONFIG.LABEL_MIN_ZOOM;
  if (show && !map.hasLayer(labelLayer)) labelLayer.addTo(map);
  if (!show && map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
}

/** 依狀態產生跑點標記圖示（狀態色圓形＋白色狀態圖示） */
function spotIcon(status, selected, fav = false) {
  const meta = STATUS_META[status];
  return L.divIcon({
    className: `spot-marker ${meta.cls}${selected ? ' is-selected' : ''}`,
    html: `<div class="pin">${iconSvg(meta.icon)}${fav ? `<span class="fav-badge">${iconSvg('i-star')}</span>` : ''}</div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
}

/** 依 RUN_SPOTS 建立 / 更新所有跑點標記 */
function renderMarkers() {
  for (const spot of RUN_SPOTS) {
    const status = getSpotStatus(spot.id);
    const selected = state.selectedId === spot.id;
    let marker = spotMarkers.get(spot.id);
    if (!marker) {
      marker = L.marker([spot.lat, spot.lng], {
        title: spot.name, alt: spot.name, keyboard: true, riseOnHover: true,
      }).addTo(map);
      marker.on('click', () => selectSpot(spot.id));
      marker.bindTooltip(spot.name, { direction: 'top', offset: [0, -18] });
      spotMarkers.set(spot.id, marker);
    }
    const isFav = favStore.hasSpot(spot.id);
    marker.setIcon(spotIcon(status, selected, isFav));
    marker.setTooltipContent(spotTooltipHtml(spot));
    marker.setZIndexOffset(selected ? 1000 : 0);
    // 標記的無障礙名稱同時包含狀態文字
    const el = marker.getElement();
    if (el) el.setAttribute('aria-label', `${spot.name}，${STATUS_META[status].label}${isFav ? '，我的最愛' : ''}`);
  }
}

/** 標記提示：名稱＋四項數值（資訊卡於第 5 階段加入） */
function spotTooltipHtml(spot) {
  const r = state.readings[spot.id];
  if (!r) return escapeHtml(spot.name);
  const ev = state.evaluations[spot.id];
  const meta = STATUS_META[ev ? ev.status : 'unknown'];
  return `<strong>${escapeHtml(spot.name)}</strong>｜<span class="${meta.cls}" style="color:var(--st-text);font-weight:600">${meta.label}</span>`
    + `<br>${escapeHtml(adviceFor(ev))}`
    + `<br><span class="num">PM2.5 ${fmtVal(r.pm25, 1)}・降雨 ${fmtVal(r.rain, 0, '%')}・UVI ${fmtVal(r.uvi, 1)}・體感 ${fmtVal(r.feels, 1, '°C')}</span>`
    + (ev && ev.partial ? '<br>部分資料暫缺' : '');
}

/** 數值顯示：缺值顯示「—」 */
function fmtVal(v, digits = 1, unit = '') {
  return v === null || v === undefined ? '—' : v.toFixed(digits) + unit;
}
