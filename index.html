<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F8FAFC">
<title>SafeAir Run</title>
<meta name="description" content="慢跑場域環境查詢：依 PM2.5、降雨機率、紫外線與體感溫度判斷台北跑點是否適合出發。">
<!-- 唯一的外部依賴：Leaflet 1.9.4（鎖定版本，附 SRI 完整性校驗） -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
/* =====================================================================
   §S1 設計 Token
   ===================================================================== */
:root {
  --bg: #F8FAFC;            /* 背景主色 Slate-50 */
  --surface: #FFFFFF;       /* 容器底色 */
  --text: #0F172A;          /* 文字主色 Slate-900 */
  --text-2: #475569;        /* 次要文字 Slate-600 */
  --line: #E2E8F0;          /* 分隔線 Slate-200 */
  --hover: #F1F5F9;         /* 滑過底色 Slate-100 */
  --focus: #2563EB;         /* 鍵盤焦點框 */
  --user: #2563EB;          /* 使用者位置藍點 */

  /* 三級狀態＋資料不足：500 色系（圖示/標記/色塊）、深色（文字）、淡底（標籤底色） */
  --green: #10B981;  --green-text: #047857;  --green-bg: #ECFDF5;
  --yellow: #F59E0B; --yellow-text: #B45309; --yellow-bg: #FFFBEB;
  --red: #EF4444;    --red-text: #B91C1C;    --red-bg: #FEF2F2;
  --gray: #94A3B8;   --gray-text: #475569;   --gray-bg: #F1F5F9;

  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
  --radius: 12px;
  --shadow: 0 4px 16px rgba(15, 23, 42, .12);
  --sidebar-w: 380px;
  --sheet-offset: 16px;     /* 地圖右下控制項距底部（窄螢幕會隨 Bottom Sheet 高度調整） */
  --touch: 44px;            /* 最小觸控區域 */
}

/* =====================================================================
   §S2 版面骨架（Mobile-first，斷點 768px）
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.icon { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
           overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

#app { position: relative; height: 100%; display: flex; }
#mapWrap { position: relative; flex: 1; min-width: 0; height: 100%; }
#map { position: absolute; inset: 0; background: var(--bg); }

/* 窄螢幕：側邊欄隱藏，地圖全螢幕 */
#sidebar { display: none; }

/* 寬螢幕：左側固定側邊欄 380px，其餘鋪滿地圖 */
@media (min-width: 768px) {
  #sidebar {
    display: flex; flex-direction: column;
    width: var(--sidebar-w); flex: none; height: 100%;
    background: var(--surface); border-right: 1px solid var(--line);
    z-index: 1000; /* 高於 Leaflet 控制項 */
  }
}

/* =====================================================================
   §S3 元件：側邊欄、跑點列表、狀態標籤
   ===================================================================== */
.sb-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--green);
              display: grid; place-items: center; color: #fff; }
.brand-mark .icon { width: 18px; height: 18px; }
.sb-section-title { margin: 0; padding: 14px 20px 6px; font-size: 13px; font-weight: 600;
                    color: var(--text-2); letter-spacing: .02em; }
.sb-scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; }

.spot-list { list-style: none; margin: 0; padding: 0 8px 16px; }
.spot-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  min-height: 56px; padding: 8px 12px; border: 0; border-radius: 10px;
  background: transparent; text-align: left; cursor: pointer;
}
.spot-item:hover { background: var(--hover); }
.spot-item[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--text); }
.spot-item .meta { flex: 1; min-width: 0; }
.spot-item .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spot-item .sub { font-size: 13px; color: var(--text-2); }
.spot-item .dist { font-size: 13px; color: var(--text-2); white-space: nowrap; }

/* 狀態圓形徽章（色塊＋白色圖示），用於列表與標記 */
.status-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
              color: #fff; flex: none; }
.status-dot .icon { width: 16px; height: 16px; stroke-width: 2.5; }
.st-green  { --st: var(--green);  --st-text: var(--green-text);  --st-bg: var(--green-bg); }
.st-yellow { --st: var(--yellow); --st-text: var(--yellow-text); --st-bg: var(--yellow-bg); }
.st-red    { --st: var(--red);    --st-text: var(--red-text);    --st-bg: var(--red-bg); }
.st-unknown{ --st: var(--gray);   --st-text: var(--gray-text);   --st-bg: var(--gray-bg); }
.status-dot { background: var(--st); }

/* =====================================================================
   §S4 窄螢幕頂部懸浮列（第 5 階段改為搜尋欄）
   ===================================================================== */
#mobileTop {
  position: absolute; z-index: 1000; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px;
  display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 14px;
  background: var(--surface); border-radius: 24px; box-shadow: var(--shadow);
}
@media (min-width: 768px) { #mobileTop { display: none; } }

/* =====================================================================
   §S5 地圖：跑點標記、使用者位置、控制按鈕
   ===================================================================== */
.leaflet-container { font-family: var(--font); }
.leaflet-bottom { bottom: var(--sheet-offset); transition: bottom .25s ease; }
.leaflet-control-attribution { font-size: 11px; }

.spot-marker { background: none; border: 0; }
.spot-marker .pin {
  width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
  background: var(--st); color: #fff; border: 2px solid #fff;
  box-shadow: 0 2px 6px rgba(15, 23, 42, .35); transition: transform .15s ease;
}
.spot-marker .pin .icon { width: 18px; height: 18px; stroke-width: 2.5; }
.spot-marker.is-selected .pin { transform: scale(1.25); box-shadow: 0 0 0 4px rgba(15, 23, 42, .25), 0 2px 6px rgba(15, 23, 42, .35); }

/* 使用者位置：藍色圓點＋外圈脈動 */
.user-marker { background: none; border: 0; }
.user-marker .dot { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
                    border-radius: 50%; background: var(--user); border: 3px solid #fff;
                    box-shadow: 0 1px 4px rgba(15, 23, 42, .4); }
.user-marker .pulse { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px;
                      border-radius: 50%; background: rgba(37, 99, 235, .35); animation: pulse 2s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(3.5); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .user-marker .pulse { animation: none; transform: scale(2); opacity: .4; } }

/* 地圖圓形按鈕（觸控區域 ≥ 44×44） */
.map-btn {
  width: var(--touch); height: var(--touch); border: 0; border-radius: 50%;
  background: var(--surface); color: var(--text); box-shadow: var(--shadow);
  display: grid; place-items: center; cursor: pointer;
}
.map-btn:hover { background: var(--hover); }
.leaflet-control.map-btn { margin-right: 12px; }
.leaflet-touch .leaflet-bar a { width: 36px; height: 36px; line-height: 36px; }

/* =====================================================================
   §S5-2 側邊欄底部：資料狀態與資料模式切換
   ===================================================================== */
.sb-footer { border-top: 1px solid var(--line); padding: 12px 20px 16px; display: grid; gap: 10px; }
.sb-status { display: flex; align-items: center; justify-content: space-between; gap: 8px;
             font-size: 13px; color: var(--text-2); }
.field-label { font-size: 13px; font-weight: 600; color: var(--text-2); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px;
       background: var(--hover); border-radius: 10px; }
.seg button { min-height: 36px; padding: 0 4px; border: 0; border-radius: 7px; background: transparent;
              font-size: 13px; color: var(--text-2); cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 600;
                                   box-shadow: 0 1px 3px rgba(15, 23, 42, .15); }

/* 資料來源狀態標記：滑鼠移上或點擊時顯示原因 */
.src-wrap { position: relative; }
.src-badge { display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 2px 10px;
             border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
             font-size: 12px; cursor: pointer; white-space: nowrap; }
.src-badge .icon { width: 14px; height: 14px; }
.src-badge.is-live { color: var(--green-text); border-color: #A7F3D0; background: var(--green-bg); }
.src-badge.is-offline { color: var(--gray-text); background: var(--gray-bg); }
.src-badge.is-loading { color: var(--text-2); }
.src-pop { display: none; position: absolute; z-index: 1200; right: 0; bottom: calc(100% + 8px); width: 280px;
           padding: 10px 12px; border-radius: 10px; background: var(--text); color: #fff; font-size: 13px;
           line-height: 1.6; box-shadow: var(--shadow); }
.src-pop ul { margin: 0; padding-left: 18px; }
.src-pop.below { bottom: auto; top: calc(100% + 8px); }
.src-wrap.open .src-pop { display: block; }
@media (hover: hover) { .src-wrap:hover .src-pop { display: block; } }
#mobileTop .src-wrap { margin-left: auto; }

/* =====================================================================
   §S6 小提示（Toast）
   ===================================================================== */
#toast {
  position: absolute; z-index: 1100; left: 50%; bottom: calc(var(--sheet-offset) + 72px);
  transform: translate(-50%, 8px); max-width: calc(100% - 32px);
  padding: 10px 16px; border-radius: 10px; background: var(--text); color: #fff; font-size: 14px;
  opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<!-- =====================================================================
     內嵌 SVG 圖示（不引用外部圖示庫；線條風格 24×24）
     ===================================================================== -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 9.8"/></symbol>
  <symbol id="i-alert-triangle" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></symbol>
  <symbol id="i-help-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
  <symbol id="i-run" viewBox="0 0 24 24"><circle cx="14" cy="4.5" r="1.8"/><path d="M8 21l3-6 3 2v5"/><path d="M6 12l2-4 4-1 3 3 3 1"/><path d="M11 15l1-5"/></symbol>
</svg>

<div id="app">
  <!-- 寬螢幕側邊欄：搜尋欄 → 資訊卡 → 跑點列表（搜尋與資訊卡於第 5 階段加入） -->
  <aside id="sidebar" aria-label="跑點資訊">
    <div class="sb-header">
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-run"/></svg></span>SafeAir Run</div>
    </div>
    <div class="sb-scroll">
      <h2 class="sb-section-title">跑點列表</h2>
      <ul id="spotList" class="spot-list"></ul>
    </div>
    <!-- 側邊欄底部：資料更新時間、資料來源狀態、資料模式切換 -->
    <div class="sb-footer">
      <div class="sb-status">
        <span>資料更新 <time id="updatedAt" class="num">—</time></span>
        <div class="src-wrap" data-src="sidebar"></div>
      </div>
      <div class="field-label" id="modeLabel">資料模式</div>
      <div class="seg" id="modeSeg" role="group" aria-labelledby="modeLabel"></div>
    </div>
  </aside>

  <main id="mapWrap">
    <div id="map" role="application" aria-label="跑點地圖"></div>
    <!-- 窄螢幕頂部懸浮列（第 5 階段改為搜尋欄） -->
    <div id="mobileTop">
      <div class="brand"><span class="brand-mark"><svg class="icon"><use href="#i-run"/></svg></span>SafeAir Run</div>
      <div class="src-wrap" data-src="mobile"></div>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';

/* =====================================================================
   §1 資料：跑點資料集（放在最前面；新增跑點只需在此陣列加一筆）
   ---------------------------------------------------------------------
   結構：{ id, name, district, type, lat, lng, desc }
   - type：'riverside'（河濱）或 'park'（公園）
   - lat / lng 已由使用者核對，請勿修改
   ===================================================================== */
const RUN_SPOTS = [
  { id: 1, name: '大安森林公園',     district: '大安區', type: 'park',      lat: 25.02970, lng: 121.53629,
    desc: '市中心大型林蔭公園，環狀步道平坦、遮蔭充足' },
  { id: 2, name: '大佳河濱公園',     district: '中山區', type: 'riverside', lat: 25.07471, lng: 121.54111,
    desc: '沿基隆河岸，視野開闊、少紅綠燈' },
  { id: 3, name: '國立中正紀念堂',   district: '中正區', type: 'park',      lat: 25.03556, lng: 121.52024,
    desc: '廣場與外圍環狀步道，地勢平坦、夜間照明佳' },
  { id: 4, name: '花博公園新生園區', district: '中山區', type: 'park',      lat: 25.06999, lng: 121.53124,
    desc: '園區步道串連花圃與草坪，動線寬敞、適合輕鬆跑' },
  { id: 5, name: '青年公園',         district: '萬華區', type: 'park',      lat: 25.02306, lng: 121.50526,
    desc: '設有田徑場與林蔭步道，適合繞圈練跑' },
];

/* =====================================================================
   §0 設定常數（集中管理，其餘程式不寫死數值）
   ===================================================================== */
const CONFIG = {
  // 台北市範圍框（測站篩選、熱力圖網格使用）
  BBOX: { minLng: 121.45, maxLng: 121.67, minLat: 24.96, maxLat: 25.21 },
  // 定位失敗時的預設中心：台北車站，縮放 12
  DEFAULT_CENTER: [25.0478, 121.5170],
  DEFAULT_ZOOM: 12,
  LOCATED_ZOOM: 14,          // 取得定位後的縮放等級
  SPOT_ZOOM: 15,             // 選取跑點時的縮放等級
  LABEL_MIN_ZOOM: 14,        // 縮放 ≥ 14 疊加 CARTO 純標籤圖層
  GEO_TIMEOUT_MS: 10000,     // 定位逾時
  REFRESH_MS: 10 * 60 * 1000, // 兩個資料來源皆每 10 分鐘自動更新
  FETCH_TIMEOUT_MS: 8000,    // 請求逾時 8 秒視為失敗
  STATION_MAX_AGE_MIN: 60,   // 測站更新時間距今超過 60 分鐘即排除
  PM25_MIN: 0,               // PM2.5 有效範圍下限：≤ 0 排除（0 值多為感測異常，見 lassAdapter 註解）
  PM25_MAX: 500,             // PM2.5 有效範圍上限（> 500 排除）
  MIN_VALID_STATIONS: 2,     // 台北範圍內有效測站 < 2 時改用 Mock
  IDW: { power: 2, snapM: 50, radiiM: [3000, 5000] }, // IDW：p=2、<50m 直接採用、3km → 5km
  TAIPEI_UTC_OFFSET_H: 8,    // 台灣無日光節約時間，固定 UTC+8
  OPEN_METEO_URL: 'https://api.open-meteo.com/v1/forecast',
  // CARTO 底圖金鑰（CARTO 已改為需要免費 API 金鑰，否則回傳「API KEY REQUIRED」浮水印圖磚）。
  // 此金鑰會隨前端程式公開；部署後請至 CARTO 後台將金鑰限制在部署網域（Referer），見 README。
  CARTO_API_KEY: 'cb1_5e1f_1_c7302948d999cce1d9d6c96b',
  TILE_BASE: 'https://{s}.basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}{r}.png?key={key}',
  TILE_LABELS: 'https://{s}.basemaps.cartocdn.com/rastertiles/light_only_labels/{z}/{x}/{y}{r}.png?key={key}',
  ATTRIBUTION: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> 貢獻者 &copy; <a href="https://carto.com/attributions">CARTO</a>',
};

/* ---------------------------------------------------------------------
   PM2.5 資料來源（可抽換介面）
   - 依陣列順序嘗試 enabled 的來源，第一個取得 ≥ 2 個台北有效測站者採用。
   - 每個來源提供 adapter(json) → 標準測站陣列 [{ id, name, lat, lng, pm25, time(Date) }]，
     清洗（範圍框、數值範圍、時效）由共用的 cleanStations() 處理。
   - adapter 為函式宣告（會被提升），可在此直接引用。
   --------------------------------------------------------------------- */
const PM25_SOURCES = [
  { id: 'lass', name: 'LASS 空氣盒子', enabled: true,
    url: 'https://pm25.lass-net.org/data/last-all-airbox.json', adapter: lassAdapter },
  // 民生公共物聯網 SensorThings API：2026-11-21 起 SSL 憑證過期，尚未實測 CORS，暫不啟用
  { id: 'sta', name: '民生公共物聯網（STA）', enabled: false,
    url: 'https://sta.ci.taiwan.gov.tw/STA_AirQuality_EPAIoT/v1.0', adapter: staAdapter },
];

// 資料模式：即時資料（失敗自動降級為「正常」Mock）與三種 Demo 情境
const DATA_MODES = [
  { id: 'live',      label: '即時資料' },
  { id: 'normal',    label: '正常' },
  { id: 'pollution', label: '高空汙' },
  { id: 'storm',     label: '大雨曝曬' },
];

// 跑點類型的中文顯示
const SPOT_TYPE_LABEL = { riverside: '河濱', park: '公園' };

// 狀態外觀（色彩＋圖示＋繁體文字三者同時出現）；判定邏輯於第 3 階段實作
const STATUS_META = {
  green:   { cls: 'st-green',   icon: 'i-check-circle',   label: '適合出發' },
  yellow:  { cls: 'st-yellow',  icon: 'i-alert-triangle', label: '建議留意' },
  red:     { cls: 'st-red',     icon: 'i-x-circle',       label: '不建議前往' },
  unknown: { cls: 'st-unknown', icon: 'i-help-circle',    label: '資料不足' },
};

/* =====================================================================
   §1-2 資料：Mock 測站與情境（離線 / 展示模式使用）
   ---------------------------------------------------------------------
   - MOCK_STATIONS：分布於台北 12 區的 24 個模擬測站，pm 為「正常」情境的 PM2.5，
     西側（萬華、中正）略高，讓熱力圖有空間變化。
   - MOCK_SCENARIOS：

/* =====================================================================
   §2 工具函式
   ===================================================================== */

/** Haversine 公式：計算兩點球面直線距離（公尺） */
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371008.8; // 地球平均半徑（公尺）
  const toRad = (d) => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(a)));
}

/** 距離顯示：一律以公里、一位小數（例：1.2 公里） */
function formatKm(meters) {
  return (meters / 1000).toFixed(1) + ' 公里';
}

/** 判斷座標是否在台北市範圍框內 */
function inBBox(lat, lng, bbox = CONFIG.BBOX) {
  return lat >= bbox.minLat && lat <= bbox.maxLat && lng >= bbox.minLng && lng <= bbox.maxLng;
}

/** 產生圖示 SVG 字串（引用上方內嵌 symbol） */
function iconSvg(id, extraClass = '') {
  return `<svg class="icon ${extraClass}" aria-hidden="true"><use href="#${id}"/></svg>`;
}

/** HTML 跳脫，避免資料內容被當成標記解析 */
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/** 轉為有限數值，否則回傳 null（防呆：字串 'N/A'、null、NaN 皆視為缺值） */
function toNum(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = typeof v === 'number' ? v : Number(v);
  return Number.isFinite(n) ? n : null;
}

/** 四捨五入至指定小數位 */
function round(v, digits = 1) {
  const k = 10 ** digits;
  return Math.round(v * k) / k;
}

/** 以台北時間格式化日期（不受裝置時區影響） */
function formatTaipei(date, { withDate = false } = {}) {
  const opts = { timeZone: 'Asia/Taipei', hour: '2-digit', minute: '2-digit', hour12: false };
  if (withDate) Object.assign(opts, { year: 'numeric', month: '2-digit', day: '2-digit' });
  return new Intl.DateTimeFormat('zh-TW', opts).format(date);
}

/**
 * 取得台北時間「當下整點」的鍵值，格式與 Open-Meteo（timezone=Asia/Taipei）的 hourly.time 相同：
 * 例如 "2026-11-22T18:00"。以 UTC+8 換算，不依賴裝置時區。
 */
function currentTaipeiHourKey(now = new Date()) {
  const t = new Date(now.getTime() + CONFIG.TAIPEI_UTC_OFFSET_H * 3600e3);
  return t.toISOString().slice(0, 13) + ':00';
}

/** 小提示：顯示數秒後自動消失 */
let toastTimer = null;
function showToast(msg, ms = 3500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

   §3 資料串接：PM2.5（可抽換來源）、Open-Meteo 氣象、Mock 與自動降級

/** 資料取得失敗的錯誤（code 用於產生白話原因） */
class DataError extends Error {
  constructor(code, detail = '') { super(detail || code); this.code = code; this.detail = detail; }
}

/** 將失敗原因轉成介面上的白話說明 */
function describeFailure(sourceName, err) {
  switch (err && err.code) {
    case 'timeout': return `${sourceName}回應逾時（超過 ${CONFIG.FETCH_TIMEOUT_MS / 1000} 秒）`;
    case 'network': return `無法連線至${sourceName}（跨網域限制或網路離線）`;
    case 'http':    return `${sourceName}回應錯誤（${err.detail}）`;
    case 'parse':   return `${sourceName}資料格式無法解析`;
    case 'stale':   return `即時資料來源暫停更新（${sourceName}最新資料為 ${err.detail}）`;
    case 'few':     return `${sourceName}在台北市範圍內的有效測站不足 ${CONFIG.MIN_VALID_STATIONS} 站`;
    case 'none':    return '沒有啟用中的 PM2.5 資料來源';
    default:        return `${sourceName}發生未預期錯誤`;
  }
}

/**
 * fetch 加上逾時（AbortController），並把各種失敗統一轉成 DataError。
 *
 * 【已知 Console 錯誤（僅「即時資料」模式）】
 * 以下兩則紅字由瀏覽器網路層直接輸出，JavaScript 無法攔截或隱藏；程式已正確降級，不影響操作：
 * 1. LASS：「Access to fetch at 'https://pm25.lass-net.org/...' has been blocked by CORS policy」
 *    與「net::ERR_FAILED」— LASS 回應未帶 Access-Control-Allow-Origin 標頭，瀏覽器拒絕讓網頁讀取。
 * 2. Open-Meteo：「429 (Too Many Requests)」— 同一對外 IP 請求過多時的限流（雲端 / 共用網路較常見）。
 * 三種 Mock 情境（正常 / 高空汙 / 大雨曝曬）不發出任何網路請求，Console 應為零錯誤、零警告。
 */
async function fetchJson(url, ms = CONFIG.FETCH_TIMEOUT_MS) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try {
    const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
    if (!res.ok) throw new DataError('http', `HTTP ${res.status}`);
    try { return await res.json(); } catch (e) { throw new DataError('parse'); }
  } catch (e) {
    if (e instanceof DataError) throw e;
    if (e && e.name === 'AbortError') throw new DataError('timeout');
    throw new DataError('network', e && e.message); // CORS 被擋、離線、DNS 失敗皆為 TypeError
  } finally {
    clearTimeout(timer);
  }
}

/* ---------------------------------------------------------------------
   PM2.5 adapter：LASS 空氣盒子 last-all-airbox.json
   ---------------------------------------------------------------------
   【2026-11-22 實測摘要】（tools/pm25_summary.py）
   - 結構：{ source, num_of_records, version, descriptions, feeds: [...] }，全台 462 站。
   - PM2.5：feeds[].s_d0（float，μg/m³，原始感測值）。另有 c_d0 為校正值，但台北測站多為字串 'N/A'，故不採用。
   - 經緯度：feeds[].gps_lat / gps_lon（float）；範圍含台灣以外（lat 14～25、lon 100～121），需以範圍框篩選。
   - 時間：feeds[].timestamp，ISO 8601「UTC」（結尾 Z），例："2026-09-01T16:08:23Z"；
           另有 date（"2026-09-01"）＋ time（"16:07:38"）亦為 UTC，作為備援。
   - 識別：device_id；名稱：SiteName（備援 name）。
   - 實測時資料停在 2026-09-01（Last-Modified 同日），且回應無 Access-Control-Allow-Origin，
     瀏覽器無法讀取 → 會自動降級為 Mock。台北範圍框內 92 站中有 64 站 s_d0 = 0（疑似感測異常，
     會把 IDW 結果嚴重拉低），因此清洗規則為「PM2.5 ≤ 0 或 > 500 皆排除」。
   - 防呆：欄位缺漏 / 非數值 → 該站略過；timestamp 無法解析時改用 date＋time；同 device_id 只取最新一筆。
   --------------------------------------------------------------------- */
function lassAdapter(json) {
  if (!json || !Array.isArray(json.feeds)) throw new DataError('parse');
  const byId = new Map();
  for (const f of json.feeds) {
    if (!f || typeof f !== 'object') continue;
    const lat = toNum(f.gps_lat), lng = toNum(f.gps_lon), pm25 = toNum(f.s_d0);
    if (lat === null || lng === null || pm25 === null) continue;
    let time = typeof f.timestamp === 'string' ? new Date(f.timestamp) : null;
    if (!time || isNaN(time)) {
      time = (f.date && f.time) ? new Date(`${f.date}T${f.time}Z`) : null; // date＋time 為 UTC
    }
    if (!time || isNaN(time)) continue;
    const id = String(f.device_id || `${lat},${lng}`);
    const prev = byId.get(id);
    if (prev && prev.time >= time) continue;
    byId.set(id, { id, name: String(f.SiteName || f.name || id), lat, lng, pm25, time });
  }
  return [...byId.values()];
}

   PM2.5 adapter：民生公共物聯網 SensorThings API（STA）— 預留，尚未實作

   - 啟用方式：完成實作與實測後，將 PM25_SOURCES 中 sta 的 enabled 設為 true（可調整順序作為主來源）。
   --------------------------------------------------------------------- */
function staAdapter(json) { // eslint-disable-line no-unused-vars

}

/**
 * 共用清洗：台北範圍框 → PM2.5 有效範圍（> 0 且 ≤ 500；≤ 0 或 > 500 排除）→ 時效（≤ 60 分鐘）。
 * 回傳 { valid, stats }，stats 供判斷失敗原因（例如全部過期 → 來源暫停更新）。
 */
function cleanStations(stations, now = new Date()) {
  const stats = { total: stations.length, inBBox: 0, badValue: 0, stale: 0, latest: null };
  const maxAgeMs = CONFIG.STATION_MAX_AGE_MIN * 60e3;
  const valid = [];
  for (const st of stations) {
    if (!inBBox(st.lat, st.lng)) continue;
    stats.inBBox++;
    if (!stats.latest || st.time > stats.latest) stats.latest = st.time;
    if (st.pm25 <= CONFIG.PM25_MIN || st.pm25 > CONFIG.PM25_MAX) { stats.badValue++; continue; }
    if (now - st.time > maxAgeMs) { stats.stale++; continue; }
    valid.push(st);
  }
  return { valid, stats };
}

/** 依序嘗試啟用中的 PM2.5 來源；全部失敗時拋出含白話原因的 DataError */
async function loadPm25Live() {
  const reasons = [];
  for (const src of PM25_SOURCES.filter((s) => s.enabled)) {
    try {
      const json = await fetchJson(src.url);
      const { valid, stats } = cleanStations(src.adapter(json));
      if (valid.length >= CONFIG.MIN_VALID_STATIONS) {
        return { mode: 'live', sourceName: src.name, stations: valid, stats };
      }
      // 範圍內有測站但全部過期 → 視為來源暫停更新
      const err = (stats.inBBox > 0 && stats.stale + stats.badValue === stats.inBBox && stats.stale > 0)
        ? new DataError('stale', formatTaipei(stats.latest, { withDate: true }))
        : new DataError('few');
      reasons.push(describeFailure(src.name, err));
    } catch (e) {
      reasons.push(describeFailure(src.name, e));
    }
  }
  const err = new DataError('none');
  err.reasons = reasons.length ? reasons : [describeFailure('', err)];
  throw err;
}

/**
 * Open-Meteo：所有跑點（＋使用者位置）座標以逗號串接，一次請求取回。
 * points: [{ key, lat, lng }] → 回傳 { key: { rain, uvi, feels } }，缺值為 null。
 * 取「台北時間當下整點」那一筆作為現況值。
 */
async function loadWeatherLive(points) {
  const params = new URLSearchParams({
    latitude: points.map((p) => p.lat.toFixed(4)).join(','),
    longitude: points.map((p) => p.lng.toFixed(4)).join(','),
    hourly: 'apparent_temperature,precipitation_probability,uv_index',
    timezone: 'Asia/Taipei',
    forecast_days: '1',
  });
  const json = await fetchJson(`${CONFIG.OPEN_METEO_URL}?${params}`);
  const list = Array.isArray(json) ? json : [json]; // 單一座標時回傳物件，多座標時回傳陣列
  if (list.length !== points.length) throw new DataError('parse');
  const hourKey = currentTaipeiHourKey();
  const byKey = {};
  points.forEach((p, i) => {
    const h = list[i] && list[i].hourly;
    const idx = h && Array.isArray(h.time) ? h.time.indexOf(hourKey) : -1;
    const pick = (arr) => (idx >= 0 && Array.isArray(arr) ? toNum(arr[idx]) : null);
    byKey[p.key] = {
      rain: pick(h && h.precipitation_probability),
      uvi: pick(h && h.uv_index),
      feels: pick(h && h.apparent_temperature),
    };
  });
  return { mode: 'live', sourceName: 'Open-Meteo', byKey, hourKey };
}

/** 產生 Mock 測站：背景測站＋跑點錨點測站（時間戳記為最近 15 分鐘內） */
function buildMockStations(scenarioId, now = new Date()) {
  const sc = MOCK_SCENARIOS[scenarioId];
  const stations = MOCK_STATIONS.map((st, i) => ({
    id: st.id, name: `${st.name}（模擬）`, lat: st.lat, lng: st.lng,
    pm25: sc.stationPm(st), time: new Date(now - ((i * 7) % 15) * 60e3),
  }));
  for (const spot of RUN_SPOTS) {
    const ov = sc.spots[spot.id];
    if (ov && ov.pm25 !== undefined) {
      stations.push({ id: `anchor-${spot.id}`, name: `${spot.name}旁（模擬）`,
                      lat: spot.lat + 0.0001, lng: spot.lng, pm25: ov.pm25, time: new Date(now) });
    }
  }
  return stations;
}

/** 產生 Mock 氣象：跑點＝情境基準值＋覆寫；其他座標（如使用者位置）採最近跑點的值 */
function buildMockWeather(scenarioId, points) {
  const sc = MOCK_SCENARIOS[scenarioId];
  const spotWx = (spot) => {
    const ov = sc.spots[spot.id] || {};
    return {
      rain: ov.rain !== undefined ? ov.rain : sc.weather.rain,
      uvi: ov.uvi !== undefined ? ov.uvi : sc.weather.uvi,
      feels: ov.feels !== undefined ? ov.feels : sc.weather.feels,
    };
  };
  const byKey = {};
  for (const p of points) {
    const spot = p.spotId !== undefined ? RUN_SPOTS.find((s) => s.id === p.spotId) : nearestSpot(p.lat, p.lng);
    byKey[p.key] = spotWx(spot);
  }
  return byKey;
}

/** 找出離指定座標最近的跑點 */
function nearestSpot(lat, lng) {
  let best = null, bestD = Infinity;
  for (const s of RUN_SPOTS) {
    const d = haversine(lat, lng, s.lat, s.lng);
    if (d < bestD) { best = s; bestD = d; }
  }
  return best;
}

/** 氣象查詢點：所有跑點＋（若已定位）使用者位置 */
function weatherPoints() {
  const pts = RUN_SPOTS.map((s) => ({ key: `spot-${s.id}`, spotId: s.id, lat: s.lat, lng: s.lng }));
  if (state.userPos) pts.push({ key: 'user', lat: state.userPos.lat, lng: state.userPos.lng });
  return pts;
}

/**
 * 載入資料（依資料模式）並計算各跑點 / 使用者位置的四項指標。
 * - 即時資料：PM2.5 與氣象「各自」嘗試即時來源，失敗者個別降級為「正常」Mock。
 * - 情境模式：兩者皆使用對應 Mock。
 */
let refreshSeq = 0;
async function refreshData() {
  const seq = ++refreshSeq;
  const mode = state.dataMode;
  const points = weatherPoints();
  let pm, wx;

  if (mode === 'live') {
    const [pmRes, wxRes] = await Promise.allSettled([loadPm25Live(), loadWeatherLive(points)]);
    pm = pmRes.status === 'fulfilled' ? pmRes.value
       : { mode: 'mock', sourceName: 'Mock', stations: buildMockStations('normal'), reasons: pmRes.reason.reasons || [describeFailure('PM2.5 資料來源', pmRes.reason)] };
    wx = wxRes.status === 'fulfilled' ? wxRes.value
       : { mode: 'mock', sourceName: 'Mock', byKey: buildMockWeather('normal', points), reasons: [describeFailure('Open-Meteo 氣象資料', wxRes.reason)] };
  } else {
    const reason = `目前為情境測試「${MOCK_SCENARIOS[mode].label}」，顯示模擬數據`;
    pm = { mode: 'mock', sourceName: 'Mock', stations: buildMockStations(mode), reasons: [reason] };
    wx = { mode: 'mock', sourceName: 'Mock', byKey: buildMockWeather(mode, points), reasons: [] };
  }
  if (seq !== refreshSeq) return; // 已有較新的請求（例如快速切換模式），捨棄舊結果

  state.data = { mode, pm, wx, updatedAt: new Date() };
  computeReadings();
  render();
}

/** 由測站與氣象計算每個跑點（及使用者位置）的四項指標 */
function computeReadings() {
  const { pm, wx } = state.data;
  const readingAt = (lat, lng, key) => {
    const w = wx.byKey[key] || {};
    const est = idwEstimate(lat, lng, pm.stations);
    return { pm25: est ? est.value : null, pmEstimate: est,
             rain: toNum(w.rain), uvi: toNum(w.uvi), feels: toNum(w.feels) };
  };
  state.readings = {};
  for (const s of RUN_SPOTS) state.readings[s.id] = readingAt(s.lat, s.lng, `spot-${s.id}`);
  state.userReading = state.userPos ? readingAt(state.userPos.lat, state.userPos.lng, 'user') : null;
  computeEvaluations();
}

/** 資料來源狀態（供介面標記與原因說明） */
function getSourceStatus() {
  const d = state.data;
  if (!d) return { kind: 'loading', label: '載入中…', reasons: ['正在取得資料'] };
  if (d.mode !== 'live') return { kind: 'offline', label: '離線 / 展示模式', reasons: d.pm.reasons };
  const reasons = [];
  reasons.push(d.pm.mode === 'live'
    ? `PM2.5：即時資料（${d.pm.sourceName}，${d.pm.stations.length} 站）`
    : `PM2.5：${d.pm.reasons.join('；')}，目前為展示數據`);
  reasons.push(d.wx.mode === 'live'
    ? `氣象：即時資料（Open-Meteo，${d.wx.hourKey.slice(11)} 整點預報）`
    : `氣象：${d.wx.reasons.join('；')}，目前為展示數據`);
  const liveCount = (d.pm.mode === 'live') + (d.wx.mode === 'live');
  if (liveCount === 2) return { kind: 'live', label: '即時資料', reasons };
  return { kind: 'offline', label: liveCount === 0 ? '離線 / 展示模式' : '部分離線 / 展示模式', reasons };
}

/* =====================================================================
   §4 演算法：IDW 反距離加權（網格熱力圖於第 4 階段加入）
   ===================================================================== */

/**
 * IDW 估算指定座標的 PM2.5。
 * - 與某測站距離 < snapM（50 m）：直接採用該測站數值。
 * - 依序在 radiiM（3 km → 5 km）內找測站，權重 w = 1 / d^p（p = 2）做加權平均。
 * - 都沒有測站：若 cityAvg 為 true，採用台北市全部有效測站平均；否則回傳 null（熱力圖留白用）。
 * 回傳 { value, method: 'snap' | 'idw' | 'cityAvg', radiusM, n } 或 null。
 */
function idwEstimate(lat, lng, stations, {
  power = CONFIG.IDW.power, snapM = CONFIG.IDW.snapM, radiiM = CONFIG.IDW.radiiM, cityAvg = true,
} = {}) {
  if (!stations || stations.length === 0) return null;
  const withD = stations.map((st) => ({ st, d: haversine(lat, lng, st.lat, st.lng) }));
  let nearest = withD[0];
  for (const x of withD) if (x.d < nearest.d) nearest = x;
  if (nearest.d < snapM) return { value: round(nearest.st.pm25), method: 'snap', radiusM: 0, n: 1 };

  for (const r of radiiM) {
    let sw = 0, swv = 0, n = 0;
    for (const { st, d } of withD) {
      if (d > r) continue;
      const w = 1 / d ** power;
      sw += w; swv += w * st.pm25; n++;
    }
    if (n > 0) return { value: round(swv / sw), method: 'idw', radiusM: r, n };
  }
  if (!cityAvg) return null;
  // TODO（第 4 階段）：改為只採台北市外框多邊形內的測站
  const inCity = stations.filter((st) => inBBox(st.lat, st.lng));
  if (inCity.length === 0) return null;
  const avg = inCity.reduce((a, st) => a + st.pm25, 0) / inCity.length;
  return { value: round(avg), method: 'cityAvg', radiusM: null, n: inCity.length };
}

/* =====================================================================
   §5 判定：三級門檻（連續區間，最高風險一票否決）
   ===================================================================== */

// 燈號嚴重度：數字越大越嚴重（'unknown' 不參與比較）
const LEVEL_RANK = { green: 0, yellow: 1, red: 2 };

// 指標定義；陣列順序即「同燈號時的主因優先順序」：PM2.5 > 降雨 > 紫外線 > 體感溫度
const INDICATORS = [
  { key: 'pm25',  label: 'PM2.5',    unit: 'μg/m³', digits: 1 },
  { key: 'rain',  label: '降雨機率', unit: '%',     digits: 0 },
  { key: 'uvi',   label: '紫外線',   unit: 'UVI',   digits: 1 },
  { key: 'feels', label: '體感溫度', unit: '°C',    digits: 1 },
];

/**
 * 單項指標分級（純函式）。門檻：
 *   PM2.5：≤ 15.4 綠｜> 15.4 且 < 35.5 黃｜≥ 35.5 紅
 *   降雨  ：≤ 30 綠  ｜> 30 且 ≤ 60 黃    ｜> 60 紅
 *   UVI   ：≤ 5.0 綠 ｜> 5.0 且 < 8.0 黃  ｜≥ 8.0 紅
 *   體感  ：10.0～30.0 綠｜5.0～< 10.0 或 > 30.0～33.0 黃｜< 5.0 或 > 33.0 紅
 * 回傳 'green' | 'yellow' | 'red'；數值缺失回傳 null。
 */
function classifyIndicator(key, v) {
  if (v === null || v === undefined || !Number.isFinite(v)) return null;
  switch (key) {
    case 'pm25':  return v <= 15.4 ? 'green' : v < 35.5 ? 'yellow' : 'red';
    case 'rain':  return v <= 30 ? 'green' : v <= 60 ? 'yellow' : 'red';
    case 'uvi':   return v <= 5.0 ? 'green' : v < 8.0 ? 'yellow' : 'red';
    case 'feels':
      if (v >= 10.0 && v <= 30.0) return 'green';
      if ((v >= 5.0 && v < 10.0) || (v > 30.0 && v <= 33.0)) return 'yellow';
      return 'red';
    default: return null;
  }
}

/**
 * 總體判定（純函式，方便測試）。
 * 輸入：{ pm25, rain, uvi, feels }（缺值為 null / undefined）
 * 輸出：{
 *   status:  'green' | 'yellow' | 'red' | 'unknown'（四項皆缺 → 資料不足）,
 *   levels:  { pm25, rain, uvi, feels }（各單項燈號，缺值為 null）,
 *   primary: { key, level, direction } | null（造成最高風險的指標；全綠或資料不足時為 null；
 *            direction 僅體感溫度使用：'hot' / 'cold'）,
 *   missing: 缺值指標 key 陣列, partial: 是否「部分資料暫缺」
 * }
 * 規則：任一紅 → 紅；無紅但任一黃 → 黃；有效項皆綠 → 綠；缺值不參與判定。
 */
function evaluate(values) {
  const levels = {}, missing = [];
  let primary = null;
  for (const ind of INDICATORS) {
    const v = values ? values[ind.key] : undefined;
    const lv = classifyIndicator(ind.key, v);
    levels[ind.key] = lv;
    if (lv === null) { missing.push(ind.key); continue; }
    // 嚴格大於：同燈號時保留陣列中較前面（優先順序較高）的指標
    if (lv !== 'green' && (!primary || LEVEL_RANK[lv] > LEVEL_RANK[primary.level])) {
      primary = { key: ind.key, level: lv, direction: ind.key === 'feels' ? (v > 30 ? 'hot' : 'cold') : null };
    }
  }
  const status = missing.length === INDICATORS.length ? 'unknown' : primary ? primary.level : 'green';
  return { status, levels, primary, missing, partial: missing.length > 0 && status !== 'unknown' };
}

/** 依主因產生一句白話行動建議 */
const ADVICE = {
  pm25:  { yellow: 'PM2.5 略高，敏感族群建議降低強度或縮短時間', red: 'PM2.5 偏高，建議改至室內運動或換個跑點' },
  rain:  { yellow: '降雨機率偏高，建議攜帶輕便雨具或縮短路線',   red: '降雨機率高，建議改期或改至室內運動' },
  uvi:   { yellow: '紫外線偏強，建議做好防曬或改在傍晚出發',     red: '紫外線過量，建議改在傍晚或清晨出發' },
  feels_hot:  { yellow: '體感偏熱，建議放慢配速並多補充水分',   red: '體感炎熱、有中暑風險，建議改在清晨或傍晚' },
  feels_cold: { yellow: '體感偏涼，建議充分暖身並加件薄外套',   red: '體感寒冷，建議做好保暖或改至室內運動' },
};
function adviceFor(ev) {
  if (!ev || ev.status === 'unknown') return '資料暫缺，暫時無法判斷是否適合出發';
  if (!ev.primary) return '各項指標良好，適合出發';
  const k = ev.primary.key === 'feels' ? `feels_${ev.primary.direction}` : ev.primary.key;
  return ADVICE[k][ev.primary.level];
}

/** 依目前讀值計算所有跑點與使用者位置的判定結果 */
function computeEvaluations() {
  state.evaluations = {};
  for (const s of RUN_SPOTS) {
    if (state.readings[s.id]) state.evaluations[s.id] = evaluate(state.readings[s.id]);
  }
  state.userEvaluation = state.userReading ? evaluate(state.userReading) : null;
}

/**
 * 可在 Console 執行的簡易測試：SafeAir.runTests()
 * 涵蓋各門檻邊界值、總體判定、缺值處理、主因優先順序，以及狀態文字色對比度（WCAG AA ≥ 4.5:1）。
 * 回傳 { passed, failed }，失敗項目以 console.table 列出。
 */
function runTests() {
  const cases = [];
  const t = (name, actual, expected) => cases.push({ name, expected, actual, ok: actual === expected });
  const L = classifyIndicator;
  // PM2.5：15.4 / 15.5 / 35.4 / 35.5
  [[15.4, 'green'], [15.5, 'yellow'], [35.4, 'yellow'], [35.5, 'red'], [0.1, 'green'], [500, 'red']]
    .forEach(([v, e]) => t(`PM2.5 ${v}`, L('pm25', v), e));
  // 降雨：30 / 31 / 60 / 61
  [[0, 'green'], [30, 'green'], [31, 'yellow'], [60, 'yellow'], [61, 'red'], [100, 'red']]
    .forEach(([v, e]) => t(`降雨 ${v}%`, L('rain', v), e));
  // UVI：5.0 / 8.0
  [[5.0, 'green'], [5.1, 'yellow'], [7.9, 'yellow'], [8.0, 'red']]
    .forEach(([v, e]) => t(`UVI ${v}`, L('uvi', v), e));
  // 體感：5 / 10 / 30 / 33
  [[4.9, 'red'], [5, 'yellow'], [9.9, 'yellow'], [10, 'green'], [30, 'green'], [30.1, 'yellow'], [33, 'yellow'], [33.1, 'red'], [-3, 'red']]
    .forEach(([v, e]) => t(`體感 ${v}°C`, L('feels', v), e));
  // 總體判定與主因
  const ok = { pm25: 10, rain: 10, uvi: 3, feels: 24 };
  t('四項皆綠 → 綠', evaluate(ok).status, 'green');
  t('全綠無主因', evaluate(ok).primary, null);
  t('一黃 → 黃', evaluate({ ...ok, uvi: 6.5 }).status, 'yellow');
  t('一紅一黃 → 紅', evaluate({ ...ok, uvi: 6.5, rain: 80 }).status, 'red');
  t('一紅一黃主因為紅者', evaluate({ ...ok, uvi: 6.5, rain: 80 }).primary.key, 'rain');
  t('同為紅燈依優先順序（PM2.5 > UVI）', evaluate({ ...ok, uvi: 9, pm25: 40 }).primary.key, 'pm25');
  t('同為黃燈依優先順序（降雨 > 體感）', evaluate({ ...ok, feels: 31, rain: 40 }).primary.key, 'rain');
  t('體感過熱方向', evaluate({ ...ok, feels: 34 }).primary.direction, 'hot');
  t('體感過冷方向', evaluate({ ...ok, feels: 4 }).primary.direction, 'cold');
  t('缺一項不參與判定', evaluate({ ...ok, pm25: null }).status, 'green');
  t('缺一項標示部分暫缺', evaluate({ ...ok, pm25: null }).partial, true);
  t('缺值時其餘紅燈仍生效', evaluate({ pm25: undefined, rain: 70 }).status, 'red');
  t('四項皆缺 → 資料不足', evaluate({}).status, 'unknown');
  t('資料不足不標部分暫缺', evaluate({}).partial, false);
  t('NaN 視為缺值', evaluate({ ...ok, uvi: NaN }).levels.uvi, null);
  t('建議文案（紫外線黃）', adviceFor(evaluate({ ...ok, uvi: 6 })), ADVICE.uvi.yellow);
  // WCAG AA：狀態文字色與次要文字在白底 ≥ 4.5:1
  const css = getComputedStyle(document.documentElement);
  for (const v of ['--green-text', '--yellow-text', '--red-text', '--gray-text', '--text-2']) {
    const ratio = contrastRatio(css.getPropertyValue(v).trim(), '#FFFFFF');
    cases.push({ name: `對比度 ${v}`, expected: '≥ 4.5', actual: ratio.toFixed(2), ok: ratio >= 4.5 });
  }
  const failed = cases.filter((c) => !c.ok);
  console.log(`SafeAir 判定測試：${cases.length - failed.length} / ${cases.length} 通過`);
  if (failed.length) console.table(failed);
  return { passed: cases.length - failed.length, failed: failed.length };
}

/** WCAG 2 對比度（輸入 #RRGGBB） */
function contrastRatio(hex1, hex2) {
  const lum = (hex) => {
    const [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  };
  const [a, b] = [lum(hex1), lum(hex2)].sort((x, y) => y - x);
  return (a + 0.05) / (b + 0.05);
}

/** 取得跑點目前燈號；尚未載入資料時回傳「資料不足」 */
function getSpotStatus(spotId) {
  const ev = state.evaluations[spotId];
  return ev ? ev.status : 'unknown';
}

/* =====================================================================
   §6 推薦（第 6 階段實作：換點推薦）
   ===================================================================== */

/* =====================================================================
   §7 地圖
   ===================================================================== */
let map = null;
let labelLayer = null;
const spotMarkers = new Map(); // spotId → L.Marker
let userMarker = null;

/** 初始化地圖、底圖與標籤圖層 */
function initMap() {
  map = L.map('map', {
    center: CONFIG.DEFAULT_CENTER,
    zoom: CONFIG.DEFAULT_ZOOM,
    zoomControl: false,
    attributionControl: true,
  });
  // 右下角：先加「回到我的位置」再加縮放鈕（Leaflet 底部角落由下往上堆疊，定位鈕會在最下方、拇指最易點）
  addLocateControl();
  L.control.zoom({ position: 'bottomright', zoomInTitle: '放大', zoomOutTitle: '縮小' }).addTo(map);

  // 主圖層：CARTO 淺色無標籤
  L.tileLayer(CONFIG.TILE_BASE, {
    subdomains: 'abcd', maxZoom: 19, attribution: CONFIG.ATTRIBUTION, key: CONFIG.CARTO_API_KEY,
  }).addTo(map);

  // 純標籤圖層放在獨立 pane：高於熱力圖、低於跑點標記，且不攔截點擊
  map.createPane('labels');
  map.getPane('labels').style.zIndex = 450;
  map.getPane('labels').style.pointerEvents = 'none';
  labelLayer = L.tileLayer(CONFIG.TILE_LABELS, { subdomains: 'abcd', maxZoom: 19, pane: 'labels', key: CONFIG.CARTO_API_KEY });

  map.on('zoomend', updateLabelLayer);
  updateLabelLayer();
}

/** 縮放 ≥ 14 時顯示標籤圖層，否則移除 */
function updateLabelLayer() {
  const show = map.getZoom() >= CONFIG.LABEL_MIN_ZOOM;
  if (show && !map.hasLayer(labelLayer)) labelLayer.addTo(map);
  if (!show && map.hasLayer(labelLayer)) map.removeLayer(labelLayer);
}

/** 依狀態產生跑點標記圖示（狀態色圓形＋白色狀態圖示） */
function spotIcon(status, selected) {
  const meta = STATUS_META[status];
  return L.divIcon({
    className: `spot-marker ${meta.cls}${selected ? ' is-selected' : ''}`,
    html: `<div class="pin">${iconSvg(meta.icon)}</div>`,
    iconSize: [32, 32],
    iconAnchor: [16, 16],
  });
}

/** 依 RUN_SPOTS 建立 / 更新所有跑點標記 */
function renderMarkers() {
  for (const spot of RUN_SPOTS) {
    const status = getSpotStatus(spot.id);
    const selected = state.selectedId === spot.id;
    let marker = spotMarkers.get(spot.id);
    if (!marker) {
      marker = L.marker([spot.lat, spot.lng], {
        title: spot.name, alt: spot.name, keyboard: true, riseOnHover: true,
      }).addTo(map);
      marker.on('click', () => selectSpot(spot.id));
      marker.bindTooltip(spot.name, { direction: 'top', offset: [0, -18] });
      spotMarkers.set(spot.id, marker);
    }
    marker.setIcon(spotIcon(status, selected));
    marker.setTooltipContent(spotTooltipHtml(spot));
    marker.setZIndexOffset(selected ? 1000 : 0);
    // 標記的無障礙名稱同時包含狀態文字
    const el = marker.getElement();
    if (el) el.setAttribute('aria-label', `${spot.name}，${STATUS_META[status].label}`);
  }
}

/** 標記提示：名稱＋四項數值（資訊卡於第 5 階段加入） */
function spotTooltipHtml(spot) {
  const r = state.readings[spot.id];
  if (!r) return escapeHtml(spot.name);
  const ev = state.evaluations[spot.id];
  const meta = STATUS_META[ev ? ev.status : 'unknown'];
  return `<strong>${escapeHtml(spot.name)}</strong>｜<span class="${meta.cls}" style="color:var(--st-text);font-weight:600">${meta.label}</span>`
    + `<br>${escapeHtml(adviceFor(ev))}`
    + `<br><span class="num">PM2.5 ${fmtVal(r.pm25, 1)}・降雨 ${fmtVal(r.rain, 0, '%')}・UVI ${fmtVal(r.uvi, 1)}・體感 ${fmtVal(r.feels, 1, '°C')}</span>`
    + (ev && ev.partial ? '<br>部分資料暫缺' : '');
}

/** 數值顯示：缺值顯示「—」 */
function fmtVal(v, digits = 1, unit = '') {
  return v === null || v === undefined ? '—' : v.toFixed(digits) + unit;
}

/** 更新使用者位置標記（藍點＋脈動外圈） */
function renderUserMarker() {
  if (!state.userPos) return;
  const latlng = [state.userPos.lat, state.userPos.lng];
  if (!userMarker) {
    userMarker = L.marker(latlng, {
      icon: L.divIcon({ className: 'user-marker', html: '<span class="pulse"></span><span class="dot"></span>', iconSize: [16, 16] }),
      keyboard: false, interactive: false, zIndexOffset: -100,
    }).addTo(map);
  } else {
    userMarker.setLatLng(latlng);
  }
}

/** 右下角「回到我的位置」按鈕 */
function addLocateControl() {
  const Locate = L.Control.extend({
    options: { position: 'bottomright' },
    onAdd() {
      const btn = L.DomUtil.create('button', 'leaflet-control map-btn');
      btn.type = 'button';
      btn.title = '回到我的位置';
      btn.setAttribute('aria-label', '回到我的位置');
      btn.innerHTML = iconSvg('i-locate');
      L.DomEvent.disableClickPropagation(btn);
      L.DomEvent.on(btn, 'click', () => {
        if (state.userPos) {
          map.flyTo([state.userPos.lat, state.userPos.lng], Math.max(map.getZoom(), CONFIG.LOCATED_ZOOM));
        } else {
          locateUser({ recenter: true });
        }
      });
      return btn;
    },
  });
  new Locate().addTo(map);
}

/* =====================================================================
   §8 UI：狀態管理與畫面渲染
   ===================================================================== */
const state = {
  selectedId: null,     // 目前選取的跑點 id
  userPos: null,        // { lat, lng, accuracy }；未取得定位時為 null
  evaluations: {},      // spotId → evaluate() 判定結果
  userEvaluation: null, // 使用者目前位置的判定結果
  dataMode: 'live',     // 'live' | 'normal' | 'pollution' | 'storm'
  data: null,           // { mode, pm, wx, updatedAt }：最近一次載入的原始資料
  readings: {},         // spotId → { pm25, pmEstimate, rain, uvi, feels }
  userReading: null,    // 使用者目前位置的四項指標
};

/**
 * 跑點列表排序：先依燈號（綠 → 黃 → 紅 → 資料不足），
 * 同燈號再依與使用者的直線距離由近到遠；未取得定位時改依跑點名稱。
 */
const STATUS_ORDER = { green: 0, yellow: 1, red: 2, unknown: 3 };
function sortedSpots() {
  const pos = state.userPos;
  const tie = pos
    ? (a, b) => haversine(pos.lat, pos.lng, a.lat, a.lng) - haversine(pos.lat, pos.lng, b.lat, b.lng)
    : (a, b) => a.name.localeCompare(b.name, 'zh-Hant');
  return RUN_SPOTS.slice().sort((a, b) =>
    (STATUS_ORDER[getSpotStatus(a.id)] - STATUS_ORDER[getSpotStatus(b.id)]) || tie(a, b));
}

/** 渲染側邊欄跑點列表 */
function renderList() {
  const ul = document.getElementById('spotList');
  ul.innerHTML = sortedSpots().map((spot) => {
    const status = getSpotStatus(spot.id);
    const meta = STATUS_META[status];
    const dist = state.userPos
      ? `<span class="dist num">${formatKm(haversine(state.userPos.lat, state.userPos.lng, spot.lat, spot.lng))}</span>`
      : '';
    return `<li><button type="button" class="spot-item" data-id="${spot.id}"
                aria-current="${state.selectedId === spot.id}">
      <span class="status-dot ${meta.cls}" title="${meta.label}">${iconSvg(meta.icon)}</span>
      <span class="meta">
        <span class="name">${escapeHtml(spot.name)}</span>
        <span class="sub">${escapeHtml(spot.district)}・${SPOT_TYPE_LABEL[spot.type] || ''}・<span style="color:var(--st-text)" class="${meta.cls}">${meta.label}</span></span>
      </span>${dist}</button></li>`;
  }).join('');
}

/** 資料來源標記（側邊欄底部與窄螢幕頂部各一個）與更新時間 */
function renderSourceStatus() {
  const st = getSourceStatus();
  const cls = st.kind === 'live' ? 'is-live' : st.kind === 'loading' ? 'is-loading' : 'is-offline';
  const icon = st.kind === 'live' ? 'i-check-circle' : 'i-info';
  document.querySelectorAll('[data-src]').forEach((wrap) => {
    const popId = `srcPop-${wrap.dataset.src}`;
    const open = wrap.classList.contains('open');
    wrap.innerHTML = `<button type="button" class="src-badge ${cls}" aria-expanded="${open}" aria-describedby="${popId}"
        aria-label="資料來源：${st.label}（點擊查看原因）">${iconSvg(icon)}${st.label}</button>
      <div class="src-pop${wrap.dataset.src === 'mobile' ? ' below' : ''}" id="${popId}" role="tooltip">
        <ul>${st.reasons.map((r) => `<li>${escapeHtml(r)}</li>`).join('')}</ul></div>`;
  });
  const t = document.getElementById('updatedAt');
  if (state.data) { t.textContent = formatTaipei(state.data.updatedAt); t.dateTime = state.data.updatedAt.toISOString(); }
}

/** 資料模式切換按鈕 */
function renderModeSwitch() {
  document.getElementById('modeSeg').innerHTML = DATA_MODES.map((m) =>
    `<button type="button" data-mode="${m.id}" aria-pressed="${state.dataMode === m.id}">${m.label}</button>`).join('');
}

/** 切換資料模式並重新載入 */
function setDataMode(mode) {
  if (!DATA_MODES.some((m) => m.id === mode) || mode === state.dataMode) return;
  state.dataMode = mode;
  renderModeSwitch();
  refreshData();
}

/** 全部重新渲染 */
function render() {
  renderMarkers();
  renderList();
  renderUserMarker();
  renderSourceStatus();
}

/** 選取跑點：地圖平移並更新畫面 */
function selectSpot(id, { pan = true } = {}) {
  const spot = RUN_SPOTS.find((s) => s.id === id);
  if (!spot) return;
  state.selectedId = id;
  if (pan) map.flyTo([spot.lat, spot.lng], Math.max(map.getZoom(), CONFIG.SPOT_ZOOM), { duration: 0.6 });
  render();
}

/** 綁定 UI 事件 */
function bindUI() {
  // 列表點擊（事件委派）
  document.getElementById('spotList').addEventListener('click', (e) => {
    const btn = e.target.closest('.spot-item');
    if (btn) selectSpot(Number(btn.dataset.id));
  });
  // 資料模式切換
  document.getElementById('modeSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (btn) setDataMode(btn.dataset.mode);
  });
  // 資料來源標記：點擊切換原因說明（觸控裝置無 hover）；點其他地方或按 Esc 關閉
  document.addEventListener('click', (e) => {
    const badge = e.target.closest('.src-badge');
    document.querySelectorAll('.src-wrap').forEach((w) => {
      const toggle = badge && w.contains(badge);
      w.classList.toggle('open', toggle ? !w.classList.contains('open') : false);
      const b = w.querySelector('.src-badge');
      if (b) b.setAttribute('aria-expanded', w.classList.contains('open'));
    });
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') document.querySelectorAll('.src-wrap.open').forEach((w) => w.classList.remove('open'));
  });
  // 版面在 768px 斷點切換時，地圖容器尺寸改變，需通知 Leaflet 重算
  const mq = window.matchMedia('(min-width: 768px)');
  const onChange = () => map.invalidateSize();
  if (mq.addEventListener) mq.addEventListener('change', onChange); else mq.addListener(onChange);
}

/* =====================================================================
   §7-2 定位（Geolocation API）
   ===================================================================== */

/**
 * 取得使用者位置。
 * - 成功：標記藍點；若在台北市範圍內則移至該處，否則保留全市視野並提示。
 * - 失敗 / 拒絕 / 不支援：維持台北車站為中心、縮放 12，並提示「未取得定位」。
 */
function locateUser({ recenter = true } = {}) {
  if (!('geolocation' in navigator)) {
    showToast('未取得定位：此瀏覽器不支援定位，以台北車站為中心顯示');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const first = !state.userPos;
      state.userPos = { lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy };
      // 首次取得定位：重新載入，讓氣象請求納入使用者座標；之後只重算 IDW
      if (first) refreshData(); else if (state.data) computeReadings();
      render();
      if (!recenter) return;
      if (inBBox(state.userPos.lat, state.userPos.lng)) {
        map.flyTo([state.userPos.lat, state.userPos.lng], CONFIG.LOCATED_ZOOM, { duration: 0.8 });
      } else {
        showToast('目前位置不在台北市範圍內，仍以全市跑點顯示');
      }
    },
    (err) => {
      const reason = err && err.code === 1 ? '定位權限被拒絕'
                   : err && err.code === 3 ? '定位逾時'
                   : '無法取得位置';
      showToast(`未取得定位（${reason}），以台北車站為中心顯示`);
    },
    { enableHighAccuracy: true, timeout: CONFIG.GEO_TIMEOUT_MS, maximumAge: 60000 }
  );
}

/* =====================================================================
   §9 通知（第 7 階段實作：背景監測、冷卻、橫幅與 Web Notification）
   ===================================================================== */

/* =====================================================================
   §10 啟動
   ===================================================================== */
function bootstrap() {
  if (typeof L === 'undefined') {
    // Leaflet CDN 載入失敗（例如完全離線）：顯示提示而非空白錯誤
    document.getElementById('map').innerHTML =
      '<p style="padding:96px 24px;color:var(--text-2);text-align:center">地圖元件載入失敗，請確認網路連線後重新整理。</p>';
    return;
  }
  // 網址參數 ?mode=normal | pollution | storm 可直接以指定情境開啟（Demo / 驗收用，不發出任何網路請求）
  try {
    const m = new URLSearchParams(location.search).get('mode');
    if (m && DATA_MODES.some((d) => d.id === m)) state.dataMode = m;
  } catch (e) { /* 忽略無效參數 */ }
  initMap();
  bindUI();
  renderModeSwitch();
  render();
  locateUser({ recenter: true });
  refreshData();
  setInterval(refreshData, CONFIG.REFRESH_MS); // 每 10 分鐘自動更新
}

// 對外提供除錯 / 測試介面（之後階段會加入 evaluate、runTests 等）
window.SafeAir = {
  RUN_SPOTS, CONFIG, PM25_SOURCES, state, haversine, selectSpot,
  idwEstimate, lassAdapter, cleanStations, refreshData, setDataMode, currentTaipeiHourKey,
  classifyIndicator, evaluate, adviceFor, runTests, contrastRatio,
};

bootstrap();
</script>
