# 部署 GitHub Pages，並附上環境部 PM2.5 資料（data/pm25.json）與 Open-Meteo 降雨預報網格（data/rain.json）
# - 觸發：push 到 main、每小時第 45 分（環境部整點資料約 40 分後上線）、手動執行。
# - 資料檔只存在於 Pages 部署內容，不 commit 到任何分支（main 歷史不會每小時增加）。
# - MOENV_API_KEY 只在「抓取」步驟使用，腳本不會印出金鑰。
name: 部署網站與 PM2.5 資料

on:
  push:
    branches: [main]
  schedule:
    # 每小時第 15、45 分（分鐘數在 UTC 與台北時間相同）。GitHub 的排程常延遲 30–90 分鐘、偶爾整個跳過，
    # 實測約每 1–2 小時才跑一次；一小時排兩次可降低「資料超過 3 小時」的機率。
    # 降雨預報 50 分鐘內不重複查 Open-Meteo（fetch_rain.py --min-age-min），所以不會多耗額度。
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7

      - name: 設定 Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 準備網站檔案
        run: |
          mkdir -p _site/data
          cp index.html sw.js manifest.json _site/
          cp -r icons _site/

      - name: 抓取環境部 PM2.5
        env:
          MOENV_API_KEY: ${{ secrets.MOENV_API_KEY }}
          ALLOW_MISSING: ${{ github.event_name == 'push' }}
        run: python3 tools/fetch_moenv.py --out _site/data/pm25.json --fallback-url "${{ steps.pages.outputs.base_url }}/data/pm25.json"

      - name: 抓取降雨預報網格（Open-Meteo；選用功能，失敗不影響部署）
        run: python3 tools/fetch_rain.py --out _site/data/rain.json --fallback-url "${{ steps.pages.outputs.base_url }}/data/rain.json"

      - name: 上傳網站內容
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      # 偶爾會出現「No artifacts named github-pages were found」（上傳成功但 GitHub 還查不到），等一下再試一次通常就好
      - name: 等 30 秒後重試部署
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: 部署（重試）
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
